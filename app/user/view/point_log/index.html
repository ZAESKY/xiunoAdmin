{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">
            <i class="layui-icon layui-icon-star"></i> 积分明细
        </div>
        <div class="layui-card-body">
            <table id="SF_PointTable" lay-filter="SF_PointTable"></table>
        </div>
    </div>
</div>

<script type="text/html" id="SF_PtType">
    {{# var m={recharge:'充值赠送',cdkey_exchange:'卡密兑换',deduct_plugin:'购买插件',plugin_income:'插件收入',exchange:'积分兑换'}; }}
    <span class="layui-badge {{d.amount>0?'layui-badge-green':'layui-badge-blue'}}">{{m[d.type] || d.type}}</span>
</script>
<script type="text/html" id="SF_PtAmount">
    {{# if(d.amount > 0){ }}
    <span style="color:#5cb85c;font-weight:bold;">+{{d.amount}}</span>
    {{# } else { }}
    <span style="color:#d9534f;">{{d.amount}}</span>
    {{# } }}
</script>

{include file="/public/footer"}
<script>
layui.use(['table'], function(){
    var table = layui.table;
    table.render({
        elem: '#SF_PointTable', url: '{:url("/PointLog/index")}', method: 'post', page: true, limit: 15,
        request: { pageName: 'current_page', limitName: 'limit' },
        parseData: function(res){ return { code: res.code, msg: res.msg, count: res.count, data: res.data }; },
        cols: [[
            {field: 'id', title: 'ID', width: 70},
            {field: 'type', title: '类型', width: 100, templet: '#SF_PtType'},
            {field: 'amount', title: '积分变动', width: 120, templet: '#SF_PtAmount'},
            {field: 'integral_after', title: '剩余积分', width: 120, templet: function(d){ return (d.integral_after||0)+' 积分'; }},
            {field: 'description', title: '说明', minWidth: 200},
            {field: 'created_at', title: '时间', width: 170}
        ]]
    });
});
</script>
</body>
</html>
