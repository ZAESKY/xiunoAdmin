
<!DOCTYPE html>
<html lang="{:t('common.lang_code')}">
<head>
    <meta charset="utf-8">
    <title>{$title}|{:t('password_recovery.page_title')}</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="{__LIBS__}layui/css/layui.css"/>
    <link rel="stylesheet" href="{__MODULE__}admin.css?v=318"/>
</head>
<style>
    .login-wrapper { max-width: 420px; padding: 20px; margin: 0 auto; position: relative; box-sizing: border-box; z-index: 2; }
    .login-wrapper > .layui-form { padding: 25px 30px; background-color: #fff; box-shadow: 0 3px 6px -1px rgba(0,0,0,0.19); border-radius: 4px; }
    .login-wrapper > .layui-form > h2 { color: #333; font-size: 18px; text-align: center; margin-bottom: 20px; }
    .login-wrapper > .layui-form > .layui-form-item { margin-bottom: 18px; position: relative; }
    .login-wrapper > .layui-form > .layui-form-item:last-child { margin-bottom: 0; }
    .login-wrapper > .layui-form > .layui-form-item > .layui-input { height: 40px; border-radius: 4px !important; }
    .login-wrapper .layui-btn-fluid { height: 40px; line-height: 40px; border-radius: 4px; background-color: #2d8cf0; border-color: #2d8cf0; }
    .login-copyright { color: #eee; padding-bottom: 20px; text-align: center; position: relative; z-index: 1; }
    @media screen and (min-height: 550px) {
        .login-wrapper { margin: -280px auto 0; position: absolute; top: 50%; left: 0; right: 0; width: 100%; }
        .login-copyright { position: absolute; bottom: 0; right: 0; left: 0; }
    }
</style>
<body style="background-image: url('{__IMG__}background.svg');background-size: cover;">
<a href="javascript:SF_LANG.toggle();" title="{:t('common.language')}" style="position:absolute;right:24px;top:18px;color:#fff;z-index:3;">{:t('common.lang_toggle')}</a>
<div class="login-wrapper layui-anim layui-anim-scale">
    <form class="layui-form layui-card-body" style="padding: 25px 28px;opacity:0.95;">
        <h2>{:t('password_recovery.page_title')}</h2>
        <div class="layui-form-item">
            <input type="text" name="username" placeholder="{:t('password_recovery.username_placeholder')}" class="layui-input" lay-verType="tips" lay-verify="required" autocomplete="off">
        </div>
        <div class="layui-form-item">
            <input type="text" name="email" placeholder="{:t('password_recovery.email_placeholder')}" class="layui-input" lay-verType="tips" lay-verify="required|email">
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block layui-col-space5" style="margin-left:0;">
                <div class="layui-col-lg7 layui-col-md7 layui-col-sm7 layui-col-xs7" style="padding-left:0;">
                    <input type="text" name="code" placeholder="{:t('password_recovery.code_placeholder')}" class="layui-input" lay-verType="tips" lay-verify="required">
                </div>
                <div class="layui-col-lg5 layui-col-md5 layui-col-sm5 layui-col-xs5" style="padding-right:0;">
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-fluid" id="sendResetCode">{:t('password_recovery.send_code')}</button>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <input type="password" name="newPassword" placeholder="{:t('password_recovery.new_password_placeholder')}" class="layui-input" lay-verType="tips" lay-verify="required">
        </div>
        <div class="layui-form-item">
            <input type="password" name="confirmNewPassword" placeholder="{:t('password_recovery.confirm_password_placeholder')}" class="layui-input" lay-verType="tips" lay-verify="required">
        </div>
        <div class="layui-form-item">
            <button type="button" class="layui-btn layui-btn-fluid" id="resetBtn">{:t('password_recovery.reset_button')}</button>
        </div>
        <div class="layui-form-item" style="text-align:center;margin-bottom:0;">
            <a href="{:url('/login/index')}" class="layui-link">{:t('password_recovery.back_login')}</a>
        </div>
    </form>
</div>

<script src="//lib.baomitu.com/jquery/1.12.4/jquery.min.js"></script>
<script type="text/javascript" src="{__LIBS__}layui/layui.js"></script>
<script>window.SF_I18N_LOCALE = "{:t('common.lang_code')}"; window.SF_I18N_MESSAGES = {:json_encode(app()->lang->get(), 271)};</script>
<script type="text/javascript" src="{__JS__}lang.js?v={__I18N_VERSION__}"></script>
<script type="text/javascript" src="{__JS__}common.js?v={__I18N_VERSION__}"></script>
<script>
    layui.use(['layer', 'form', 'admin', 'notice'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var admin = layui.admin;
        var notice = layui.notice;

        var countdown = 0;
        function setTimer(btn, time) {
            countdown = time;
            btn.prop("disabled", true).addClass("layui-disabled");
            var timer = setInterval(function() {
                countdown--;
                if (countdown <= 0) { clearInterval(timer); btn.prop("disabled", false).removeClass("layui-disabled").text(t('password_recovery.send_code')); }
                else { btn.text(countdown + t('password_recovery.retry_suffix')); }
            }, 1000);
        }

        $('#sendResetCode').click(function() {
            var username = $('input[name=username]').val();
            var email = $('input[name=email]').val();
            if (!username) { notice.warning({title:t('common.nice_tips'), message:t('login.please_enter_username'), position:'topCenter', displayMode:'2'}); return; }
            if (!email) { notice.warning({title:t('common.nice_tips'), message:t('registration.enter_email'), position:'topCenter', displayMode:'2'}); return; }
            if (countdown > 0) return;
            notice.msg(t('registration.sending'), {icon:4, close:true});
            $.ajax({
                type: "POST", url: "{:url('/login/sendResetCode')}",
                data: {username: username, email: email}, dataType: "json",
                success: function(r) {
                    notice.destroy();
                    if (r.code == 0) { notice.msg(t('password_recovery.code_sent'), {icon:1}); setTimer($('#sendResetCode'), 60); }
                    else { notice.error({title:t('common.nice_tips'), message:r.msg, position:'topCenter', displayMode:'2'}); }
                }
            });
        });

        $('#resetBtn').click(function() {
            var username = $('input[name=username]').val(), email = $('input[name=email]').val();
            var code = $('input[name=code]').val(), pass = $('input[name=newPassword]').val();
            var cpass = $('input[name=confirmNewPassword]').val();
            if (!username) { layer.msg(t('password_recovery.username_placeholder')); return; }
            if (!email) { layer.msg(t('password_recovery.email_placeholder')); return; }
            if (!code) { layer.msg(t('password_recovery.code_placeholder')); return; }
            if (!pass || pass.length < 6) { layer.msg(t('password_recovery.password_length')); return; }
            if (pass != cpass) { layer.msg(t('password_recovery.password_mismatch')); return; }
            var load = layer.load();
            $.ajax({
                type: "POST", url: "{:url('/login/forgot')}",
                data: {username:username, email:email, code:code, newPassword:pass},
                dataType: "json",
                success: function(r) {
                    layer.close(load);
                    if (r.code == 0) { layer.msg(t('password_recovery.reset_success'), {icon:1}, function(){ location.href = '{:url("/login/index")}'; }); }
                    else { layer.msg(r.msg); }
                },
                error: function() { layer.close(load); layer.msg(t('common.server_error')); }
            });
        });
    });
</script>
</body>
</html>
