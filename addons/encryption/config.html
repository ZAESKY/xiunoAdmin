{include file="/public/header"}
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form formBasForm">
                <input type="hidden" id="totalPage" value="0"/>
                <input type="hidden" id="page" value="1"/>
                <input type="hidden" id="status" value="0"/>
                <input type="hidden" name="filename" value=""/>
                <div class="layui-form-item">
                    <label class="layui-form-label layui-form-required">{:t('encryption_ui.type')}:</label>
                    <div class="layui-input-block">
                        <select id="type" name="type" class="layui-input ew-select-fixed" lay-filter="type" lay-search>
                            <option value="">{:t('encryption.select_type')}</option>
                        </select>
                    </div>
                </div>
                
                <div id="introduceDisplay" class="sf-toggle-section">
                    <div class="layui-form-item">
                        <div class="sf-tips">
                            <div id="introduce"></div>
                        </div>
                    </div>
                </div>       
                
                <div id="versionSelection" class="sf-toggle-section">
                    <div class="layui-form-item">
                        <label class="layui-form-label layui-form-required">{:t('encryption_ui.php_version')}:</label>
                        <div class="layui-input-block">
                              <input type="checkbox" name="version[]" value="5.4" title="PHP 5.4">
                              <input type="checkbox" name="version[]" value="5.5" title="PHP 5.5">
                              <input type="checkbox" name="version[]" value="5.6" title="PHP 5.6">
                              <input type="checkbox" name="version[]" value="7.0" title="PHP 7.0">
                              <input type="checkbox" name="version[]" value="7.1" title="PHP 7.1">
                              <input type="checkbox" name="version[]" value="7.2" title="PHP 7.2">
                              <input type="checkbox" name="version[]" value="7.3" title="PHP 7.3">
                              <input type="checkbox" name="version[]" value="7.4" title="PHP 7.4">
                              <input type="checkbox" name="version[]" value="8.0" title="PHP 8.0">
                              <input type="checkbox" name="version[]" value="8.1" title="PHP 8.1">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label layui-form-required">{:t('encryption_ui.copyright')}</label>
                    <div class="layui-input-block">
                        <textarea name="comment" class="layui-textarea" style="height:100px" placeholder="{:t('encryption_ui.copyright_placeholder')}"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label layui-form-required">{:t('add_code.upload_file')}:</label>
                    <div class="layui-input-block">
                        <div class="layui-upload-drag" id="fileUpload">
                            <i class="layui-icon layui-icon-upload-drag sf-upload-icon"></i>
                            <p>{:t('version_ui.drag_upload')}</p>
                            <div class="layui-hide" id="uploadDemoView">
                                <hr>
                                <div class="layui-form-item">
                                    <img src="" alt="{:t('app_ui.upload_preview_alt')}" id="demo1" class="sf-upload-preview">
                                </div>
                                <div class="layui-form-item">
                                    <label class="layui-form-label">{:t('upload.file_name')}</label>
                                    <div class="layui-input-block">
                                        <input type="text" name="name" id="name" value="" lay-verify="title" autocomplete="off" readonly="true" class="layui-input">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="sf-upload-mask mask"></div>
                <div class="sf-upload-progress loading">
                    <div class="layui-progress layui-progress-big" lay-showpercent="true" lay-filter="uploadProgress">
                        <div class="layui-progress-bar" lay-percent="0%"></div>
                    </div>
                </div>
                <div class="layui-form-item text-right">
                    <button class="layui-btn" lay-filter="SF_EditSubmit" lay-submit>{:t('add_code.start')}</button>
                    <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">{:t('common.reset')}</button>
                </div>
                <div class="layui-form-item">
                    <div class="sf-tips">
                        {:t('encryption_ui.help')}
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{include file="/public/footer"}
<script>
    layui.use(['layer', 'form', 'admin', 'notice' ,'upload', 'element'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var admin = layui.admin;
        var notice = layui.notice;
        var upload = layui.upload;
        var element = layui.element;

        $(function (){
            notice.msg(window.t('common.loading'), {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: '{:addons_url("Encryption/list")}',
                dataType: "json",
                success: function(data) {
                    notice.destroy();
                    var content = '<option value="">'+window.t('encryption.select_type')+'</option>';
                    $.each(data,function(index, value){
                        content += '<option value="'+index+'" versionSelection="'+value.versionSelection+'" introduce="'+value.introduce+'">'+value.name+'</option>';
                    });
                    $("#type").html(content);
                    form.render('select');
                    notice.msg(data.msg, {icon: 1, audio:'1'});
                
                },
                error: function() {
                    notice.destroy();
                    notice.msg(window.t('common.server_error'), {icon: 2, audio:'1'});
                }
            });
        });

        upload.render({
            elem: '#fileUpload',
            url: '{:url("/Upload/temp")}', //处理上传文件接口
            accept: 'file',
            auto: false,
            acceptMime: '*.*',//允许上传的文件类型
            choose: function (obj) {
                element.progress('uploadProgress', '0%');
                $('.mask').show();
                $('.loading').show();
                var data = this.data;
                var files = obj.pushFile();
                var LENGTH = 500 * 1024; //每片文件大小
                obj.preview(function (index, file, result) {
                    var totalSize = file.size;
                    var totalPage = Math.ceil(totalSize / LENGTH);
                    $('#totalPage').val(totalPage);
                    $('#page').val('1');
                    $('#status').val('1');
                    var fileName = file.name;
                    $('#name').val(fileName);
                    var fileExt = fileName.substr(fileName.lastIndexOf('.') + 1);
                    fileName = fileName.substr(0, fileName.lastIndexOf('.'));
                    var progressTimer = setInterval(function () {
                        var totalPage = parseInt($('#totalPage').val());
                        var page = parseInt($('#page').val());
                        var status = $('#status').val();
                        if (parseInt(totalPage) == parseInt(page) && (parseInt(status) == 2 || parseInt(status) == -1)) {
                            clearInterval(progressTimer);
                        } else {
                            if (status == 1) {
                                $('#status').val('0');
                                data.fileName = fileName;
                                data.page = page;
                                data.totalPage = totalPage;
                                data.fileExt = fileExt;
                                obj.upload(index, file.slice((page - 1) * LENGTH, page * LENGTH));
                            }
                        }
                    }, 100);
                });
            },
            done: function (res) {
                if(res.code == 0) {
                    if (res.data.status == 1) { //分片上传
                        var page = parseInt($('#page').val());
                        var totalPage = parseInt($('#totalPage').val());
                        element.progress('uploadProgress', Math.ceil(page * 100 / totalPage) + '%');
                        page = page + 1;
                        $('#page').val(page);
                        $('#status').val('1');
                    } else if (res.data.status == 2) { //上传完成
                        element.progress('uploadProgress', '100%');
                        $('#status').val('2');
                        layui.$('#uploadDemoView').removeClass('layui-hide').find('img').attr('src', '{__MODULE__}fileChoose/img/zip.png');
                        notice.msg(window.t('upload.upload_success'), {icon: 1,audio: '1',onOpening: function () {
                                $('.mask').hide();
                                $('.loading').hide();}
                        });
                    } else { //上传错误
                        $('#status').val('-1');
                        element.progress('uploadProgress', '0%');
                        if (typeof (res.data.downUrl) == "undefined") {
                        } else {
                            $('#downUrl').val(res.data.downUrl);
                        }
                        notice.msg(res.msg, {icon: 2,audio: '1',onOpening: function () {
                                $('.mask').hide();
                                $('.loading').hide();}
                        });
                    }
                }else{
                    $('#status').val('-1');
                    element.progress('uploadProgress', '0%');
                    if (typeof (res.data.downUrl) == "undefined") {
                    } else {
                        $('#downUrl').val(res.data.downUrl);
                    }
                    notice.msg(res.msg, {icon: 2,audio: '1',onOpening: function () {
                            $('.mask').hide();
                            $('.loading').hide();}
                    });
                }
            },
            error: function(){
                notice.msg(window.t('common.server_error'), {icon: 2,audio: '1',onOpening: function () {
                        $('.mask').hide();
                        $('.loading').hide();}
                });
            }
        });

        form.on('select(type)', function (data) {
            let versionSelection = $("#type option:selected").attr('versionSelection');
            let introduce = $("#type option:selected").attr('introduce');
            if (versionSelection == '1') {
                $("#versionSelection").css("display", "inherit");
            }else{
                $("#versionSelection").css("display", "none");
            }
            
            if(data.value == ''){
                $("#introduceDisplay").css("display", "none");
            }else{
                $("#introduceDisplay").css("display", "inherit");
                $("#introduce").html(introduce);
            }
        });
        
        form.on('submit(SF_EditSubmit)', function (data) {
            notice.msg(window.t('common.loading'), {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: '{:addons_url("Encryption/index")}',
                data: data.field,
                dataType: "json",
                success: function(data) {
                    notice.destroy();
                    if (data.code == 0) {
                        notice.msg(data.msg, {icon: 1, audio:'1'});
                        layui.$('#uploadDemoView').addClass('layui-hide');
                        parent.layui.admin.confirm(window.t('download.confirm_file', {name: data.data}), {icon:3}, function (index) {
                            window.open('{:addons_url("Encryption/download")}?name='+data.data);
                            parent.layer.close(index);
                        });
                    } else {
                        notice.msg(data.msg, {icon: 2, audio:'1'});
                    }
                },
                error: function() {
                    notice.destroy();
                    notice.msg(window.t('common.server_error'), {icon: 2, audio:'1'});
                }
            });
            return false;
        });

    });
</script>
