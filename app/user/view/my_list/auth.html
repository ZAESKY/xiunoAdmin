{include file="/public/header"}
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            <div class="layui-form-item formBasForm">
                <div class="sf-tag layui-badge-blue">
                    {$replace_notice|default='暂无公告'}
                </div>
            </div>
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">内&emsp;容</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="输入ID或授权内容或QQ"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">状&emsp;态</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">选择状态</option>
                                <option value="1">正常</option>
                                <option value="0">封禁</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>搜索
                        </button>
                    </div>
                </div>
            </form>
            <!-- 数据表格 -->

            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>
<!-- 表格操作列 -->
<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-primary layui-btn-sm" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>修改</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon layui-icon-delete"></i>取绑</a>
</script>
<!-- 表格状态列 -->

<script type="text/html" id="SF_Tbid">
    <span id="SF_span_{{d.id}}">{{d.status==1?'<span class="layui-badge-dot layui-bg-sf-indigo" style="height: 6px;width: 6px;position: relative;top: -2px"></span></span> '+d.id:'<span class="layui-badge-dot layui-bg-red" style="height: 6px;width: 6px;position: relative;top: -2px"></span></span> '+d.id}}
</script>
<!-- 表单弹窗 -->
<script type="text/html" id="SF_EditDialog">
    <form id="SF_EditForm" lay-filter="SF_EditForm" class="layui-form model-form">
        <input name="id" type="hidden"/>

        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">授权内容:</label>
            <div class="layui-input-block">
                <input type="text" name="auth_info" placeholder="请输入授权的内容" class="layui-input"
                       lay-verType="tips" lay-verify="required"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">QQ:</label>
            <div class="layui-input-block">
                <input type="number" name="qq" placeholder="请输入授权者QQ" class="layui-input"
                       lay-verType="tips" lay-verify="required"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">授权时间:</label>
            <div class="layui-input-block">
                <select id="auth_price_list" name="type" class="layui-input ew-select-fixed" lay-filter="type">
                    <option value="">请选择授权时间</option>
                </select>
            </div>
        </div>
        <div id="diy" style="display: none">
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">到期时间:</label>
                <div class="layui-input-block">
                    <input type="text" id="test" name="endtime" placeholder="请选择到期时间" class="icon-date layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">更换价格:</label>
            <div class="layui-input-block">
                <input type="text" name="remainderReplacePrice" class="layui-input layui-disabled"
                       lay-verType="tips" disabled/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">续费价格:</label>
            <div class="layui-input-block">
                <input type="text" id="input_price" name="price" value="￥0" class="layui-input layui-disabled"
                       lay-verType="tips" disabled/>
            </div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="SF_EditSubmit" lay-submit>保存</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">取消</button>
        </div>
    </form>
</script>

{include file="/public/footer"}
<script>
    layui.use(['layer', 'form', 'table', 'admin', 'notice', 'laydate', 'jquery'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var admin = layui.admin;
        var notice = layui.notice;
        var laydate = layui.laydate;

        /* 渲染表格 */
        var insTb = table.render({
            elem: '#SF_Table',
            url: '{:url("/MyList/auth")}',
            method: 'post',
            page: true,
            skin: 'line',
            size: 'lg',
            toolbar: ['<p>',
                '<button lay-event="add" class="layui-btn layui-btn-sm icon-btn"><i class="layui-icon">&#xe654;</i>绑定</button>&nbsp;',
                '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>取绑</button>',
                '</p>'].join(''),
            cellMinWidth: 100,
            request: {
                pageName: 'current_page' //页码的参数名称，默认：page
                ,limitName: 'limit' //每页数据量的参数名，默认：limit
            },
            parseData: function(res){ //res 即为原始返回的数据
                return {
                    "code": res.code, //解析接口状态
                    "msg": res.msg, //解析提示文本
                    "count": res.data.data.total, //解析数据长度
                    "data": res.data.data.data //解析数据列表
                };
            },
            cols: [[
                {type: 'checkbox', fixed: true},
                {field: 'id', title: 'ID', templet: '#SF_Tbid', sort: true, width: 80, fixed: true},
                {field: 'appName', title: '所属应用', sort: true, minWidth: 120, templet: function (d) {
                        return '<span class="layui-badge layui-badge-orange">'+d.appName+'</span>';
                    }},
                {field: 'auth_info', title: '授权内容', sort: true, minWidth: 160},
                {field: 'qq', title: '授权者QQ', sort: true, minWidth: 120},
                {
                    field: 'endtime', title: '到期时间', align: 'right', templet: function (d) {
                        if (d.permanent_switch == '1') {
                            return '<span class="layui-badge layui-badge-green">永久授权</span>';
                        } else {
                            if(checkEndTime(d.endtime) == false){
                                return '<span class="layui-badge layui-badge-orange">授权已到期</span>';
                            }else{
                                return '<span class="layui-badge layui-badge-blue">'+d.endtime+'</span>';
                            }
                        }
                    }, sort: true, minWidth: 180
                },
                {field: 'authcode', title: '更多信息', minWidth: 100, templet: function (d) {
                        return '<a class="layui-btn layui-btn-xs" lay-event="seeInfo">点击查看</a>';
                    }
                },
                {field: 'sign', title: '特征码', sort: true, minWidth: 100},
                {field: 'addtime', title: '添加时间', sort: true, minWidth: 160},
                {field: 'status', title: '状态', sort: true, minWidth: 80, templet: function (d) {
                        if(d.status == 1){
                            return '<span class="layui-badge layui-badge-green">正常</span>';
                        }else{
                            return '<span class="layui-badge layui-badge-red">封禁</span>';
                        }
                    }
                },
                {title: '操作', toolbar: '#SF_TbBar', align: 'center', minWidth: 180}
            ]]
        });
        function checkEndTime(date){
            var oDate1 = new Date();
            var oDate2 = new Date(date);
            if(oDate1.getTime() > oDate2.getTime()){
                return false;
            } else  if(oDate1.getTime() < oDate2.getTime()){
                return true;
            }else if(oDate1.getTime() == oDate2.getTime()){
                return false;
            }
        }

        form.on('select(type)', function (data) {
            let diy = $("#auth_price_list option:selected").attr('diy');
            let price = $("#auth_price_list option:selected").attr('price');
            if (diy == "1") {
                $("#diy").css("display", "inherit");
                if(data.value == ''){
                    $('#input_price').val('请先输入到期时间！');
                }else{
                    $('#input_price').val('￥0');
                }
            }else{
                $("#diy").css("display", "none");
                if(data.value == ''){
                    $('#input_price').val('请先选择授权时间！');
                }else{
                    $('#input_price').val('￥' + price * {$userInfo['addauth_discount']});
                }
            }
        });

        /* 表格搜索 */
        form.on('submit(SF_TbSearch)', function (data) {
            insTb.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        function DateDiff(sDate2, sDate1) {
            var aDate, oDate1, oDate2, iDays, info, time;

            if(sDate1 == null){
                oDate1 = new Date();  //转换为yyyy-MM-dd格式
            } else {
                info = sDate1.split(" ");
                aDate = info[0].split("-");
                oDate1 = new Date(aDate[0] + '-' + aDate[1] + '-' + aDate[2]);
            }

            info = sDate2.split(" ");
            aDate = info[0].split("-");
            time = info[1].split(":");
            oDate2 = new Date(aDate[0] + '-' + aDate[1] + '-' + aDate[2]);
            iDays = Math.ceil((oDate2 - oDate1) / 1000 / 60 / 60 / 24); //把相差的毫秒数转换为天数
            if(time[0] != '00' || time[1] != '00' || time[2] != '00'){
                iDays++;
            }
            if(iDays < 0){
                iDays = 0;
            }
            return iDays;  //返回相差天数
        }

        /* 表格工具条点击事件 */
        table.on('tool(SF_Table)', function (obj) {
            if (obj.event === 'edit') { // 修改
                showEditModel(obj.data);
            } else if (obj.event === 'del') { // 删除
                doDel(obj);
            } else if (obj.event === 'seeInfo') {
                admin.open({
                    title: '查看授权 '+obj.data.auth_info+' 信息',
                    type: 1,
                    content: '<div class="layui-card">' +
                        '<div class="layui-card-body layui-form layui-form-pane">' +
                        '<div class="layui-form-item" pane>' +
                        '<label class="layui-form-label">授权码</label>' +
                        '<div class="layui-input-block">' +
                        '<input type="text" id="copy" class="layui-input layui-disabled" value="'+obj.data.authcode+'"/>' +
                        '</div>' +
                        '</div>' +
                        '<div class="layui-form-item layui-form-text">' +
                        '<label class="layui-form-label">限制IP</label>' +
                        '<div class="layui-input-block">' +
                        '<textarea name="ip" class="layui-textarea layui-disabled" style="height:100px" placeholder="无限制" disabled>'+obj.data.ip+'</textarea>' +
                        '</div>' +
                        '</div>' +
                        '<a class="layui-btn layui-btn-fluid" onclick="copy()">复制授权码</a></div></div>'
                });
            }
            laydate.render({
                elem: '#test', //指定元素
                mark: {
                    '0-3-15': 'SF'
                },
                type: 'datetime',
                trigger: 'click',
                done: function(value, date){
                    let price = $("#auth_price_list option:selected").attr('price');
                    let day = $("#auth_price_list option:selected").attr('day');
                    if(value == ''){
                        $('#input_price').val('请先输入到期时间！');
                    }else{
                        $('#input_price').val('￥' + (DateDiff(value, obj.data.endtime) * Math.ceil((price / day) * 100) / 100) * {$userInfo['addauth_discount']});
                    }
                }
            });
        });

        window.copy = function (){
            notice.msg('正在执行中..', {icon: 4, close: true});
            var e = document.getElementById("copy");
            e.select();
            document.execCommand("Copy");//执行复制
            notice.destroy();
            notice.msg('复制成功！', {icon: 1, audio:'1'});
        }

        /* 表格头工具栏点击事件 */
        table.on('toolbar(SF_Table)', function (obj) {
            if (obj.event === 'add') { // 添加
                binding();
            } else if (obj.event === 'del') { // 删除
                var checkRows = table.checkStatus('SF_Table');
                if (checkRows.data.length === 0) {
                    notice.msg('请选择要删除的数据！', {icon: 3, audio:'1'});
                    return;
                }
                var ids = checkRows.data.map(function (d) {
                    return d.id;
                });
                console.log(ids)
                doDel({ids: ids});
            }
        });

        function binding(){
            admin.open({
                type: 2,
                title: '扫码绑定授权',
                content: '/qrlogin/qrlogin.html',
                area: ['400px', '300px'],
                data: {type:'binding',bindingType:'auth'}
            });
        }

        form.on('checkbox(allChoose)', function (data) {
            $("input[name='list[]']").each(function () {
                this.checked = data.elem.checked;
            });
            form.render('checkbox');
            return false;
        });

        form.on('submit(BindingSubmit)', function (data) {
            data.field.bindingType = 'auth';
            notice.msg('正在执行中..', {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: '/api.php/Qrlogin/binding',
                data: data.field,
                dataType: "json",
                success: function(data) {
                    notice.destroy();
                    layer.closeAll();
                    if(data.code == 0){
                        table.reload('SF_Table');
                        notice.success({
                            title: '绑定通知',
                            message: data.msg,
                            animateInside:true,
                            position:'topCenter',
                            transitionOut:'flipOutX',
                            transitionOutMobile: 'flipOutX',
                            displayMode:'2',
                            audio:'1'
                        });
                    }else{
                        notice.error({
                            title: '绑定通知',
                            message: data.msg,
                            animateInside:true,
                            position:'topCenter',
                            transitionOut:'flipOutX',
                            transitionOutMobile: 'flipOutX',
                            displayMode:'2',
                            audio:'1'
                        });
                    }
                },
                error: function() {
                    notice.destroy();
                    notice.error({
                        title: '绑定通知',
                        message: '服务器错误',
                        animateInside:true,
                        position:'topCenter',
                        transitionOut:'flipOutX',
                        transitionOutMobile: 'flipOutX',
                        displayMode:'2',
                        audio:'1'
                    });
                }
            });
            return false;
        });
        /* 显示表单弹窗 */
        function showEditModel(mData) {
            admin.popupRight({
                type: 1,
                title: '编辑授权',
                content: $('#SF_EditDialog').html(),
                success: function (layero, dIndex) {

                    notice.msg('正在获取列表中..', {icon: 4, close: true});
                    $.ajax({
                        type: "POST",
                        url: '{:url("/Auth/getAuthPriceList")}',
                        dataType: "json",
                        success: function(data) {
                            notice.destroy();
                            if (data.code == 0) {
                                notice.msg("获取列表成功！", {icon: 1, audio:'1'});
                                var content = '<option value="-1" diy="0" day="0" price="0">不续费</option>';
                                $.each(data.data,function(index, value){
                                    $.each(value,function(index, value){
                                        if(value.diy_switch == 1){
                                            content += '<option value="'+value.id+'" diy="1" day="'+value.day+'" price="'+value.money+'">'+value.name+'</option>';
                                        }else{
                                            content += '<option value="'+value.id+'" diy="0" price="'+value.money+'">'+value.name+'</option>';
                                        }
                                    });
                                });
                                $("#auth_price_list").html(content);
                            } else {
                                notice.msg(data.msg, {icon: 2, audio:'1'});
                            }
                            form.render();
                            form.val('SF_EditForm', mData);
                        },
                        error: function() {
                            notice.destroy();
                            notice.msg("服务器错误！", {icon: 2, audio:'1'});
                        }
                    });
                    // 表单提交事件
                    form.on('submit(SF_EditSubmit)', function (data) {
                        notice.msg('正在执行中..', {icon: 4, close: true});
                        data.field.bindingType = 'auth';
                        $.ajax({
                            type: "POST",
                            url: '{:url("/MyList/editBinding")}',
                            data: data.field,
                            dataType: "json",
                            success: function(data) {
                                notice.destroy();
                                if (data.code == 0) {
                                    table.reload('SF_Table');
                                    notice.msg(data.msg, {icon: 1, audio:'1'});
                                } else {
                                    notice.msg(data.msg, {icon: 2, audio:'1'});
                                }
                            },
                            error: function() {
                                notice.destroy();
                                notice.msg("服务器错误！", {icon: 2, audio:'1'});
                            }
                        });
                        return false;
                    });
                    // 禁止弹窗出现滚动条
                    $(layero).children('.layui-layer-content').css('overflow', 'visible');
                }
            });
        }

        /* 删除 */
        function doDel(obj) {
            layer.confirm('确定要取绑选中数据吗？', {
                skin: 'layui-layer-admin',
                icon: 3,
                shade: .1
            }, function (i) {
                layer.close(i);
                notice.msg('正在执行中..', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url: obj.data ? '{:url("/MyList/unbind")}' : '{:url("/MyList/batchUnbind")}',
                    data: {type:'auth', id: obj.data ? obj.data.id : obj.ids.join(',')},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            table.reload('SF_Table');
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                        }else{
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg("服务器错误！", {icon: 2, audio:'1'});
                    }
                });
            });
        }
    });
</script>
