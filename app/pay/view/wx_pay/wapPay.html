<html lang="{:t('common.lang_code')}">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <meta name="renderer" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{:t('payment_ui.wx_pay')}</title>
    <link href="//cdn.staticfile.org/twitter-bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<div class="col-xs-12 col-sm-10 col-md-8 col-lg-6 center-block" style="float: none;">
    <div class="panel panel-primary">
        <div class="panel-heading" style="text-align: center;">
            <h3 class="panel-title">
            {:t('payment_ui.wx_pay')}
            </h3>
        </div>
        <div class="list-group" style="text-align: center;">
            <div class="list-group-item list-group-item-info">{:t('payment_ui.save_scan_pay')}</div>
            <div class="list-group-item">
                <div class="qr-image" id="qrcode"></div>
            </div>
            <div class="list-group-item list-group-item-info">{:t('payment_ui.copy_link_wx')}</div>
            <div class="list-group-item" style="word-wrap: break-word;">
                <a href="{$target_url}">{$target_url}</a><br/><button id="copy-btn" data-clipboard-text="{$target_url}" class="btn btn-info btn-sm">{:t('payment_ui.one_click_copy')}</button>
            </div>
            <div class="list-group-item"><small>{:t('payment_ui.pay_tip')}</small></div>
            <div class="list-group-item"><a href="weixin://" class="btn btn-primary">{:t('payment_ui.open_wx')}</a>&nbsp;<a href="#" onclick="checkresult()" class="btn btn-success">{:t('payment_ui.check_pay_status')}</a></div>
        </div>
    </div>
</div>
<script src="//cdn.staticfile.org/jquery/1.12.4/jquery.min.js"></script>
<script src="//cdn.staticfile.org/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
<script src="//cdn.staticfile.org/clipboard.js/1.7.1/clipboard.min.js"></script>
<script>
    var clipboard = new Clipboard('#copy-btn');
    clipboard.on('success', function(e) {
        layer.msg({:json_encode(t('payment_ui.copy_link_success_wx'), 271)});
    });
    clipboard.on('error', function(e) {
        layer.msg({:json_encode(t('payment_ui.copy_link_failed_manual'), 271)});
    });
    $('#qrcode').qrcode({
        text: "{$target_url}",
        width: 230,
        height: 230,
        foreground: "#000000",
        background: "#ffffff",
        typeNumber: -1
    });
    // 检查是否支付完成
    function loadmsg() {
        $.ajax({
            type: "POST",
            dataType: "json",
            url: "{:url('/Index/getPayResult')}",
            timeout: 10000, //ajax请求超时时间10s
            data: {type: "wxpay", trade_no: "{$row['trade_no']}"}, //post数据
            success: function (data, textStatus) {
                //从服务器得到数据，显示数据并继续查询
                if (data.code == 0) {
                    if (confirm({:json_encode(t('confirm.payment_done'), 271)})) {
                        window.location.href=data.data.backurl;
                    } else {
                        // 用户取消
                    }
                }else{
                    setTimeout("loadmsg()", 4000);
                }
            },
            //Ajax请求超时，继续查询
            error: function (XMLHttpRequest, textStatus, errorThrown) {
                if (textStatus == "timeout") {
                    setTimeout("loadmsg()", 1000);
                } else { //异常
                    setTimeout("loadmsg()", 4000);
                }
            }
        });
    }
    function checkresult() {
        $.ajax({
            type: "POST",
            dataType: "json",
            url: "{:url('/Index/getPayResult')}",
            timeout: 10000, //ajax请求超时时间10s
            data: {type: "wxpay", trade_no: "{$row['trade_no']}"}, //post数据
            success: function (data, textStatus) {
                //从服务器得到数据，显示数据并继续查询
                if (data.code == 0) {
                    if (confirm({:json_encode(t('confirm.payment_done'), 271)})) {
                        window.location.href=data.data.backurl;
                    } else {
                        // 用户取消
                    }
                }
            }
        });
    }
    window.onload = loadmsg();
</script>
</body>
</html>
