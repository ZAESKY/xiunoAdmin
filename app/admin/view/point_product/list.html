{include file="/public/header"}
<style>
    .point-product-cover{width:44px;height:44px;object-fit:cover;border-radius:4px;background:#f5f5f5;}
    .point-upload-preview{margin-top:8px;}
    .point-upload-preview img{width:88px;height:88px;object-fit:cover;border-radius:4px;border:1px solid #eee;}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">商品</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="输入ID或商品名称"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">状态</label>
                        <div class="layui-input-inline">
                            <select name="status">
                                <option value="">全部状态</option>
                                <option value="1">上架</option>
                                <option value="0">下架</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>搜索
                        </button>
                        <button type="button" class="layui-btn layui-btn-normal icon-btn" id="SF_Add">
                            <i class="layui-icon">&#xe654;</i>新增商品
                        </button>
                    </div>
                </div>
            </form>
            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>

<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-primary layui-btn-sm" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del">删除</a>
</script>

<script type="text/html" id="SF_Status">
    <input type="checkbox" lay-filter="SF_StatusCk" value="{{d.id}}" lay-skin="switch"
           lay-text="上架|下架" {{d.status==1?'checked':''}}/>
</script>

<script type="text/html" id="SF_EditDialog">
    <form id="SF_EditForm" lay-filter="SF_EditForm" class="layui-form model-form">
        <input name="id" type="hidden"/>
        <input name="image" type="hidden"/>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">商品名称</label>
            <div class="layui-input-block">
                <input name="name" class="layui-input" lay-verify="required" placeholder="请输入商品名称"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">商品图片</label>
            <div class="layui-input-block">
                <button type="button" class="layui-btn layui-btn-primary" id="SF_UploadImage">
                    <i class="layui-icon layui-icon-upload"></i>上传图片
                </button>
                <div class="point-upload-preview layui-hide" id="SF_ImagePreview">
                    <img src="" alt="商品图片"/>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">所需积分</label>
            <div class="layui-input-block">
                <input type="number" name="required_points" class="layui-input" min="1" step="1" lay-verify="required|number"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">用户上限</label>
            <div class="layui-input-block">
                <input type="number" name="exchange_limit" class="layui-input" min="0" step="1" placeholder="0表示不限制"/>
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">商品描述</label>
            <div class="layui-input-block">
                <textarea name="description" class="layui-textarea" placeholder="展示给用户的说明"></textarea>
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label layui-form-required">奖品信息</label>
            <div class="layui-input-block">
                <textarea name="reward_info" class="layui-textarea" style="min-height:160px;" lay-verify="required" placeholder="一行一个奖品码或虚拟商品内容。用户每次兑换会随机发放其中一行，并自动标记为已发放。"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <input type="checkbox" name="status" value="1" lay-skin="switch" lay-text="上架|下架" checked/>
            </div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="SF_EditSubmit" lay-submit>保存</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">取消</button>
        </div>
    </form>
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'admin', 'notice', 'upload'], function () {
    var $ = layui.jquery;
    var form = layui.form;
    var table = layui.table;
    var admin = layui.admin;
    var notice = layui.notice;
    var upload = layui.upload;

    var insTb = table.render({
        elem: '#SF_Table',
        url: '{:url("/PointProduct/list")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        request: {pageName: 'current_page', limitName: 'limit'},
        parseData: function(res){
            return {code: res.code, msg: res.msg, count: res.data.data.total || 0, data: res.data.data.data || []};
        },
        cols: [[
            {field: 'id', title: 'ID', width: 70, sort: true},
            {field: 'image', title: '图片', width: 90, templet: function(d){
                return d.image ? '<img class="point-product-cover" src="'+escapeAttr(d.image)+'">' : '-';
            }},
            {field: 'name', title: '商品名称', minWidth: 170},
            {field: 'required_points', title: '所需积分', width: 110, sort: true},
            {field: 'stock', title: '剩余库存', width: 100, sort: true},
            {field: 'exchange_limit', title: '用户上限', width: 100, templet:function(d){return d.exchange_limit > 0 ? d.exchange_limit : '不限';}},
            {field: 'status', title: '状态', width: 100, templet: '#SF_Status'},
            {field: 'created_at', title: '创建时间', minWidth: 170},
            {title: '操作', toolbar: '#SF_TbBar', align: 'center', width: 150}
        ]]
    });

    form.on('submit(SF_TbSearch)', function (data) {
        insTb.reload({where: data.field, page: {curr: 1}});
        return false;
    });

    $('#SF_Add').on('click', function(){ showEdit(); });

    table.on('tool(SF_Table)', function(obj){
        if (obj.event === 'edit') showEdit(obj.data);
        if (obj.event === 'del') doDel(obj);
    });

    form.on('switch(SF_StatusCk)', function(obj){
        $.post('{:url("/PointProduct/setStatus")}', {id: obj.value, status: obj.elem.checked ? 1 : 0}, function(res){
            notice.msg(res.msg, {icon: res.code == 0 ? 1 : 2});
            if (res.code != 0) insTb.reload();
        }, 'json');
    });

    function showEdit(data) {
        admin.open({
            type: 1,
            title: (data ? '编辑' : '新增') + '积分商品',
            area: ['720px', '700px'],
            content: $('#SF_EditDialog').html(),
            success: function(layero, index){
                var initData = data || {stock:0, exchange_limit:0, status:1};
                form.val('SF_EditForm', initData);
                if (initData.image) {
                    $(layero).find('#SF_ImagePreview').removeClass('layui-hide').find('img').attr('src', initData.image);
                }
                form.render();

                upload.render({
                    elem: $(layero).find('#SF_UploadImage')[0],
                    url: '{:url("/Upload/image")}',
                    before: function(obj){
                        obj.preview(function(index, file, result){
                            $(layero).find('#SF_ImagePreview').removeClass('layui-hide').find('img').attr('src', result);
                        });
                        notice.msg('上传中...', {icon: 4, close: true});
                    },
                    done: function(res){
                        notice.destroy();
                        if(res.code == 0){
                            $(layero).find('input[name="image"]').val(res.data.path);
                            $(layero).find('#SF_ImagePreview').removeClass('layui-hide').find('img').attr('src', res.data.path);
                            notice.msg('上传成功！', {icon: 1, audio:'1'});
                        }else{
                            notice.msg(res.msg || '上传失败！', {icon: 2, audio:'1'});
                        }
                    },
                    error: function(){
                        notice.destroy();
                        notice.msg('上传失败！', {icon: 2, audio:'1'});
                    }
                });

                form.on('submit(SF_EditSubmit)', function(fd){
                    $.post('{:url("/PointProduct/edit")}', fd.field, function(res){
                        notice.msg(res.msg, {icon: res.code == 0 ? 1 : 2});
                        if (res.code == 0) { layer.close(index); insTb.reload(); }
                    }, 'json');
                    return false;
                });
            }
        });
    }

    function doDel(obj) {
        layer.confirm('确定删除该商品吗？', {icon: 3, shade: .1}, function(i){
            layer.close(i);
            $.post('{:url("/PointProduct/drop")}', {id: obj.data.id}, function(res){
                notice.msg(res.msg, {icon: res.code == 0 ? 1 : 2});
                if (res.code == 0) insTb.reload();
            }, 'json');
        });
    }

    function escapeAttr(value){
        return String(value || '').replace(/[&<>"']/g, function(s){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];});
    }
});
</script>
