{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('auth_portal.content')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('point_product.record_search_placeholder')}"/>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="QH_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                    </div>
                </div>
            </form>
            <table id="QH_Table" lay-filter="QH_Table"></table>
        </div>
    </div>
</div>
{include file="/public/footer"}
<script>
layui.use(['table', 'form', 'layer'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var insTb = table.render({
        elem: '#QH_Table',
        url: '{:url("/PointProduct/records")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        request: {pageName:'current_page', limitName:'limit'},
        parseData: function(res){
            return {code: res.code, msg: res.msg, count: res.data.data.total || 0, data: res.data.data.data || []};
        },
        cols: [[
            {field:'id', title:'ID', width:70, sort:true},
            {field:'username', title:'{:t("admin_user.user_suffix")}', width:130},
            {field:'product_name', title:'{:t("codepay_ui.label_product")}', minWidth:160},
            {field:'cost_points', title:'{:t("point_product.points_spent")}', width:110},
            {field:'status', title:'{:t("common.status")}', width:100, templet:function(d){return '<span class="layui-badge layui-badge-green">'+d.status+'</span>';}},
            {field:'created_at', title:'{:t("point_product.redeemed_at")}', minWidth:170},
            {title:'{:t("point_product.reward_details")}', width:110, align:'center', templet:function(){return '<a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="detail">{:t('common.view')}</a>';}}
        ]]
    });
    form.on('submit(QH_TbSearch)', function(data){
        insTb.reload({where:data.field, page:{curr:1}});
        return false;
    });
    table.on('tool(QH_Table)', function(obj){
        if(obj.event === 'detail'){
            layer.open({
                title: '{:t("point_product.reward_details")}',
                area: ['640px', '420px'],
        content: '<pre style="padding:15px;white-space:pre-wrap;word-break:break-all;">'+escapeHtml(obj.data.reward_info || '-')+'</pre>'
            });
        }
    });
    function escapeHtml(value){
        return String(value).replace(/[&<>"']/g, function(s){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];});
    }
});
</script>
