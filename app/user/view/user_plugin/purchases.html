{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <div class="layui-tab layui-tab-brief">
                <ul class="layui-tab-title">
                    <li class="layui-this" data-type="purchase">已购买</li>
                    <li data-type="download">下载记录</li>
                </ul>
                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <form class="layui-form toolbar">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <label class="layui-form-label">搜索</label>
                                    <div class="layui-input-inline">
                                        <input name="text" class="layui-input" placeholder="搜索插件名称"/>
                                    </div>
                                </div>
                                <div class="layui-inline layui-btn-container">
                                    <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                                        <i class="layui-icon">&#xe615;</i>搜索
                                    </button>
                                </div>
                            </div>
                        </form>
                        <table id="SF_Table" lay-filter="SF_Table"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="detail"><i class="layui-icon">&#xe705;</i>详情</a>
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'element'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var table = layui.table;
    var element = layui.element;

    var currentType = 'purchase';

    var insTb = table.render({
        elem: '#SF_Table',
        url: '{:url("/UserPlugin/purchases")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        cellMinWidth: 100,
        where: { type: currentType },
        request: { pageName: 'current_page', limitName: 'limit' },
        parseData: function(res){
            return {
                "code": res.code, "msg": res.msg,
                "count": res.data.data.total, "data": res.data.data.data
            };
        },
        cols: [[
            {field: 'id', title: 'ID', width: 80},
            {field: 'icon', title: '图标', width: 70, templet: function(d){
                return '<img src="'+(d.icon || '/Assets/img/default-plugin.png')+'" style="width:36px;height:36px;object-fit:cover;border-radius:4px;" onerror="this.src=\'/Assets/img/default-plugin.png\'">';
            }},
            {field: 'plugin_name', title: '插件名称', minWidth: 150},
            {field: 'plugin_version', title: '版本', width: 80},
            {field: 'author', title: '作者', width: 120},
            {field: 'plugin_price', title: '价格', width: 100, templet: function(d){
                var price = d.plugin_price || d.price || 0;
                if (price == 0) return '<span class="layui-badge layui-badge-green">免费</span>';
                if (d.pay_type === 'points') return '<span style="color:#ff5722;">'+parseInt(price)+' 积分</span>';
                return '<span style="color:#ff5722;">¥'+price+'</span>';
            }},
            {field: 'order_price', title: '实付', width: 100, templet: function(d){
                if (currentType === 'download') return '-';
                if (d.order_pay_type === 'points') return '<span style="color:#ff5722;">'+parseInt(d.order_price)+' 积分</span>';
                return '<span style="color:#ff5722;">¥'+(d.order_price || 0)+'</span>';
            }},
            {field: 'paid_at', title: '时间', width: 160, templet: function(d){
                return currentType === 'download' ? escapeHtml(d.created_at) : escapeHtml(d.paid_at);
            }},
            {field: 'plugin_status', title: '插件状态', width: 100, templet: function(d){
                var s = d.plugin_status;
                if (s == 1) return '<span class="layui-badge layui-badge-green">已上架</span>';
                if (s == 0) return '<span class="layui-badge layui-badge-orange">待审核</span>';
                if (s == 2) return '<span class="layui-badge layui-badge-gray">已下架</span>';
                if (s == 3) return '<span class="layui-badge layui-badge-red">已拒绝</span>';
                return '-';
            }},
            {title: '操作', toolbar: '#SF_TbBar', align: 'center', width: 100}
        ]]
    });

    window.currentType = currentType;

    // 切换标签页
    element.on('tab', function(data) {
        var type = $(this).attr('data-type') || 'purchase';
        currentType = type;
        window.currentType = type;
        insTb.reload({
            where: { type: type },
            page: { curr: 1 }
        });
    });

    form.on('submit(SF_TbSearch)', function (data) {
        var params = Object.assign({}, data.field, { type: currentType });
        insTb.reload({where: params, page: {curr: 1}});
        return false;
    });

    table.on('tool(SF_Table)', function (obj) {
        if (obj.event === 'detail') {
            var pluginId = obj.data.plugin_id;
            layer.open({
                type: 2,
                title: '插件详情',
                content: '{:url("/UserPlugin/detail")}?id=' + pluginId,
                area: ['90%', '90%'],
                maxmin: true
            });
        }
    });

    function escapeHtml(text) {
        var map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(text || '').replace(/[&<>"']/g, function(m) { return map[m]; });
    }
});
</script>
