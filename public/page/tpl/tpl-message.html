<div class="layui-card sf-message-card">
    <div class="layui-tab layui-tab-brief">
        <ul class="layui-tab-title">
            <li class="layui-this"><span data-i18n="feedback.notifications">Notifications</span> (<span id="SF_NotifyCount">0</span>)</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <div class="message-list" id="SF_NotifyList"></div>
                <div class="message-list-empty" id="SF_NotifyEmpty">
                    <i class="layui-icon layui-icon-notice"></i>
                    <div data-i18n="feedback.no_notifications">No notifications</div>
                </div>
                <a id="messageClearBtn1" class="message-btn-clear" onclick="SF_Notification.markAllRead()" data-i18n="feedback.mark_all_read">Mark All Read</a>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    var parentDoc = window.parent && window.parent.document ? window.parent.document : document;
    var roleEl = parentDoc.querySelector('[data-role]');
    var role = roleEl ? roleEl.getAttribute('data-role') : 'user';
    var appPrefix = role === 'admin' ? '/admin.php' : '/user.php';
    var fallbackMessages = {
        'zh-cn': {
            'feedback.notifications': '\u901a\u77e5',
            'feedback.no_notifications': '\u6682\u65e0\u901a\u77e5',
            'feedback.mark_all_read': '\u5168\u90e8\u6807\u8bb0\u5df2\u8bfb',
            'feedback.submit_title': '\u529f\u80fd\u53cd\u9988',
            'feedback.manage_title': '\u53cd\u9988\u7ba1\u7406'
        },
        'en-us': {
            'feedback.notifications': 'Notifications',
            'feedback.no_notifications': 'No notifications',
            'feedback.mark_all_read': 'Mark All Read',
            'feedback.submit_title': 'Feedback',
            'feedback.manage_title': 'Feedback Management'
        }
    };
    var translate = (window.parent && window.parent.t) ? window.parent.t : (window.t || function(key){ return key; });

    function text(key) {
        var translated = translate(key);
        if (translated !== key) {
            return translated;
        }
        var match = parentDoc.cookie.match(/(?:^|;\s*)think_lang=([^;]+)/);
        var lang = match ? decodeURIComponent(match[1]).toLowerCase() : '';
        lang = lang.indexOf('zh') === 0 ? 'zh-cn' : 'en-us';
        return fallbackMessages[lang][key] || key;
    }

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatContent(value) {
        return escapeHtml(value).replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
    }

    function request(url, body, done) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', appPrefix + url, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onload = function() {
            var res = null;
            try {
                res = JSON.parse(xhr.responseText || '{}');
            } catch(e) {}
            done(res || {code: -1, data: {}});
        };
        xhr.onerror = function() {
            done({code: -1, data: {}});
        };
        xhr.send(body || '');
    }

    function setBadge(count) {
        var dots = parentDoc.querySelectorAll('.sf-notify-badge');
        dots.forEach(function(dot) {
            dot.textContent = count > 0 ? (count > 99 ? '99+' : count) : '';
            dot.style.display = count > 0 ? 'inline-block' : 'none';
        });
    }

    function closeMessagePanel() {
        var layerBox = parentDoc.querySelector('.layui-layer-adminRight');
        var parentLayer = window.parent && window.parent.layui ? window.parent.layui.layer : null;
        if (layerBox && parentLayer) {
            var layerIndex = parseInt(layerBox.id.replace('layui-layer', ''), 10);
            if (!isNaN(layerIndex)) {
                parentLayer.close(layerIndex);
            }
        }
    }

    function getFeedbackTarget() {
        if (role === 'admin') {
            return {
                url: appPrefix + '/Feedback/list.html',
                title: text('feedback.manage_title')
            };
        }
        return {
            url: appPrefix + '/Feedback/index.html',
            title: text('feedback.submit_title')
        };
    }

    function openFeedbackPage() {
        var parentWin = window.parent || window;
        var target = getFeedbackTarget();
        if (parentWin.layui && parentWin.layui.index && parentWin.layui.index.openTab) {
            parentWin.layui.index.openTab({
                title: target.title,
                url: target.url
            });
            setTimeout(function() {
                if (parentWin.layui.admin && parentWin.layui.admin.refresh) {
                    parentWin.layui.admin.refresh(target.url, true);
                }
            }, 350);
        } else {
            parentWin.location.href = target.url;
        }
        closeMessagePanel();
    }

    document.querySelectorAll('[data-i18n]').forEach(function(node) {
        node.textContent = text(node.getAttribute('data-i18n'));
    });

    window.SF_Notification = {
        loadList: function() {
            var listEl = document.getElementById('SF_NotifyList');
            var emptyEl = document.getElementById('SF_NotifyEmpty');
            var countEl = document.getElementById('SF_NotifyCount');

            request('/Feedback/notificationList.html', '', function(res) {
                var items = (res.code === 0 && res.data && Array.isArray(res.data.data)) ? res.data.data : [];
                if (items.length > 0) {
                    var html = '';
                    items.forEach(function(item) {
                        html += '<a class="message-list-item" href="javascript:;" data-id="' + encodeURIComponent(item.id) + '" onclick="SF_Notification.markRead(' + parseInt(item.id, 10) + ', true)">';
                        html += '<i class="layui-icon layui-icon-speaker message-item-icon"></i>';
                        html += '<div class="message-item-right">';
                        html += '<h2 class="message-item-title">' + escapeHtml(item.title) + '</h2>';
                        html += '<p class="message-item-text message-item-content">' + formatContent(item.content) + '</p>';
                        html += '<p class="message-item-time">' + escapeHtml(item.created_at) + '</p>';
                        html += '</div></a>';
                    });
                    listEl.innerHTML = html;
                    listEl.style.display = '';
                    emptyEl.style.display = 'none';
                } else {
                    listEl.innerHTML = '';
                    listEl.style.display = 'none';
                    emptyEl.style.display = '';
                }
                countEl.textContent = items.length;
            });
        },
        markRead: function(id, openAfterRead) {
            request('/Feedback/notificationRead.html', 'id=' + encodeURIComponent(id), function() {
                SF_Notification.loadList();
                SF_Notification.updateBadge();
                if (openAfterRead) {
                    openFeedbackPage();
                }
            });
        },
        markAllRead: function() {
            request('/Feedback/notificationReadAll.html', '', function() {
                SF_Notification.loadList();
                SF_Notification.updateBadge();
            });
        },
        updateBadge: function() {
            request('/Feedback/notificationCount.html', '', function(res) {
                var count = res.data && res.data.count ? parseInt(res.data.count, 10) : 0;
                setBadge(isNaN(count) ? 0 : count);
            });
        }
    };

    SF_Notification.loadList();
    SF_Notification.updateBadge();
})();
</script>

<style>
    .sf-message-card {
        box-shadow: none;
        border: none;
        height: 100%;
    }
    .sf-message-card .layui-tab-title {
        text-align: center;
    }
    .sf-message-card .layui-tab-content {
        padding: 0;
    }
    .message-list {
        position: absolute;
        top: 48px;
        left: 0;
        right: 0;
        bottom: 45px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    .message-list-item {
        display: block;
        padding: 12px 18px;
        line-height: 22px;
        position: relative;
        border-bottom: 1px solid #e8e8e8;
        text-decoration: none;
        color: inherit;
    }
    .message-list-item:hover, .message-btn-clear:hover {
        background: #f7f8fa;
    }
    .message-list-item .message-item-icon {
        width: 38px;
        height: 38px;
        line-height: 38px;
        margin-top: -19px;
        border-radius: 50%;
        position: absolute;
        left: 18px;
        top: 50%;
    }
    .message-list-item .message-item-icon.layui-icon {
        color: #fff;
        font-size: 20px;
        text-align: center;
        background-color: #2d8cf0;
    }
    .message-list-item .message-item-icon + .message-item-right {
        margin-left: 54px;
    }
    .message-list-item .message-item-title {
        color: #333;
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
    }
    .message-list-item .message-item-text {
        color: #666;
        font-size: 12px;
        margin: 0 0 4px;
        word-break: break-word;
    }
    .message-list-item .message-item-time {
        color: #999;
        font-size: 12px;
        margin: 0;
    }
    .message-btn-clear {
        color: #666;
        display: block;
        padding: 10px 5px;
        line-height: 24px;
        text-align: center;
        cursor: pointer;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        border-top: 1px solid #e8e8e8;
    }
    .message-list-empty {
        color: #999;
        padding: 100px 0;
        text-align: center;
        display: none;
    }
    .message-list-empty > .layui-icon {
        color: #ccc;
        display: block;
        font-size: 45px;
        margin-bottom: 15px;
    }
</style>
