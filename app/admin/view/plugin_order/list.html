{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">内容</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="搜索订单号/插件名称"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">状态</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">全部状态</option>
                                <option value="0">待支付</option>
                                <option value="1">已支付</option>
                                <option value="2">已取消</option>
                                <option value="3">已退款</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>搜索
                        </button>
                    </div>
                </div>
            </form>
            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>

<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-sm" lay-event="status"><i class="layui-icon">&#xe605;</i>状态</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon">&#xe640;</i>删除</a>
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'notice'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var table = layui.table;
    var notice = layui.notice;

    var insTb = table.render({
        elem: '#SF_Table',
        url: '{:url("/PluginOrder/list")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        toolbar: ['<p>',
            '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>批量删除</button>',
            '</p>'].join(''),
        cellMinWidth: 100,
        request: {
            pageName: 'current_page',
            limitName: 'limit'
        },
        parseData: function(res){
            return {
                "code": res.code,
                "msg": res.msg,
                "count": res.data.data.total,
                "data": res.data.data.data
            };
        },
        cols: [[
            {type: 'checkbox', fixed: true},
            {field: 'id', title: 'ID', sort: true, width: 80, fixed: true},
            {field: 'order_no', title: '订单号', minWidth: 200},
            {field: 'plugin_name', title: '插件名称', minWidth: 150},
            {field: 'plugin_version', title: '版本', width: 100},
            {field: 'user_id', title: '用户ID', width: 100},
            {field: 'app_id', title: '应用ID', width: 100},
            {field: 'price', title: '金额', width: 100, templet: function(d){
                if (d.pay_type === 'points') return '<span class="layui-badge layui-badge-orange">'+parseInt(d.price)+' 积分</span>';
                return '<span class="layui-badge layui-badge-orange">¥'+d.price+'</span>';
            }},
            {field: 'pay_type', title: '支付方式', width: 100, templet: function(d){
                switch(d.pay_type){
                    case 'alipay': return '<span class="layui-badge layui-badge-blue">支付宝</span>';
                    case 'wxpay': return '<span class="layui-badge layui-badge-green">微信</span>';
                    case 'qqpay': return '<span class="layui-badge layui-badge-red">QQ</span>';
                    case 'balance': return '<span class="layui-badge layui-badge-purple">余额</span>';
                    case 'points': return '<span class="layui-badge layui-badge-orange">积分</span>';
                    default: return '-';
                }
            }},
            {field: 'status', title: '状态', width: 100, templet: function(d){
                switch(d.status){
                    case 0: return '<span class="layui-badge layui-badge-orange">待支付</span>';
                    case 1: return '<span class="layui-badge layui-badge-green">已支付</span>';
                    case 2: return '<span class="layui-badge layui-badge-gray">已取消</span>';
                    case 3: return '<span class="layui-badge layui-badge-red">已退款</span>';
                    default: return '-';
                }
            }},
            {field: 'ip', title: 'IP', width: 120},
            {field: 'created_at', title: '创建时间', minWidth: 160},
            {field: 'paid_at', title: '支付时间', minWidth: 160},
            {title: '操作', toolbar: '#SF_TbBar', align: 'center', minWidth: 150, fixed: 'right'}
        ]]
    });

    form.on('submit(SF_TbSearch)', function (data) {
        insTb.reload({where: data.field, page: {curr: 1}});
        return false;
    });

    table.on('tool(SF_Table)', function (obj) {
        if (obj.event === 'status') {
            var statusOptions = [{value:0,text:'待支付'},{value:1,text:'已支付'},{value:2,text:'已取消'},{value:3,text:'已退款'}];
            var html = '<div style="padding:20px;"><select id="order_status">';
            statusOptions.forEach(function(opt){
                html += '<option value="'+opt.value+'" '+(obj.data.status==opt.value?'selected':'')+'>'+opt.text+'</option>';
            });
            html += '</select></div>';

            layer.open({
                type: 1, title: '修改状态', content: html, area: ['400px', '200px'],
                btn: ['确定', '取消'],
                yes: function(index) {
                    $.ajax({
                        type: "POST", url: '{:url("/PluginOrder/setStatus")}',
                        data: {id: obj.data.id, status: $('#order_status').val()},
                        dataType: "json",
                        success: function(res) {
                            if (res.code == 0) { notice.msg(res.msg, {icon:1}); table.reload('SF_Table'); layer.close(index); }
                            else { notice.msg(res.msg, {icon:2}); }
                        }
                    });
                }
            });
            form.render('select');
        } else if (obj.event === 'del') {
            layer.confirm('确定要删除此订单吗？', {skin:'layui-layer-admin',icon:3,shade:.1}, function(i) {
                layer.close(i);
                $.ajax({
                    type: "POST", url: '{:url("/PluginOrder/drop")}', data: {id: obj.data.id}, dataType: "json",
                    success: function(res) {
                        if (res.code == 0) { table.reload('SF_Table'); notice.msg(res.msg, {icon:1}); }
                        else { notice.msg(res.msg, {icon:2}); }
                    }
                });
            });
        }
    });

    table.on('toolbar(SF_Table)', function (obj) {
        if (obj.event === 'del') {
            var checkRows = table.checkStatus('SF_Table');
            if (checkRows.data.length === 0) { notice.msg('请选择要删除的数据！', {icon:3}); return; }
            var ids = checkRows.data.map(function(d){ return d.id; });
            layer.confirm('确定要删除选中数据吗？', {skin:'layui-layer-admin',icon:3,shade:.1}, function(i) {
                layer.close(i);
                $.ajax({
                    type: "POST", url: '{:url("/PluginOrder/batchDrop")}', data: {id: ids.join(',')}, dataType: "json",
                    success: function(res) {
                        if (res.code == 0) { table.reload('SF_Table'); notice.msg(res.msg, {icon:1}); }
                        else { notice.msg(res.msg, {icon:2}); }
                    }
                });
            });
        }
    });
});
</script>
