<!DOCTYPE html>
<html lang="en-us" class="bg-white">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title></title>
    <link rel="stylesheet" href="/Assets/libs/layui/css/layui.css"/>
    <link rel="stylesheet" href="/Assets/module/admin.css?v=318"/>
    <style>
        body { background: #fff; }
        .wx-login { padding: 22px 24px 18px; text-align: center; }
        .wx-title { font-size: 15px; color: #222; margin-bottom: 12px; }
        .wx-qrcode { width: 180px; height: 180px; margin: 0 auto; border: 1px solid #edf0f5; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .wx-qrcode img { width: 180px; height: 180px; display: block; }
        .wx-msg { margin-top: 12px; font-size: 13px; color: #697386; min-height: 22px; }
        .wx-refresh { margin-top: 10px; display: none; }
        .wx-account { display: block; padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f2f5; color: #1f2937; cursor: pointer; }
        .wx-account:hover { background: #f7f9fc; }
        .wx-account small { display: block; color: #7b8494; margin-top: 3px; }
    </style>
</head>
<body>
<div class="wx-login">
    <div class="wx-title" id="wechatTitle"></div>
    <div class="wx-qrcode" id="qrcode">
        <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i>
    </div>
    <div class="wx-msg" id="message"></div>
    <button type="button" class="layui-btn layui-btn-sm wx-refresh" id="refreshBtn"></button>
</div>

<script type="text/javascript" src="/Assets/libs/layui/layui.js"></script>
<script type="text/javascript" src="/Assets/js/common.js?v=318"></script>
<script>
document.documentElement.lang = window.SF_I18N.lang();
document.title = t('login.wechat_login');
document.getElementById('wechatTitle').textContent = t('wechat_mp.scan_follow');
document.getElementById('message').textContent = t('wechat_mp.generating_qr');
document.getElementById('refreshBtn').textContent = t('wechat_mp.refresh_qr');

layui.use(['jquery', 'notice', 'admin', 'layer'], function () {
    var $ = layui.jquery;
    var notice = layui.notice;
    var admin = layui.admin;
    var layerData = JSON.parse(JSON.stringify(admin.getLayerData() || {}));
    var token = '';
    var timer = null;
    var polling = false;

    function stopPoll() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        polling = false;
    }

    function closeFrame() {
        var index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
    }

    function go(url) {
        try {
            (parent.top || parent).location.replace(url);
        } catch (e) {
            parent.location.href = url;
        }
    }

    function showAccounts(accounts) {
        stopPoll();
        var html = '<div style="padding: 12px 0;">';
        $.each(accounts || [], function (_, item) {
            html += '<a class="wx-account" data-id="' + item.id + '">' +
                '<b>' + item.username + '</b><small>' + t('qrlogin.application_label') + item.appname + '</small></a>';
        });
        html += '</div>';
        $('#qrcode').html(html).css({width: '260px', height: 'auto'});
        $('#message').text(t('wechat_mp.select_account'));
    }

    function chooseUser(userId) {
        notice.msg(t('wechat_mp.logging_in'), {icon: 4, close: true});
        $.ajax({
            type: 'POST',
            url: '/api.php/WechatMp/chooseUser',
            data: {token: token, user_id: userId},
            dataType: 'json',
            success: function (res) {
                notice.destroy();
                if (res.code === 0) {
                    go((res.data && res.data.url) ? res.data.url : '/user.php/Index/index.html');
                } else {
                    notice.msg(res.msg, {icon: 2});
                }
            },
            error: function () {
                notice.destroy();
                notice.msg(t('common.server_error'), {icon: 2});
            }
        });
    }

    $(document).on('click', '.wx-account', function () {
        chooseUser($(this).data('id'));
    });

    function poll() {
        if (!token || polling) return;
        polling = true;
        $.ajax({
            type: 'POST',
            url: '/api.php/WechatMp/status',
            data: {token: token},
            dataType: 'json',
            complete: function () {
                polling = false;
            },
            success: function (res) {
                var data = res.data || {};
                if (data.status === 'pending') {
                    $('#message').text(t('wechat_mp.waiting_scan'));
                    return;
                }
                if (data.status === 'select') {
                    showAccounts(data.accounts);
                    return;
                }
                if (res.code === 0 && data.status === 'success') {
                    stopPoll();
                    parent.layui.notice.msg(res.msg || t('common.success'), {icon: 1});
                    if (data.url) {
                        go(data.url);
                    } else {
                        closeFrame();
                        parent.location.reload();
                    }
                    return;
                }
                if (data.status === 'expired') {
                    stopPoll();
                    $('#message').text(res.msg || t('wechat_mp.qr_expired'));
                    $('#refreshBtn').show();
                    return;
                }
                if (res.code !== 0) {
                    stopPoll();
                    $('#message').text(res.msg || t('common.failed'));
                    $('#refreshBtn').show();
                }
            },
            error: function () {
                stopPoll();
                $('#message').text(t('wechat_mp.server_refresh_retry'));
                $('#refreshBtn').show();
            }
        });
    }

    function createQrcode() {
        stopPoll();
        token = '';
        $('#refreshBtn').hide();
        $('#qrcode').css({width: '180px', height: '180px'}).html('<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i>');
        $('#message').text(t('wechat_mp.generating_qr'));
        $.ajax({
            type: 'POST',
            url: '/api.php/WechatMp/qrcode',
            data: {type: layerData.type || 'userLogin'},
            dataType: 'json',
            success: function (res) {
                if (res.code !== 0) {
                    $('#message').text(res.msg || t('wechat_mp.qr_generate_failed'));
                    $('#refreshBtn').show();
                    return;
                }
                token = res.data.token;
                $('#qrcode').html('<img src="' + res.data.qr_url + '" alt="' + t('wechat_mp.qr_alt') + '">');
                $('#message').text(t('wechat_mp.waiting_scan'));
                timer = setInterval(poll, 1800);
                poll();
            },
            error: function () {
                $('#message').text(t('wechat_mp.server_refresh_retry'));
                $('#refreshBtn').show();
            }
        });
    }

    $('#refreshBtn').click(createQrcode);
    createQrcode();
});
</script>
</body>
</html>
