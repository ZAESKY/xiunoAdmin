{include file="/public/header"}
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">内&emsp;容</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="输入ID或名称"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">状&emsp;态</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">选择状态</option>
                                <option value="1">显示</option>
                                <option value="0">隐藏</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>搜索
                        </button>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">应&emsp;用</label>
                        <div class="layui-input-inline">
                            <select class="layui-input ew-select-fixed" lay-filter="template" lay-search>
                                <option value="">全部应用</option>
                                {volist name="app_list.data.data" id="res"}
                                <option value="{$res.id}">{$res.name}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                </div>
            </form>
            <!-- 数据表格 -->
            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>
<!-- 表格操作列 -->
<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-primary layui-btn-sm" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>修改</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
</script>
<!-- 表格状态列 -->
<script type="text/html" id="SF_TbState">
    <input type="checkbox" lay-filter="SF_TbStateCk" value="{{d.id}}" lay-skin="switch"
           lay-text="显示|隐藏" {{d.status==1?'checked':''}} style="display: none;"/>
    <p style="display: none;">{{d.status==0?'正常':'封禁'}}</p>
</script>

<script type="text/html" id="SF_Tbid">
    <span id="SF_span_{{d.id}}">{{d.status==1?'<span class="layui-badge-dot layui-bg-sf-indigo" style="height: 6px;width: 6px;position: relative;top: -2px"></span></span> '+d.id:'<span class="layui-badge-dot layui-bg-red" style="height: 6px;width: 6px;position: relative;top: -2px"></span></span> '+d.id}}
</script>
<!-- 表单弹窗 -->
<script type="text/html" id="SF_EditDialog">
    <form id="SF_EditForm" lay-filter="SF_EditForm" class="layui-form model-form">
        <input name="id" type="hidden"/>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">所属应用:</label>
            <div class="layui-input-block">
                <select name="appid" class="layui-input ew-select-fixed" lay-search lay-filter="appid">
                    <option value="">请选择所属的应用</option>
                    {volist name="app_list.data.data" id="res"}
                    <option value="{$res.id}">{$res.name}</option>
                    {/volist}
                </select>
            </div>
        </div>
        <div id="form_data" style="display: none">
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">权限:</label>
                <div class="layui-input-block">
                    <select id="power" name="power" class="layui-input ew-select-fixed" lay-search>
                        <option value="">请选择权限</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">用户名:</label>
                <div class="layui-input-block">
                    <input type="text" name="username" placeholder="请输入用户名" class="layui-input"
                           lay-verType="tips" lay-verify="required"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">密码:</label>
                <div class="layui-input-block">
                    <input type="text" name="password" placeholder="请输入密码" class="layui-input"
                           lay-verType="tips" lay-verify="required"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">QQ:</label>
                <div class="layui-input-block">
                    <input type="number" name="qq" placeholder="请输入QQ" class="layui-input"
                           lay-verType="tips" lay-verify="required"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">邮箱:</label>
                <div class="layui-input-block">
                    <input type="text" name="email" placeholder="请输入邮箱" class="layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">手机号:</label>
                <div class="layui-input-block">
                    <input type="number" name="phone" placeholder="请输入手机号" class="layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">余额:</label>
                <div class="layui-input-block">
                    <input type="number" name="balance" placeholder="留空则为0元" class="layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">积分:</label>
                <div class="layui-input-block">
                    <input type="number" name="integral" placeholder="留空则为0积分" class="layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">允许登录IP:</label>
                <div class="layui-input-block">
                    <textarea name="ip" class="layui-textarea" style="height:100px" placeholder="多个用 “|” 隔开，留空则不检测" ></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">状态:</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="status" value="1" lay-skin="switch" checked/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">上级ID:</label>
                <div class="layui-input-block">
                    <select id="userList" name="userid" class="layui-input ew-select-fixed" lay-search>
                        <option value="">请选择该用户上级</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="SF_EditSubmit" lay-submit>保存</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">取消</button>
        </div>
    </form>
</script>

{include file="/public/footer"}
<script>
    layui.use(['layer', 'form', 'table', 'util', 'admin', 'notice'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var util = layui.util;
        var admin = layui.admin;
        var notice = layui.notice;

        /* 渲染表格 */
        var insTb = table.render({
            elem: '#SF_Table',
            url: '{:url("/User/list")}',
            method: 'post',
            page: true,
            skin: 'line',
            size: 'lg',
            toolbar: ['<p>',
                '<button lay-event="add" class="layui-btn layui-btn-sm icon-btn"><i class="layui-icon">&#xe654;</i>添加</button>&nbsp;',
                '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>删除</button>',
                '</p>'].join(''),
            cellMinWidth: 100,
            request: {
                pageName: 'current_page' //页码的参数名称，默认：page
                ,limitName: 'limit' //每页数据量的参数名，默认：limit
            },
            parseData: function(res){ //res 即为原始返回的数据
                return {
                    "code": res.code, //解析接口状态
                    "msg": res.msg, //解析提示文本
                    "count": res.data.data.total, //解析数据长度
                    "data": res.data.data.data //解析数据列表
                };
            },
            cols: [[
                {type: 'checkbox', fixed: true},
                {field: 'id', title: 'ID', templet: '#SF_Tbid', sort: true, width: 80, fixed: true},
                {field: 'img', title: '头像', templet: function (d) {
                        var url = d.imgUrl || '//q4.qlogo.cn/headimg_dl?dst_uin='+d.qq+'&spec=100';
                        return '<img data-index="' + (d.LAY_INDEX - 1) + '" src="' + url + '" class="tb-img-circle" tb-img alt=""/>';
                    }, width: 70, unresize: true},
                {field: 'appName', title: '所属应用', sort: true, minWidth: 120, templet: function (d) {
                        return '<span class="layui-badge layui-badge-orange">'+d.appName+'</span>';
                    }},
                {field: 'username', title: '用户名', sort: true, minWidth: 150},
                {field: 'password', title: '密码', minWidth: 100, templet: function (d) {
                        return '<a lay-event="seePassword" class="layui-btn layui-btn-xs">点击查看</a>';
                    }
                },
                {field: 'powerName', title: '权限', align: 'right', sort: true, minWidth: 130, templet: function (d) {
                        return '<span class="layui-badge layui-badge-'+d.powerSpan+'">'+d.powerName+'</span>';
                    }},
                {field: 'qq', title: 'QQ', align: 'right', sort: true, minWidth: 108},
                {field: 'email', title: '邮箱', align: 'right', sort: true, minWidth: 170},
                {field: 'phone', title: '手机号', align: 'right', sort: true, minWidth: 118},
                {field: 'balance', title: '财产', align: 'right', templet: function (d) {
                        return '<span class="layui-badge layui-badge-green">余额：'+d.balance+'</span> <span class="layui-badge layui-badge-yellow">积分：'+d.integral+'</span>';
                    }, sort: true, minWidth: 171},

                {field: 'ip', title: 'IP', align: 'right', sort: true, minWidth: 140},
                {field: 'userid', title: '上级ID', align: 'right', sort: true, templet: function (d) {
                        if(d.userid == 0){
                            return '<span class="layui-badge layui-badge-green">站长</span>';
                        }else{
                            return '<span class="layui-badge layui-badge-blue">UID:'+d.userid+'</span>';
                        }
                    }, minWidth: 110},
                {field: 'addtime', title: '添加时间', sort: true, minWidth: 200},
                {field: 'status', title: '状态', templet: '#SF_TbState', sort: true, minWidth: 100},
                {title: '操作', toolbar: '#SF_TbBar', align: 'center', minWidth: 180}
            ]]
        });
        $(document).off('click.tbImg').on('click.tbImg', '[tb-img]', function () {
            var imgList = table.cache['SF_Table'].map(function (d) {
                return {
                    alt: d.username,
                    src: d.imgUrl || '//q4.qlogo.cn/headimg_dl?dst_uin='+d.qq+'&spec=100'
                }
            });
            layer.photos({photos: {data: imgList, start: $(this).data('index')}, shade: .1, closeBtn: true});
        });
        form.on('select(appid)', function (data) {
            if (data.value == "") {
                $("#form_data").css("display","none");
            }else{
                notice.msg('正在获取列表中..', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url: '{:url("/User/getPowerList")}',
                    data: {"appid":data.value},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                            var content = '<option value="">请选择权限</option>';
                            $.each(data.data.data, function(index, value) {
                                content +='<option value="'+value.id+'">'+value.name+'</option>';
                            });
                            $("#power").html(content);
                        } else {
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                        form.render();
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg("服务器错误！", {icon: 2, audio:'1'});
                    }
                });
                notice.msg('正在获取列表中..', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url: '{:url("/User/getAppUserList")}',
                    data: {"appid":data.value},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                            var content = '<option value="">请选择该用户上级</option><option value="0">站长</option>';
                            $.each(data.data.data, function(index, value) {
                                content +='<option value="'+value.id+'">ID:'+value.id+' '+value.username+'</option>';
                            });
                            $("#userList").html(content);
                        } else {
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                        form.render();
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg("服务器错误！", {icon: 2, audio:'1'});
                    }
                });
                $("#form_data").css("display","inherit");
            }
        });
        /* 表格搜索 */
        form.on('submit(SF_TbSearch)', function (data) {
            insTb.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        form.on('select(template)', function (data) {
            if(data.value == ''){
                insTb.reload({where: {appid:data.value}, page: {curr: 1}});
            }else{
                insTb.reload({where: {appid:data.value}, page: {curr: 1}});
            }
            return false;
        });
        {if $appid != ''}
        insTb.reload({where: {appid:{$appid}}, page: {curr: 1}});
        {/if}
            /* 表格工具条点击事件 */
            table.on('tool(SF_Table)', function (obj) {
                if (obj.event === 'edit') { // 修改
                    showEditModel(obj.data);
                } else if (obj.event === 'del') { // 删除
                    doDel(obj);
                } else if (obj.event === 'seePassword') {
                    admin.open({
                        title: '查看用户 '+obj.data.username+' 密码',
                        type: 1,
                        content: '<div class="layui-card"><div class="layui-card-body"><div class="layui-form layui-form-pane"><div class="layui-form-item"><label class="layui-form-label">密码</label><div class="layui-input-block"><input type="text" id="pwd" class="layui-input layui-disabled" value="'+obj.data.password+'"/></div></div></div><a class="layui-btn layui-btn-fluid sf" data-clipboard-text="'+obj.data.password+'" onclick="copy()">点击复制</a></div></div>'
                    });
                }
            });

            window.copy = function (){
                notice.msg('正在执行中..', {icon: 4, close: true});
                var e = document.getElementById("pwd");
                e.select();
                document.execCommand("Copy");//执行复制
                notice.destroy();
                notice.msg('复制成功！', {icon: 1, audio:'1'});
            }
            /* 表格头工具栏点击事件 */
            table.on('toolbar(SF_Table)', function (obj) {
                if (obj.event === 'add') { // 添加
                    showEditModel();
                } else if (obj.event === 'del') { // 删除
                    var checkRows = table.checkStatus('SF_Table');
                    if (checkRows.data.length === 0) {
                        notice.msg('请选择要删除的数据！', {icon: 3, audio:'1'});
                        return;
                    }
                    var ids = checkRows.data.map(function (d) {
                        return d.id;
                    });
                    console.log(ids)
                    doDel({ids: ids});
                }
            });

            /* 显示表单弹窗 */
            function showEditModel(mData) {
                admin.popupRight({
                    type: 1,
                    title: (mData ? '修改' : '添加') + '用户',
                    content: $('#SF_EditDialog').html(),
                    success: function (layero, dIndex) {
                        // 回显表单数据
                        if(mData){
                            $("#form_data").css("display", "inherit");
                            notice.msg('正在获取列表中..', {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: '{:url("/User/getPowerList")}',
                                data: {"appid":mData.appid},
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        notice.msg(data.msg, {icon: 1, audio:'1'});
                                        var content = '<option value="">请选择权限</option>';
                                        $.each(data.data.data, function(index, value) {
                                            content +='<option value="'+value.id+'">'+value.name+'</option>';
                                        });
                                        $("#power").html(content);
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                    form.render();
                                    form.val('SF_EditForm', mData);
                                },
                                error: function() {
                                    notice.destroy();
                                    notice.msg("服务器错误！", {icon: 2, audio:'1'});
                                }
                            });

                            notice.msg('正在获取列表中..', {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: '{:url("/User/getAppUserList")}',
                                data: {"appid":mData.appid},
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        notice.msg(data.msg, {icon: 1, audio:'1'});
                                        var content = '<option value="">请选择该用户上级</option><option value="0">站长</option>';
                                        $.each(data.data.data, function(index, value) {
                                            content +='<option value="'+value.id+'">ID:'+value.id+' '+value.username+'</option>';
                                        });
                                        $("#userList").html(content);
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                    form.render();
                                    form.val('SF_EditForm', mData);
                                },
                                error: function() {
                                    notice.destroy();
                                    notice.msg("服务器错误！", {icon: 2, audio:'1'});
                                }
                            });
                        }else{
                            form.render();
                            $("#form_data").css("display","none");
                        }
                        // 表单提交事件
                        form.on('submit(SF_EditSubmit)', function (data) {
                            notice.msg('正在执行中..', {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: '{:url("/User/edit")}',
                                data: data.field,
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        table.reload('SF_Table');
                                        notice.msg(data.msg, {icon: 1, audio:'1'});
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                },
                                error: function() {
                                    notice.destroy();
                                    notice.msg("服务器错误！", {icon: 2, audio:'1'});
                                }
                            });
                            return false;
                        });
                        // 禁止弹窗出现滚动条
                        $(layero).children('.layui-layer-content').css('overflow', 'visible');
                    }
                });
            }

            /* 删除 */
            function doDel(obj) {
                layer.confirm('确定要删除选中数据吗？', {
                    skin: 'layui-layer-admin',
                    icon: 3,
                    shade: .1
                }, function (i) {
                    layer.close(i);
                    notice.msg('正在执行中..', {icon: 4, close: true});
                    $.ajax({
                        type: "POST",
                        url: obj.data ? '{:url("/User/drop")}' : '{:url("/User/batchDrop")}',
                        data: {id: obj.data ? obj.data.id : obj.ids.join(',')},
                        dataType: "json",
                        success: function(data) {
                            notice.destroy();
                            if (data.code == 0) {
                                insTb.reload({page: {curr: 1}});
                                notice.msg(data.msg, {icon: 1, audio:'1'});
                            }else{
                                notice.msg(data.msg, {icon: 2, audio:'1'});
                            }
                        },
                        error: function() {
                            notice.destroy();
                            notice.msg("服务器错误！", {icon: 2, audio:'1'});
                        }
                    });
                });
            }

            /* 修改用户状态 */
            form.on('switch(SF_TbStateCk)', function (obj) {
                notice.msg('正在执行中..', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url:'{:url("/User/setStatus")}',
                    data: {id:obj.value,status:obj.elem.checked ? 1 : 0},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            insTb.reload({page: {curr: 1}});
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                        }else{
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg("服务器错误！", {icon: 2, audio:'1'});
                    }
                });
            });
        });
</script>
