<!DOCTYPE html>
<html lang="en" class="bg-white">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>QQ Verification</title>
    <link rel="stylesheet" href="/Assets/libs/layui/css/layui.css"/>
    <link rel="stylesheet" href="/Assets/module/admin.css?v=318"/>
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<div class="text-center" style="padding: 25px 25px 15px 25px;">
    <div class="layui-text">
        <div style="margin-top:1rem;margin-bottom:1rem;color:#666" id="login">
            <span id="loginmsg"></span><span id="loginload" style="color: #790909;">.</span>
            <div id="qrimg" style="height: 100px"></div>
        </div>
    </div>

</div>

<!-- js部分 -->
<script type="text/javascript" src="/Assets/libs/layui/layui.js"></script>
<script>
    try {
        window.SF_I18N_LOCALE = parent.SF_I18N_LOCALE;
        window.SF_I18N_MESSAGES = parent.SF_I18N_MESSAGES;
    } catch (e) {}
</script>
<script type="text/javascript" src="/Assets/js/common.js?v=318"></script>
<script>
    document.title = t('qrlogin.title');
    document.documentElement.lang = window.SF_I18N ? window.SF_I18N.lang() : 'en-us';
    document.getElementById('loginmsg').textContent = t('qrlogin.scan_mobile');

    layui.use(['layer', 'admin', 'form', 'notice', 'jquery'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var admin = layui.admin;
        var form = layui.form;
        var notice = layui.notice;

        var interval1,interval2;
        function delCookie(name)
        {
            var exp = new Date();
            exp.setTime(exp.getTime() - 1);
            var cval=getCookie(name);
            if(cval!=null)
                document.cookie= name + "="+cval+";expires="+exp.toGMTString();
        }
        function setCookie(name,value)
        {
            var exp = new Date();
            exp.setTime(exp.getTime() + 30*1000);
            document.cookie = name + "="+ escape (value) + ";expires=" + exp.toGMTString();
        }
        function getCookie(name)
        {
            var arr,reg=new RegExp("(^| )"+name+"=([^;]*)(;|$)");
            if(arr=document.cookie.match(reg))
                return unescape(arr[2]);
            else
                return null;
        }
        function getqrpic(force){
            force = force || false;
            var qrsig = getCookie('qrsig');
            var qrimg = getCookie('qrimg');
            if(qrsig!=null && qrimg!=null && force==false){
                $('#qrimg').attr('qrsig',qrsig);
                $('#qrimg').html('<img id="qrcodeimg" onclick="getqrpic(true)" src="data:image/png;base64,'+qrimg+'" title="'+t('qrlogin.click_refresh')+'">');
                if( /Android|SymbianOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Midp/i.test(navigator.userAgent) && navigator.userAgent.indexOf("QQ/") == -1) {
                    $('#mobile').show();
                }
            }else{
                $.ajax({
                    type: "POST",
                    url: '/api.php/Qrlogin/getqrpic',
                    data: {'r':Math.random(1)},
                    dataType: "json",
                    success: function(data) {
                        if(data.code == 0){
                            setCookie('qrsig',data.data.qrsig);
                            setCookie('qrimg',data.data.data);
                            $('#qrimg').attr('qrsig',data.data.qrsig);
                            $('#qrimg').html('<img id="qrcodeimg" onclick="getqrpic(true)" src="data:image/png;base64,'+data.data.data+'" title="'+t('qrlogin.click_refresh')+'">');
                            if( /Android|SymbianOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Midp/i.test(navigator.userAgent) && navigator.userAgent.indexOf("QQ/") == -1) {
                                $('#mobile').show();
                            }
                        }else{
                            $('#loginmsg').html(data.data.msg);
                        }
                    },
                    error: function() {
                        $('#loginmsg').html(t('common.server_error'));
                    }
                });
            }
        }

        var layerData = JSON.parse(JSON.stringify(admin.getLayerData()));

        function loadScript(c) {
            if ($('#login').attr("data-lock") === "true") return;
            var qrsig=$('#qrimg').attr('qrsig');
            layerData.qrsig = decodeURIComponent(qrsig);
            $.ajax({
                type: "POST",
                url: '/api.php/Qrlogin/qqLogin',
                data: layerData,
                dataType: "json",
                success: function(data) {
                    var msg=t('qrlogin.scan_qr');

                    switch(data.data.code) {
                        case 0:
                            $('#login').hide();
                            $('#login').attr("data-lock", "true");
                            switch (layerData.type){
                                case 'replaceAuth':
                                    var i = parent.layui.layer.confirm(t('qrlogin.replace_confirm', {
                                        current: '<span class="layui-badge layui-badge-orange">'+layerData.auth_info+'</span>',
                                        replacement: '<span class="layui-badge layui-badge-green">'+layerData.replace_info+'</span>'
                                    }), {
                                        skin: 'layui-layer-admin',
                                        shade: .1
                                    }, function (i) {
                                        parent.layui.layer.close(i);
                                        notice.msg(t('common_ui.processing'), {icon: 4, close: true});
                                        $.ajax({
                                            type: "POST",
                                            url: '/api.php/Qrlogin/replaceAuth',
                                            data: layerData,
                                            dataType: "json",
                                            success: function(data) {
                                                notice.destroy();
                                                if (data.code == 0) {
                                                    var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                                                    parent.layer.close(index);
                                                    parent.layui.layer.alert(t('qrlogin.replace_success'),{icon:1,skin: 'layui-layer-admin',closeBtn:0});
                                                } else {
                                                    if(data.data.replace == 1){
                                                        var i = parent.layui.layer.alert(data.msg,{icon:2,closeBtn:0},function(){
                                                            parent.layui.layer.close(i);
                                                            var i2 = parent.layer.prompt({
                                                                title:t('qrlogin.edit_replacement'),
                                                                value: layerData.replace_info,
                                                                skin: 'layui-layer-admin',
                                                                btn2:function(index){
                                                                    //点击取消执行的代码
                                                                }
                                                            },function(value,index){
                                                                layerData.replace_info = value;
                                                                parent.layui.layer.close(i2);
                                                                parent.layui.layer.alert(t('qrlogin.edit_success_retry'),{icon:1,skin: 'layui-layer-admin',closeBtn:0});
                                                            })
                                                        });
                                                    }else{
                                                        parent.layui.layer.alert(data.msg,{icon:2,skin: 'layui-layer-admin',closeBtn:0});
                                                    }
                                                }
                                            },
                                            error: function() {
                                                notice.destroy();
                                                notice.error({
                                                    title: t('common_ui.replace_notice'),
                                                    message: t('common.server_error'),
                                                    animateInside:true,
                                                    position:'topCenter',
                                                    transitionOut:'flipOutX',
                                                    transitionOutMobile: 'flipOutX',
                                                    displayMode:'2',
                                                    audio:'1'
                                                });
                                            }
                                        });
                                    });
                                    break;
                                case 'userLogin':
                                    notice.msg(t('common_ui.processing'), {icon: 4, close: true});
                                    $.ajax({
                                        type: "POST",
                                        url: '/api.php/Qrlogin/userLogin',
                                        data: layerData,
                                        dataType: "json",
                                        success: function(data) {
                                            notice.destroy();
                                            if (data.code == 0) {
                                                var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                                                parent.layer.close(index);
                                                if(!data.data){
                                                    try {
                                                        (parent.top || parent).location.replace('/user.php/Index/index');
                                                    } catch (e) {
                                                        parent.location.href = '/user.php/Index/index';
                                                    }
                                                }else{
                                                    var content = '<div class="layui-card" style="margin: 30px 30px 30px 30px;border-radius: 10px"><div class="layui-card-body">';
                                                    $.each(data.data, function(index, value){
                                                        content += '<a onclick="qrcodeLogin(\''+value.username+'\',\''+value.appid+'\')"><div style="'+(index==0?'':'border-top:1px solid #e6e6e6;')+'border-radius: 4px;height: 60px;line-height:60px;position: relative">' +
                                                            '<img style="margin-left:10px;width: 40px;height: 40px;border-radius: 50%;border: 3px solid #fff;" src="//q1.qlogo.cn/g?b=qq&nk=2129876388&s=100">' +
                                                            '<div style="font-size:16px;color:#030718;position: absolute;top:-10px;left:60px">'+value.username+'</div>' +
                                                            '<div style="font-size:10px;color:#878b97;position: absolute;top:10px;left:60px">'+t('qrlogin.application_label')+value.appname+'</div>' +
                                                            '</div></a>';
                                                    });
                                                    content += '</div></div>';
                                                    parent.layui.admin.open({
                                                        type: 1,
                                                        title: t('qrlogin.choose_account'),
                                                        content: content
                                                    });
                                                }
                                            } else {
                                                getqrpic();
                                                notice.error({
                                                    title: t('qrlogin.login_notice'),
                                                    message: data.msg,
                                                    animateInside:true,
                                                    position:'topCenter',
                                                    transitionOut:'flipOutX',
                                                    transitionOutMobile: 'flipOutX',
                                                    displayMode:'2',
                                                    audio:'1'
                                                });
                                            }
                                        },
                                        error: function() {
                                            notice.destroy();
                                            getqrpic();
                                            notice.error({
                                                title: t('qrlogin.login_notice'),
                                                message: t('common.server_error'),
                                                animateInside:true,
                                                position:'topCenter',
                                                transitionOut:'flipOutX',
                                                transitionOutMobile: 'flipOutX',
                                                displayMode:'2',
                                                audio:'1'
                                            });
                                        }
                                    });
                                    break;
                                case 'adminLogin':
                                    parent.layui.notice.msg(t('qrlogin.verifying_admin'), {icon: 4, close: true});
                                    $.ajax({
                                        type: "POST",
                                        url: '/api.php/Qrlogin/adminLogin',
                                        data: layerData,
                                        dataType: "json",
                                        success: function(data) {
                                            parent.layui.notice.destroy();
                                            if (data.code == 0) {
                                                var redirectUrl = (data.data && data.data.url) ? data.data.url : '/admin.php/Index/index.html';
                                                parent.layui.notice.msg(t('qrlogin.login_success_redirect'), {icon: 1});
                                                try {
                                                    (parent.top || parent).location.replace(redirectUrl);
                                                } catch (e) {
                                                    parent.location.href = redirectUrl;
                                                }
                                                return;
                                            } else {
                                                cleartime();
                                                $('#login').show();
                                                $('#login').attr("data-lock", "false");
                                                getqrpic();
                                                parent.layui.notice.error({
                                                    title: t('qrlogin.login_notice'),
                                                    message: data.msg,
                                                    animateInside:true, position:'topCenter',
                                                    transitionOut:'flipOutX', transitionOutMobile: 'flipOutX',
                                                    displayMode:'2', audio:'1'
                                                });
                                            }
                                        },
                                        error: function() {
                                            parent.layui.notice.destroy();
                                            cleartime();
                                            $('#login').show();
                                            $('#login').attr("data-lock", "false");
                                            getqrpic();
                                            parent.layui.notice.error({
                                                title: t('qrlogin.login_notice'),
                                                message: t('common.server_error'),
                                                animateInside:true, position:'topCenter',
                                                transitionOut:'flipOutX', transitionOutMobile: 'flipOutX',
                                                displayMode:'2', audio:'1'
                                            });
                                        }
                                    });
                                    break;
                                case 'oauthMigrate':
                                    parent.layui.notice.msg(t('qrlogin.migrating_legacy'), {icon: 4, close: true});
                                    $.ajax({
                                        type: "POST",
                                        url: '/api.php/Social/migrateLegacy',
                                        data: {pending_token: layerData.pending_token},
                                        dataType: "json",
                                        success: function(data) {
                                            parent.layui.notice.destroy();
                                            if (data.code == 0) {
                                                var index = parent.layer.getFrameIndex(window.name);
                                                parent.layer.close(index);
                                                if (typeof parent.handleQqOauthResult === 'function') {
                                                    parent.handleQqOauthResult(data);
                                                } else {
                                                    (parent.top || parent).location.replace('/user.php/Index/index.html');
                                                }
                                            } else {
                                                cleartime();
                                                $('#login').show().attr("data-lock", "false");
                                                getqrpic(true);
                                                parent.layui.notice.error({
                                                    title: t('qrlogin.migration_notice'), message: data.msg, position:'topCenter',
                                                    displayMode:'2', audio:'1'
                                                });
                                            }
                                        },
                                        error: function() {
                                            parent.layui.notice.destroy();
                                            cleartime();
                                            $('#login').show().attr("data-lock", "false");
                                            getqrpic(true);
                                            parent.layui.notice.error({
                                                title: t('qrlogin.migration_notice'), message: t('common.server_error'), position:'topCenter',
                                                displayMode:'2', audio:'1'
                                            });
                                        }
                                    });
                                    break;
                                case 'oauthClaim':
                                    parent.layui.notice.msg(t('qrlogin.saving_legacy_relation'), {icon: 4, close: true});
                                    $.ajax({
                                        type: 'POST',
                                        url: '/api.php/Social/claimLegacy',
                                        dataType: 'json',
                                        success: function(data) {
                                            parent.layui.notice.destroy();
                                            if (data.code == 0) {
                                                var index = parent.layer.getFrameIndex(window.name);
                                                parent.layer.close(index);
                                                parent.layui.notice.msg(data.msg, {icon:1});
                                                setTimeout(function(){ parent.location.reload(); }, 900);
                                            } else {
                                                cleartime();
                                                $('#login').show().attr('data-lock', 'false');
                                                getqrpic(true);
                                                parent.layui.notice.error({title:t('qrlogin.migration_notice'), message:data.msg, position:'topCenter'});
                                            }
                                        },
                                        error: function() {
                                            parent.layui.notice.destroy();
                                            cleartime();
                                            $('#login').show().attr('data-lock', 'false');
                                            getqrpic(true);
                                            parent.layui.notice.error({title:t('qrlogin.migration_notice'), message:t('common.server_error'), position:'topCenter'});
                                        }
                                    });
                                    break;
                                case 'bindQQ':
                                    parent.layui.notice.msg(t('common_ui.processing'), {icon: 4, close: true});
                                    $.ajax({
                                        type: "POST",
                                        url: '/api.php/Qrlogin/bindQQ',
                                        data: layerData,
                                        dataType: "json",
                                        success: function(data) {
                                            parent.layui.notice.destroy();
                                            if (data.code == 0) {
                                                var index = parent.layer.getFrameIndex(window.name);
                                                parent.layer.close(index);
                                                parent.layui.notice.msg(t('qrlogin.bind_success'), {icon: 1});
                                                setTimeout(function(){ parent.location.reload(); }, 1500);
                                            } else {
                                                cleartime();
                                                $('#login').show();
                                                $('#login').attr("data-lock", "false");
                                                getqrpic();
                                                parent.layui.notice.error({
                                                    title: t('qrlogin.bind_notice'),
                                                    message: data.msg,
                                                    animateInside:true,
                                                    position:'topCenter',
                                                    transitionOut:'flipOutX',
                                                    transitionOutMobile: 'flipOutX',
                                                    displayMode:'2',
                                                    audio:'1'
                                                });
                                            }
                                        },
                                        error: function() {
                                            parent.layui.notice.destroy();
                                            cleartime();
                                            $('#login').show();
                                            $('#login').attr("data-lock", "false");
                                            getqrpic();
                                            parent.layui.notice.error({
                                                title: t('qrlogin.bind_notice'),
                                                message: t('common.server_error'),
                                                animateInside:true,
                                                position:'topCenter',
                                                transitionOut:'flipOutX',
                                                transitionOutMobile: 'flipOutX',
                                                displayMode:'2',
                                                audio:'1'
                                            });
                                        }
                                    });
                                    break;
                                case 'adminBindQQ':
                                    parent.layui.notice.msg(t('qrlogin.binding_admin'), {icon: 4, close: true});
                                    $.ajax({
                                        type: "POST",
                                        url: '/api.php/Qrlogin/adminBindQQ',
                                        data: layerData,
                                        dataType: "json",
                                        success: function(data) {
                                            parent.layui.notice.destroy();
                                            if (data.code == 0) {
                                                var index = parent.layer.getFrameIndex(window.name);
                                                parent.layer.close(index);
                                                parent.layui.notice.msg(t('qrlogin.bind_success'), {icon: 1});
                                                setTimeout(function(){ parent.location.reload(); }, 1500);
                                            } else {
                                                cleartime();
                                                $('#login').show();
                                                $('#login').attr("data-lock", "false");
                                                getqrpic();
                                                parent.layui.notice.error({
                                                    title: t('qrlogin.bind_notice'),
                                                    message: data.msg,
                                                    animateInside:true, position:'topCenter',
                                                    transitionOut:'flipOutX', transitionOutMobile: 'flipOutX',
                                                    displayMode:'2', audio:'1'
                                                });
                                            }
                                        },
                                        error: function() {
                                            parent.layui.notice.destroy();
                                            cleartime();
                                            $('#login').show();
                                            $('#login').attr("data-lock", "false");
                                            getqrpic();
                                            parent.layui.notice.error({
                                                title: t('qrlogin.bind_notice'),
                                                message: t('common.server_error'),
                                                animateInside:true, position:'topCenter',
                                                transitionOut:'flipOutX', transitionOutMobile: 'flipOutX',
                                                displayMode:'2', audio:'1'
                                            });
                                        }
                                    });
                                    break;
                                case 'binding':
                                    parent.layui.notice.msg(t('common_ui.processing'), {icon: 4, close: true});
                                    $.ajax({
                                        type: "POST",
                                        url: '/api.php/Qrlogin/binding',
                                        data: layerData,
                                        dataType: "json",
                                        success: function(data) {
                                            parent.layui.notice.destroy();
                                            if (data.code == 0) {
                                                var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                                                parent.layer.close(index);
                                                var content = '<div class="layui-card"><div class="layui-card-body"><form class="layui-form"><div class="layui-form-item">\n' +
                                                    '            <label class="layui-form-label layui-form-required">'+t('qrlogin.data_list')+':</label>\n' +
                                                    '            <div class="layui-input-block"><input type="checkbox" name="type" value="checkall" lay-skin="primary" lay-filter="allChoose" title="'+t('qrlogin.select_all')+'">';
                                                $.each(data.data, function(index, value){
                                                    content += '<input type="checkbox" name="list[]" value="'+value.id+'" lay-skin="primary" title="'+value.auth_info+'">';
                                                });
                                                content += '</div></div><div class="layui-form-item text-right">\n' +
                                                    '            <button class="layui-btn layui-btn-primary" type="button" lay-filter="selectAll" lay-submit>'+t('qrlogin.select_all')+'</button>\n' +
                                                    '            <button type="button" class="layui-btn" lay-filter="BindingSubmit" lay-submit>'+t('qrlogin.bind')+'</button>\n' +
                                                    '        </div></form></div></div>';
                                                parent.layui.admin.open({
                                                    type: 1,
                                                    title: t('qrlogin.select_binding_data'),
                                                    content: content,
                                                    success: function (layero, dIndex) {
                                                        parent.layui.form.render();
                                                        parent.layui.jquery(layero).children('.layui-layer-content').css('overflow', 'visible');
                                                    }
                                                });
                                            } else {
                                                cleartime();
                                                $('#login').show();
                                                $('#login').attr("data-lock", "false");
                                                getqrpic();
                                                parent.layer.alert(data.msg, {title:t('qrlogin.bind_notice'),icon:3,skin: 'layui-layer-admin',shade: .1,closeBtn:0});
                                            }
                                        },
                                        error: function() {
                                            parent.layui.notice.destroy();
                                            cleartime();
                                            $('#login').show();
                                            $('#login').attr("data-lock", "false");
                                            getqrpic();
                                            parent.layer.alert(t('common.server_error'), {title:t('qrlogin.bind_notice'),icon:2,skin: 'layui-layer-admin',shade: .1,closeBtn:0});
                                        }
                                    });
                                    break;
                                case 'download':
                                    parent.layui.notice.msg(t('common_ui.processing'), {icon: 4, close: true});
                                    $.ajax({
                                        type: "POST",
                                        url: '/api.php/Qrlogin/download',
                                        data: layerData,
                                        dataType: "json",
                                        success: function(data) {
                                            parent.layui.notice.destroy();
                                            if (data.code == 0) {
                                                parent.layui.layer.closeAll();
                                                parent.layui.notice.success({
                                                    title: t('common_ui.get_notice'),
                                                    message: data.msg,
                                                    animateInside:true,
                                                    position:'topCenter',
                                                    transitionOut:'flipOutX',
                                                    transitionOutMobile: 'flipOutX',
                                                    displayMode:'2',
                                                    audio:'1'
                                                });
                                                window.open(data.data.url);
                                            } else {
                                                cleartime();
                                                $('#login').show();
                                                $('#login').attr("data-lock", "false");
                                                getqrpic();
                                                parent.layui.notice.error({
                                                    title: t('common_ui.get_notice'),
                                                    message: data.msg,
                                                    animateInside:true,
                                                    position:'topCenter',
                                                    transitionOut:'flipOutX',
                                                    transitionOutMobile: 'flipOutX',
                                                    displayMode:'2',
                                                    audio:'1'
                                                });
                                            }
                                        },
                                        error: function() {
                                            parent.layui.notice.destroy();
                                            cleartime();
                                            $('#login').show();
                                            $('#login').attr("data-lock", "false");
                                            getqrpic();
                                            parent.layui.notice.error({
                                                title: t('common_ui.get_notice'),
                                                message: t('common.server_error'),
                                                animateInside:true,
                                                position:'topCenter',
                                                transitionOut:'flipOutX',
                                                transitionOutMobile: 'flipOutX',
                                                displayMode:'2',
                                                audio:'1'
                                            });
                                        }
                                    });
                                    break;
                            }
                            break;
                        case 1:
                            getqrpic();
                            msg = t('qrlogin.rescan');
                            break;
                        case 2:
                            msg = t('qrlogin.scan_mobile_short');
                            break;
                        case 3:
                            msg = t('qrlogin.scanned_confirm');
                            break;
                        case 4:
                            cleartime();
                            getqrpic();
                            msg = t('qrlogin.qq_not_verified', {qq: data.data.qq});
                            break;
                        case 5:
                            cleartime();
                            getqrpic();
                            msg = t('qrlogin.verification_failed');
                            break;
                        case 6:
                            cleartime();
                            getqrpic();
                            msg = data.msg;
                            break;
                        default:
                            msg = data.msg;
                            break;
                    }
                    $('#loginmsg').html(msg);
                },
                error: function() {
                    $('#loginmsg').html(t('common.server_error'));
                }
            });
        }
        function loginload(){
            if ($('#login').attr("data-lock") === "true") return;
            var load=document.getElementById('loginload').innerHTML;
            var len=load.length;
            if(len>2){
                load='.';
            }else{
                load+='.';
            }
            document.getElementById('loginload').innerHTML=load;
        }
        function cleartime(){
            // clearInterval(interval1);
            // clearInterval(interval2);
            delCookie('qrsig');
            delCookie('qrimg');
        }
        form.on('submit(replace)', function (data) {

            return false;
        });
        $(document).ready(function(){
            getqrpic();
            interval1=setInterval(loginload,1000);
            interval2=setInterval(loadScript,1500);
        });

    });
</script>
</body>
</html>
