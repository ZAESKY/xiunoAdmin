{include file="/public/header"}
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('auth_portal.content')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('common.search_by_id_or_auth_content_or_qq')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">{:t('common_ui.select_used_status')}</option>
                                <option value="1">{:t('common_ui.used')}</option>
                                <option value="0">{:t('common_ui.unused')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                    </div>
                </div>
            </form>
            <!-- 数据表格 -->

            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>
<!-- 表格操作列 -->
<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon layui-icon-delete"></i>{:t('common.delete')}</a>
</script>
<!-- 表格状态列 -->
<script type="text/html" id="SF_TbState">
    <input type="checkbox" lay-filter="SF_TbStateCk" value="{{d.id}}" lay-skin="switch"
           lay-text="{:t('common_ui.used_unused')}" {{d.status==1?'checked':''}} style="display: none;"/>
</script>
<script type="text/html" id="SF_TbPermanent_Switch">
    <input type="checkbox" lay-filter="SF_TbPermanent_SwitchCk" value="{{d.id}}" lay-skin="switch"
           lay-text="{:t('common_ui.normal_separator')}" {{d.permanent_switch==1?'checked':''}} style="display: none;"/>
</script>

<script type="text/html" id="SF_Tbid">
    <span id="SF_span_{{d.id}}">{{d.status==0?'<span class="layui-badge-dot layui-bg-sf-indigo" style="height: 6px;width: 6px;position: relative;top: -2px"></span></span> '+d.id:'<span class="layui-badge-dot layui-bg-red" style="height: 6px;width: 6px;position: relative;top: -2px"></span></span> '+d.id}}
</script>
<!-- 表单弹窗 -->
<script type="text/html" id="SF_EditDialog">
    <form id="SF_EditForm" lay-filter="SF_EditForm" class="layui-form model-form">
        <input name="id" type="hidden"/>

        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">{:t('common_ui.cdkey_type_label')}</label>
            <div class="layui-input-block">
                <input type="radio" name="cdkey_type" value="auth" title="{:t('common_ui.auth_type')}" lay-filter="cdkey_type">
                <input type="radio" name="cdkey_type" value="user" title="{:t('common_ui.power_type')}" lay-filter="cdkey_type">
            </div>
        </div>
        <div id="auth_data" style="display: none">
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('common_ui.auth_time_label')}</label>
                <div class="layui-input-block">
                    <select id="auth_price_list" name="type" class="layui-input ew-select-fixed" lay-filter="type">
                        <option value="">{:t('auth_portal.select_duration')}</option>
                    </select>
                </div>
            </div>
            <div id="diy" style="display: none">
                <div class="layui-form-item">
                    <label class="layui-form-label layui-form-required">{:t('common_ui.expire_time_label')}</label>
                    <div class="layui-input-block">
                        <input type="text" id="test" name="endtime" placeholder="{:t('auth_portal.select_expire_time')}" class="icon-date layui-input"
                               lay-verType="tips"/>
                    </div>
                </div>
            </div>
        </div>
        <div id="user_data" style="display: none">
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('common_ui.power_label')}</label>
                <div class="layui-input-block">
                    <select id="power" name="power" class="layui-input ew-select-fixed" lay-search lay-filter="power">
                        <option value="">{:t('common.please_select')} {:t('common_ui.power_type')}</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="number" style="display: none">
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('common_ui.generate_count')}</label>
                <div class="layui-input-block">
                    <input type="number" name="number" id="input_number" placeholder="{:t('cdkey.generate_count_placeholder')}" class="layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
        </div>
        <div id="cdkey" style="display: none">
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('common_ui.cdkey_label')}</label>
                <div class="layui-input-block">
                    <input type="text" name="cdkey" placeholder="{:t('common_ui.cdkey')}" class="layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
        </div>
        <div id="price" style="display: none">
            <div class="layui-form-item">
                <label class="layui-form-label">{:t('common_ui.price_label')}</label>
                <div class="layui-input-block">
                    <input type="text" id="input_price" name="price" value="￥0" class="layui-input layui-disabled"
                           lay-verType="tips" disabled/>
                </div>
            </div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="SF_EditSubmit" lay-submit>{:t('common.save')}</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">{:t('common.cancel')}</button>
        </div>
    </form>
</script>

{include file="/public/footer"}
<script>
    layui.use(['layer', 'form', 'table', 'admin', 'notice', 'laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var admin = layui.admin;
        var notice = layui.notice;
        var laydate = layui.laydate;
        var authDiscountRate = Number({$userInfo['addauth_discount']});
        var userDiscountRate = Number({$userInfo['adduser_discount']});

        function discountedMoney(unitPrice, quantity, discountRate) {
            var unitCents = Math.round(Number(unitPrice || 0) * 100);
            var totalCents = Math.round(unitCents * Math.max(0, Number(quantity || 0)) * Number(discountRate || 0));
            return (totalCents / 100).toFixed(2);
        }

        function dailyDiscountedMoney(totalPrice, days, quantity, discountRate) {
            var dayCount = Math.max(1, parseInt(days, 10) || 1);
            var dailyCents = Math.ceil(Math.round(Number(totalPrice || 0) * 100) / dayCount);
            var totalCents = Math.round(dailyCents * Math.max(0, Number(quantity || 0)) * Number(discountRate || 0));
            return (totalCents / 100).toFixed(2);
        }

        /* 渲染表格 */
        var insTb = table.render({
            elem: '#SF_Table',
            url: '{:url("/Cdkey/list")}',
            method: 'post',
            page: true,
            skin: 'line',
            size: 'lg',
            toolbar: ['<p>',
                '<button lay-event="add" class="layui-btn layui-btn-sm icon-btn"><i class="layui-icon">&#xe654;</i>{:t("common.add")}</button>&nbsp;',
                '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>{:t("common.delete")}</button>',
                '</p>'].join(''),
            cellMinWidth: 100,
            request: {
                pageName: 'current_page' //页码的参数名称，默认：page
                ,limitName: 'limit' //每页数据量的参数名，默认：limit
            },
            parseData: function(res){ //res 即为原始返回的数据
                return {
                    "code": res.code, //解析接口状态
                    "msg": res.msg, //解析提示文本
                    "count": res.data.data.total, //解析数据长度
                    "data": res.data.data.data //解析数据列表
                };
            },
            cols: [[
                {type: 'checkbox', fixed: true},
                {field: 'id', title: 'ID', templet: '#SF_Tbid', sort: true, width: 80, fixed: true},
                {field: 'appName', title: '{:t("common_ui.belong_app")}', sort: true, minWidth: 120, templet: function (d) {
                        return '<span class="layui-badge layui-badge-orange">'+d.appName+'</span>';
                    }},
                {field: 'cdkey_type', title: '{:t("common_ui.cdkey_type")}', sort: true, minWidth: 80, templet: function (d) {
                        if(d.cdkey_type == 'auth'){
                            return '<span class="layui-badge layui-badge-red">{:t("common_ui.auth_type")}</span>';
                        }else if(d.cdkey_type == 'user'){
                            return '<span class="layui-badge layui-badge-blue">{:t("common_ui.power_type")}</span>';
                        }else if(d.cdkey_type == 'balance'){
                            return '<span class="layui-badge layui-badge-green">{:t("common_ui.balance_type")}</span>';
                        }else if(d.cdkey_type == 'integral'){
                            return '<span class="layui-badge layui-badge-yellow">{:t("common_ui.integral_type")}</span>';
                        }
                    },
                },
                {field: 'cdkey', title: '{:t("common_ui.cdkey")}', minWidth: 240},
                {field: 'info', title: '{:t("common.detail")}', sort: true, minWidth: 150, templet: function (d) {
                    if (!d.info) return '-';
                    try {
                        var info = typeof d.info === 'string' ? JSON.parse(d.info) : d.info;
                        if (d.cdkey_type === 'balance') {
                            return '<span class="layui-badge layui-badge-green">{:t("accounting.balance")} +' + (info.balance || 0) + ' {:t("accounting.currency_unit")}</span>';
                        } else if (d.cdkey_type === 'integral') {
                            return '<span class="layui-badge layui-badge-yellow">{:t("accounting.point_unit")} +' + (info.integral || 0) + '</span>';
                        } else if (d.cdkey_type === 'user') {
                            return '<span class="layui-badge layui-badge-blue">' + (info.power_name || ('{:t("cdkey.power_id")}: ' + info.power) || '?') + '</span>';
                        } else if (d.cdkey_type === 'auth') {
                            var p = info.permanent_switch == 1 ? '{:t("common_ui.permanent_auth")}' : (info.endtime || '?');
                            return '<span class="layui-badge layui-badge-red">' + p + '</span>';
                        }
                    } catch(e) {}
                    return d.info;
                }},
                {field: 'addtime', title: '{:t("common_ui.use_time")}', sort: true, minWidth: 290, templet: function (d) {
                        if(d.usetime == null){
                            return '<span class="layui-badge layui-badge-blue">'+d.addtime+'</span> <span class="layui-badge layui-badge-green">{:t("common_ui.unused")}</span>';
                        }else{
                            return '<span class="layui-badge layui-badge-blue">'+d.addtime+'</span> <span class="layui-badge layui-badge-red">'+d.usetime+'</span>';
                        }
                    }
                },
                {title: '{:t("common.operation")}', toolbar: '#SF_TbBar', align: 'center', minWidth: 180}
            ]]
        });


        form.on('select(type)', function (data) {
            let diy = $("#auth_price_list option:selected").attr('diy');
            let price = $("#auth_price_list option:selected").attr('price');
            let input_number = $("#input_number").val();
            if (diy == "1") {
                $("#diy").css("display", "inherit");
                if(data.value == ''){
                    $('#input_price').val('{:t("common_ui.enter_expire_first")}');
                }else{
                    $('#input_price').val('￥0');
                }
            }else{
                $("#diy").css("display", "none");
                if(data.value == ''){
                    $('#input_price').val('{:t("common_ui.select_time_first")}');
                }else{
                    $('#input_price').val('￥' + discountedMoney(price, input_number, authDiscountRate));
                }
            }
        });

        form.on('select(power)', function (data) {
            let price = $("#power option:selected").attr('price');
            let input_number = $("#input_number").val();
            if (data.value == "") {
                $('#input_price').val('{:t("common_ui.select_power_first")}');
            }else{
                $('#input_price').val('￥' + discountedMoney(price, input_number, userDiscountRate));
            }
        });
        /* 表格搜索 */
        form.on('submit(SF_TbSearch)', function (data) {
            insTb.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        /* 表格工具条点击事件 */
        table.on('tool(SF_Table)', function (obj) {
            if (obj.event === 'del') { // 删除
                doDel(obj);
            }
        });

        /* 表格头工具栏点击事件 */
        table.on('toolbar(SF_Table)', function (obj) {
            if (obj.event === 'add') { // 添加
                showEditModel();
            } else if (obj.event === 'del') { // 删除
                var checkRows = table.checkStatus('SF_Table');
                if (checkRows.data.length === 0) {
                    notice.msg('{:t("confirm.please_select_data")}', {icon: 3, audio:'1'});
                    return;
                }
                var ids = checkRows.data.map(function (d) {
                    return d.id;
                });
                doDel({ids: ids});
            }
            laydate.render({
                elem: '#test', //指定元素
                mark: {
                    '0-3-15': 'SF'
                },
                type: 'datetime',
                trigger: 'click',
                done: function(value, date){
                    let price = $("#auth_price_list option:selected").attr('price');
                    let day = $("#auth_price_list option:selected").attr('day');
                    let input_number = $("#input_number").val();
                    if(value == ''){
                        $('#input_price').val('{:t("common_ui.enter_expire_first")}');
                    }else{
                        $('#input_price').val('￥' + dailyDiscountedMoney(price, day, DateDiff(value) * input_number, authDiscountRate));
                    }
                }
            });
        });

        function DateDiff(sDate2) {
            var aDate, oDate1, oDate2, iDays, info, time;
            oDate1 = new Date();  //转换为yyyy-MM-dd格式
            info = sDate2.split(" ");
            aDate = info[0].split("-");
            time = info[1].split(":");
            oDate2 = new Date(aDate[0] + '-' + aDate[1] + '-' + aDate[2]);
            iDays = Math.ceil((oDate2 - oDate1) / 1000 / 60 / 60 / 24); //把相差的毫秒数转换为天数
            if(time[0] != '00' || time[1] != '00' || time[2] != '00'){
                iDays++;
            }
            if(iDays < 0){
                iDays = 0;
            }
            return iDays;  //返回相差天数
        }

        /* 显示表单弹窗 */
        function showEditModel(mData) {
            admin.popupRight({
                type: 1,
                title: (mData ? '{:t("common.edit")}' : '{:t("common.add")}') + ' {:t("common_ui.cdkey")}',
                content: $('#SF_EditDialog').html(),
                success: function (layero, dIndex) {
                    form.on('radio(cdkey_type)', function (data) {
                        if (data.value == 'auth') {
                            notice.msg('{:t("common.loading_list")}', {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: '{:url("/Auth/getAuthPriceList")}',
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        var content = '<option value="">{:t("auth_portal.select_duration")}</option>';
                                        $.each(data.data,function(index, value){
                                            $.each(value,function(index, value){
                                                if(value.diy_switch == 1){
                                                    content += '<option value="'+value.id+'" diy="1" day="'+value.day+'" price="'+value.money+'">'+value.name+'</option>';
                                                }else{
                                                    content += '<option value="'+value.id+'" diy="0" price="'+value.money+'">'+value.name+'</option>';
                                                }
                                            });
                                        });

                                        $("#auth_price_list").html(content);
                                        notice.msg('{:t("common.list_success")}', {icon: 1, audio:'1'});
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                    form.render();
                                },
                                error: function() {
                                    notice.destroy();
                                    notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                                }
                            });
                            $("#auth_data").css("display", "inherit");
                            $("#user_data").css("display", "none");
                            $("#number").css("display", "inherit");
                            $("#price").css("display", "inherit");

                            $(document).bind('input propertychange',"#auth_price_list,#input_number",function(){
                                let auth_price_list = $("#auth_price_list").val();
                                let input_number = $('#input_number').val();
                                let price = $("#auth_price_list option:selected").attr('price');
                                let day = $("#auth_price_list option:selected").attr('day');
                                let diy = $("#auth_price_list option:selected").attr('diy');
                                if(auth_price_list == ''){
                                    $('#input_price').val('{:t("common_ui.select_time_first")}');
                                }else{
                                    if(diy == '1'){
                                        let endtime = $("input[name='endtime']").val();
                                        if(endtime == ''){
                                            $('#input_price').val('{:t("common_ui.enter_expire_first")}');
                                        }else{
                                            $('#input_price').val('￥' + dailyDiscountedMoney(price, day, DateDiff(endtime) * input_number, authDiscountRate));
                                        }
                                    }else{
                                        $('#input_price').val('￥' + discountedMoney(price, input_number, authDiscountRate));
                                    }
                                }
                            });
                        }else if (data.value == 'user'){
                            let appid = $("select[name='appid']").val();
                            notice.msg('{:t("common.loading_list")}', {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: '{:url("/Cdkey/getPowerList")}',
                                data: {"appid":appid},
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        notice.msg(data.msg, {icon: 1, audio:'1'});
                                        var content = '<option value="">{:t("common.please_select")} {:t("common_ui.power_type")}</option>';
                                        $.each(data.data.data, function(index, value) {
                                            content +='<option value="'+value.id+'" price="'+value.money+'">'+value.name+'</option>';
                                        });
                                        $("#power").html(content);
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                    form.render();
                                },
                                error: function() {
                                    notice.destroy();
                                    notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                                }
                            });
                            $("#auth_data").css("display", "none");
                            $("#user_data").css("display", "inherit");
                            $("#number").css("display", "inherit");
                            $("#price").css("display", "inherit");

                            $(document).bind('input propertychange',"#power,#input_number",function(){
                                let power = $("#power").val();
                                let input_number = $('#input_number').val();
                                let price = $("#power option:selected").attr('price');
                                if(power == ''){
                                    $('#input_price').val('{:t("common_ui.select_power_first")}');
                                }else{
                                    $('#input_price').val('￥' + discountedMoney(price, input_number, userDiscountRate));
                                }
                            });
                        }
                    });
                    form.render();
                    $("#cdkey").css("display", "none");
                    $("#number").css("display", "none");
                    $("#type").css("display", "none");
                    $("#diy").css("display", "none");

                    // 表单提交事件
                    form.on('submit(SF_EditSubmit)', function (data) {
                        notice.msg('{:t("common.loading")}', {icon: 4, close: true});
                        $.ajax({
                            type: "POST",
                            url: '{:url("/Cdkey/edit")}',
                            data: data.field,
                            dataType: "json",
                            success: function(data) {
                                notice.destroy();
                                if (data.code == 0) {
                                    table.reload('SF_Table');
                                    notice.msg(data.msg, {icon: 1, audio:'1'});
                                } else {
                                    notice.msg(data.msg, {icon: 2, audio:'1'});
                                }
                            },
                            error: function() {
                                notice.destroy();
                                notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                            }
                        });
                        return false;
                    });
                    // 禁止弹窗出现滚动条
                    $(layero).children('.layui-layer-content').css('overflow', 'visible');
                }
            });
        }

        /* 删除 */
        function doDel(obj) {
            layer.confirm('{:t("confirm.delete_selected")}', {
                skin: 'layui-layer-admin',
                icon: 3,
                shade: .1
            }, function (i) {
                layer.close(i);
                notice.msg('{:t("common.loading")}', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url: obj.data ? '{:url("/Cdkey/drop")}' : '{:url("/Cdkey/batchDrop")}',
                    data: {id: obj.data ? obj.data.id : obj.ids.join(',')},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            insTb.reload({page: {curr: 1}});
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                        }else{
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                    }
                });
            });
        }
    });
</script>
