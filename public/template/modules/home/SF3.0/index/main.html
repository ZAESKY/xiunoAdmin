{include file="index/header"}
{$background_image|raw}
<div class="layui-row layui-col-space20">
    <div class="layui-col-sm6">
        <div class="vp-card" id="divLoading">
            <h2 class="vp-card-title">授权查询</h2>
            <form class="layui-form" id="queryAuthForm">
                <div class="layui-form-item">
                    <label class="vp-label">选择应用</label>
                    <select name="appid" lay-filter="app" lay-search lay-verify="required">
                        <option value="">请选择应用</option>
                        {volist name="app_list.data.data" id="res"}
                        <option value="{$res.id}">{$res.name}</option>
                        {/volist}
                    </select>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">查询内容</label>
                    <input type="text" name="auth_info" placeholder="请输入要查询的内容" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">查询类型</label>
                    <div class="vp-query-types">
                        <input type="radio" name="query_type" value="auth" title="授权" checked>
                        <input type="radio" name="query_type" value="user" title="代理">
                        <input type="radio" name="query_type" value="pay" title="认证">
                    </div>
                </div>
                <div id="introduce" class="vp-introduce" style="display:none">
                    <div id="introduceContent"></div>
                </div>
                <div class="vp-form-actions">
                    <button type="button" class="vp-btn vp-btn-brand" lay-filter="SF_QueryAuth" lay-submit>查询</button>
                    <button type="button" class="vp-btn vp-btn-ghost" id="SF_QueryAuth_Reset">重置</button>
                </div>
            </form>
        </div>
    </div>
    <div class="layui-col-sm6">
        <div class="vp-card">
            <h2 class="vp-card-title">用户注册</h2>
            <form class="layui-form" id="registerForm">
                <div class="layui-form-item">
                    <label class="vp-label">选择应用</label>
                    <select name="appid" lay-filter="register_app" lay-search lay-verify="required">
                        <option value="">请选择应用</option>
                        {volist name="app_list.data.data" id="res"}
                        <option value="{$res.id}">{$res.name}</option>
                        {/volist}
                    </select>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">用户名</label>
                    <input type="text" name="username" placeholder="请输入用户名" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">密码</label>
                    <input type="password" name="password" placeholder="请输入密码" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">确认密码</label>
                    <input type="password" name="confirmPassword" placeholder="请确认密码" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">QQ</label>
                    <input type="number" name="qq" placeholder="请输入要绑定的QQ" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">邮箱</label>
                    <input type="text" name="email" placeholder="请输入要绑定的邮箱" class="layui-input" lay-verify="required"/>
                </div>
                <div class="vp-form-actions">
                    <button type="button" class="vp-btn vp-btn-brand" lay-filter="SF_RegisterSubmit" lay-submit>注册</button>
                    <button type="button" class="vp-btn vp-btn-ghost" id="SF_Register_Reset">重置</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div></div>
<div class="vp-page-footer">
    <p>{:conf('foot')}</p>
    <p>{:conf('ICP')}</p>
</div>
<div id="myAudio1"></div>
{include file="index/footer"}
{$background_notice|raw}
{$background_music|raw}
<script>
layui.use(['layer', 'form', 'admin', 'element', 'notice'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var admin = layui.admin;
    var notice = layui.notice;

    $("#SF_QueryAuth_Reset").click(function(){
        document.getElementById("queryAuthForm").reset();
        $('#introduce').hide();
        form.render('select');
        form.render('radio');
        notice.msg('已重置查询表单', {icon: 1, audio:'1'});
    });
    $("#SF_Register_Reset").click(function(){
        document.getElementById("registerForm").reset();
        form.render('select');
        notice.msg('已重置注册表单', {icon: 1, audio:'1'});
    });

    form.on('select(app)', function (data) {
        if(data.value == ''){
            $('#introduce').hide();
            return;
        }
        $.ajax({
            type: "POST",
            url: '{:url("/Ajax/appInfo")}',
            data: {appid:data.value},
            dataType: "json",
            success: function(res) {
                if (res.code == 0) {
                    notice.msg("获取信息成功", {icon: 1, audio:'1'});
                    $("#introduceContent").html(res.data.introduce || '暂无介绍');
                    $("#introduce").show();
                    if(res.data.app_notice){
                        admin.open({
                            type: 1,
                            title: '应用公告',
                            shade: .1,
                            content: '<div style="padding:20px;line-height:1.8;">'+res.data.app_notice+'</div>'
                        });
                    }
                } else {
                    notice.msg(res.msg, {icon: 2, audio:'1'});
                }
            },
            error: function() {
                notice.msg("服务器错误", {icon: 2, audio:'1'});
            }
        });
    });

    form.on('select(register_app)', function (data) {
        if (!data.value) return;
        $.ajax({
            type: "POST",
            url: '{:url("/Ajax/appInfo")}',
            data: {appid:data.value},
            dataType: "json",
            success: function(res) {
                if (res.code == 0 && res.data.register_notice) {
                    admin.open({
                        type: 1,
                        title: '注册公告',
                        shade: .1,
                        content: '<div style="padding:20px;line-height:1.8;">'+res.data.register_notice+'</div>'
                    });
                }
            }
        });
    });

    form.on('submit(SF_QueryAuth)', function (data) {
        notice.msg('正在查询...', {icon: 4, close: true});
        $.ajax({
            type: "POST",
            url: '{:url("/Ajax/queryAuth")}',
            data: data.field,
            dataType: "json",
            success: function(res) {
                notice.destroy();
                if (res.code == 0) {
                    if(res.data.status == 1){
                        notice.warning({
                            title: '查询通知', message: res.msg,
                            animateInside:true, position:'topCenter',
                            transitionOut:'flipOutX', displayMode:'2', audio:'1'
                        });
                    } else {
                        notice.success({
                            title: '查询通知', message: res.msg,
                            animateInside:true, position:'topCenter',
                            transitionOut:'flipOutX', displayMode:'2', audio:'1'
                        });
                    }
                } else {
                    notice.error({
                        title: '查询通知', message: res.msg,
                        animateInside:true, position:'topCenter',
                        transitionOut:'flipOutX', displayMode:'2', audio:'1'
                    });
                }
            },
            error: function() {
                notice.destroy();
                notice.error({
                    title: '查询通知', message: '服务器错误',
                    animateInside:true, position:'topCenter',
                    transitionOut:'flipOutX', displayMode:'2', audio:'1'
                });
            }
        });
        return false;
    });

    form.on('submit(SF_RegisterSubmit)', function (data) {
        notice.msg('正在提交...', {icon: 4, close: true});
        $.ajax({
            type: "POST",
            url: '{:url("/Ajax/register")}',
            data: data.field,
            dataType: "json",
            success: function(res) {
                notice.destroy();
                if (res.code == 0) {
                    notice.success({
                        title: '注册通知', message: res.msg,
                        animateInside:true, position:'topCenter',
                        transitionOut:'flipOutX', displayMode:'2', audio:'1'
                    });
                } else {
                    notice.error({
                        title: '注册通知', message: res.msg,
                        animateInside:true, position:'topCenter',
                        transitionOut:'flipOutX', displayMode:'2', audio:'1'
                    });
                }
            },
            error: function() {
                notice.destroy();
                notice.error({
                    title: '注册通知', message: '服务器错误',
                    animateInside:true, position:'topCenter',
                    transitionOut:'flipOutX', displayMode:'2', audio:'1'
                });
            }
        });
        return false;
    });
});
</script>
</body>
</html>
