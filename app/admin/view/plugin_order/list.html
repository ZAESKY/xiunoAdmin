{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('auth_portal.content')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('plugin_record.search_order_plugin')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">{:t('feedback.all_statuses')}</option>
                                <option value="0">{:t('plugin_ui.pending_payment')}</option>
                                <option value="1">{:t('plugin_ui.paid')}</option>
                                <option value="2">{:t('plugin_ui.cancelled')}</option>
                                <option value="3">{:t('plugin_ui.refunded')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">
                        <button class="layui-btn icon-btn" lay-filter="QH_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                    </div>
                </div>
            </form>
            <table id="QH_Table" lay-filter="QH_Table"></table>
        </div>
    </div>
</div>

<script type="text/html" id="QH_TbBar">
    <a class="layui-btn layui-btn-sm" lay-event="status"><i class="layui-icon">&#xe605;</i>{:t('common.status')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon">&#xe640;</i>{:t('common.delete')}</a>
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'notice'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var table = layui.table;
    var notice = layui.notice;

    var insTb = table.render({
        elem: '#QH_Table',
        url: '{:url("/PluginOrder/list")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        toolbar: ['<p>',
            '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>{:t('plugin_ui.batch_delete')}</button>',
            '</p>'].join(''),
        cellMinWidth: 100,
        request: {
            pageName: 'current_page',
            limitName: 'limit'
        },
        parseData: function(res){
            return {
                "code": res.code,
                "msg": res.msg,
                "count": res.data.data.total,
                "data": res.data.data.data
            };
        },
        cols: [[
            {type: 'checkbox', fixed: true},
            {field: 'id', title: 'ID', sort: true, width: 80, fixed: true},
            {field: 'order_no', title: '{:t("plugin_ui.order_number")}', minWidth: 200},
            {field: 'plugin_name', title: '{:t("plugin_ui.name")}', minWidth: 150},
            {field: 'plugin_version', title: '{:t("version_ui.version_suffix")}', width: 100},
            {field: 'user_id', title: '{:t("common_ui.user_id")}', width: 100},
            {field: 'app_id', title: '{:t("plugin_ui.app_id")}', width: 100},
            {field: 'price', title: '{:t("accounting.amount")}', width: 100, templet: function(d){
                if (d.pay_type === 'points') return '<span class="layui-badge layui-badge-orange">'+parseInt(d.price)+' {:t("accounting.point_unit")}</span>';
                return '<span class="layui-badge layui-badge-orange">¥'+d.price+'</span>';
            }},
            {field: 'commission_rate', title: '{:t("plugin_record.commission_rate")}', width: 100, templet: function(d){
                return d.pay_type === 'points' ? '{:t("plugin_record.no_commission")}' : (parseFloat(d.commission_rate || 0) + '%');
            }},
            {field: 'commission_amount', title: '{:t("plugin_record.platform_commission")}', width: 110, templet: function(d){
                return d.pay_type === 'points' ? '-' : ('¥' + (d.commission_amount || '0.00'));
            }},
            {field: 'developer_income', title: '{:t("plugin_record.publisher_income")}', width: 120, templet: function(d){
                return d.pay_type === 'points' ? (parseInt(d.developer_income || 0) + ' {:t("accounting.point_unit")}') : ('¥' + (d.developer_income || '0.00'));
            }},
            {field: 'pay_type', title: '{:t("common_ui.payment_method")}', width: 100, templet: function(d){
                switch(d.pay_type){
                    case 'alipay': return '<span class="layui-badge layui-badge-blue">{:t('order_ui.alipay')}</span>';
                    case 'wxpay': return '<span class="layui-badge layui-badge-green">{:t('order_ui.wechat')}</span>';
                    case 'qqpay': return '<span class="layui-badge layui-badge-red">QQ</span>';
                    case 'balance': return '<span class="layui-badge layui-badge-purple">{:t('accounting.balance')}</span>';
                    case 'points': return '<span class="layui-badge layui-badge-orange">{:t('accounting.point_unit')}</span>';
                    default: return '-';
                }
            }},
            {field: 'status', title: '{:t("common.status")}', width: 100, templet: function(d){
                switch(d.status){
                    case 0: return '<span class="layui-badge layui-badge-orange">{:t('plugin_ui.pending_payment')}</span>';
                    case 1: return '<span class="layui-badge layui-badge-green">{:t('plugin_ui.paid')}</span>';
                    case 2: return '<span class="layui-badge layui-badge-gray">{:t('plugin_ui.cancelled')}</span>';
                    case 3: return '<span class="layui-badge layui-badge-red">{:t('plugin_ui.refunded')}</span>';
                    default: return '-';
                }
            }},
            {field: 'ip', title: 'IP', width: 120},
            {field: 'created_at', title: '{:t("payment_ui.create_time")}', minWidth: 160},
            {field: 'paid_at', title: '{:t("plugin_ui.payment_time")}', minWidth: 160},
            {title: '{:t("common.operation")}', toolbar: '#QH_TbBar', align: 'center', minWidth: 150, fixed: 'right'}
        ]]
    });

    form.on('submit(QH_TbSearch)', function (data) {
        insTb.reload({where: data.field, page: {curr: 1}});
        return false;
    });

    table.on('tool(QH_Table)', function (obj) {
        if (obj.event === 'status') {
            var statusOptions = [{value:0,text:'{:t("plugin_ui.pending_payment")}'},{value:1,text:'{:t("plugin_ui.paid")}'},{value:2,text:'{:t("plugin_ui.cancelled")}'},{value:3,text:'{:t("plugin_ui.refunded")}'}];
            var html = '<div style="padding:20px;"><select id="order_status">';
            statusOptions.forEach(function(opt){
                html += '<option value="'+opt.value+'" '+(obj.data.status==opt.value?'selected':'')+'>'+opt.text+'</option>';
            });
            html += '</select></div>';

            layer.open({
                type: 1, title: '{:t("plugin_ui.change_status")}', content: html, area: ['400px', '200px'],
                btn: ['{:t("common.confirm")}', '{:t("common.cancel")}'],
                yes: function(index) {
                    $.ajax({
                        type: "POST", url: '{:url("/PluginOrder/setStatus")}',
                        data: {id: obj.data.id, status: $('#order_status').val()},
                        dataType: "json",
                        success: function(res) {
                            if (res.code == 0) { notice.msg(res.msg, {icon:1}); table.reload('QH_Table'); layer.close(index); }
                            else { notice.msg(res.msg, {icon:2}); }
                        }
                    });
                }
            });
            form.render('select');
        } else if (obj.event === 'del') {
            layer.confirm('{:t("plugin_record.confirm_delete_order")}', {skin:'layui-layer-admin',icon:3,shade:.1}, function(i) {
                layer.close(i);
                $.ajax({
                    type: "POST", url: '{:url("/PluginOrder/drop")}', data: {id: obj.data.id}, dataType: "json",
                    success: function(res) {
                        if (res.code == 0) { table.reload('QH_Table'); notice.msg(res.msg, {icon:1}); }
                        else { notice.msg(res.msg, {icon:2}); }
                    }
                });
            });
        }
    });

    table.on('toolbar(QH_Table)', function (obj) {
        if (obj.event === 'del') {
            var checkRows = table.checkStatus('QH_Table');
            if (checkRows.data.length === 0) { notice.msg('{:t("confirm.please_select_data")}', {icon:3}); return; }
            var ids = checkRows.data.map(function(d){ return d.id; });
            layer.confirm('{:t("auth_portal.confirm_delete")}', {skin:'layui-layer-admin',icon:3,shade:.1}, function(i) {
                layer.close(i);
                $.ajax({
                    type: "POST", url: '{:url("/PluginOrder/batchDrop")}', data: {id: ids.join(',')}, dataType: "json",
                    success: function(res) {
                        if (res.code == 0) { table.reload('QH_Table'); notice.msg(res.msg, {icon:1}); }
                        else { notice.msg(res.msg, {icon:2}); }
                    }
                });
            });
        }
    });
});
</script>
