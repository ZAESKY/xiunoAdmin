{include file="/public/header"}
<style>
/* 顶部 */
.market-header { display: flex; align-items: center; justify-content: space-between; padding: 0 0 20px 0; }
.market-header h2 { margin: 0; font-size: 20px; font-weight: 600; color: #1a1a1a; }
.market-header h2 span { font-size: 14px; color: #999; font-weight: 400; margin-left: 6px; }

/* 卡片网格 */
.plugin-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 4px; }

/* 卡片 */
.plugin-card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 18px 16px; cursor: pointer; transition: all .25s; position: relative; overflow: hidden; }
.plugin-card:hover { border-color: #d0d5dd; box-shadow: 0 6px 24px rgba(0,0,0,0.07); transform: translateY(-2px); }
.plugin-card .card-badge { position: absolute; top: 0; right: 0; font-size: 11px; padding: 2px 10px; border-radius: 0 10px 0 8px; font-weight: 500; }
.plugin-card .card-badge.hot { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: #fff; }
.plugin-card .card-badge.rec { background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: #fff; }

/* 图标 + 信息 */
.plugin-card .card-top { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.plugin-card .card-icon { width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; object-fit: cover; background: #f7f8fa; border: 1px solid #f0f0f0; }
.plugin-card .card-info { flex: 1; min-width: 0; }
.plugin-card .card-name { font-size: 14px; font-weight: 600; color: #1d1d1f; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plugin-card .card-version { font-size: 11px; color: #9e9e9e; font-weight: 700; margin-left: 4px; vertical-align: middle; }
.plugin-card .card-meta { font-size: 12px; color: #8e8e93; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
.plugin-card .card-meta .meta-sep { width: 1px; height: 10px; background: #e0e0e0; display: inline-block; }
.plugin-card .card-meta .meta-icon { font-size: 12px; color: #b0b0b0; }
.plugin-card .card-cat-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; background: #f5f5f5; color: #8e8e93; }
.plugin-card .card-desc { font-size: 12px; color: #6e6e73; line-height: 1.5; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }

/* 底部 */
.plugin-card .card-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid #f5f5f5; }
.plugin-card .card-price { font-size: 15px; font-weight: 700; }
.plugin-card .card-price.free { color: #34c759; }
.plugin-card .card-price.paid { color: #ff5722; }
.plugin-card .card-extra { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8e8e93; }
.plugin-card .card-extra .stars { color: #f5a623; }

@media (max-width: 1400px) { .plugin-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 992px)  { .plugin-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px)  { .plugin-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 420px)  { .plugin-grid { grid-template-columns: 1fr; } }
</style>

<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <div class="market-header">
                <h2>插件市场 <span id="totalBadge"></span></h2>
                <form class="layui-form" style="margin:0;">
                    <div class="layui-form-item" style="margin:0;">
                        <div class="layui-inline" style="margin-right:6px;">
                            <div class="layui-input-inline" style="width:160px;">
                                <input name="text" class="layui-input" placeholder="搜索名称/作者">
                            </div>
                        </div>
                        <div class="layui-inline" style="margin-right:6px;">
                            <select name="category" id="filterCategory">
                                <option value="">全部分类</option>
                                <option value="feature">功能增强</option>
                                <option value="security">安全防护</option>
                                <option value="content">内容管理</option>
                                <option value="ui">界面美化</option>
                                <option value="payment">支付集成</option>
                                <option value="dev">开发工具</option>
                                <option value="analytics">数据分析</option>
                                <option value="social">社交互动</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="layui-inline" style="margin-right:6px;">
                            <select name="price_type">
                                <option value="">全部价格</option>
                                <option value="free">免费</option>
                                <option value="paid">付费</option>
                            </select>
                        </div>
                        <div class="layui-inline" style="margin-right:6px;">
                            <select name="sort">
                                <option value="default">默认排序</option>
                                <option value="downloads">下载最多</option>
                                <option value="comments">评论最多</option>
                                <option value="rating">评分最高</option>
                                <option value="newest">最新发布</option>
                            </select>
                        </div>
                        <div class="layui-inline">
                            <button class="layui-btn" lay-filter="SF_TbSearch" lay-submit>
                                <i class="layui-icon">&#xe615;</i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div id="pluginGrid" class="plugin-grid"></div>
            <div id="pagination" style="text-align:center;margin-top:28px;"></div>
        </div>
    </div>
</div>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'laypage'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var laypage = layui.laypage;
    var currentPage = 1;
    var searchParams = {};
    var catMap = {feature:'功能增强',security:'安全防护',content:'内容管理',ui:'界面美化',payment:'支付集成',dev:'开发工具',analytics:'数据分析',social:'社交互动',other:'其他'};

    function loadPlugins(page) {
        page = page || 1;
        $.ajax({
            type: "POST", url: '{:url("/UserPlugin/market")}',
            data: Object.assign({}, searchParams, { current_page: page, limit: 10 }),
            dataType: "json",
            success: function(res) {
                if (res.code == 0) {
                    renderPlugins(res.data.data.data);
                    renderPagination(res.data.data.total, page);
                    $('#totalBadge').text('共 '+res.data.data.total+' 款');
                } else { layer.msg(res.msg, {icon: 2}); }
            }
        });
    }

    function renderStars(rating) {
        var r = Math.round(rating), s = '';
        for (var i = 1; i <= 5; i++) s += i <= r ? '★' : '☆';
        return s;
    }

    function fmtCount(n) {
        if (n >= 10000) return (n/10000).toFixed(1)+'万';
        if (n >= 1000) return (n/1000).toFixed(1)+'k';
        return n;
    }

    function renderPlugins(plugins) {
        var html = '';
        if (plugins.length === 0) {
            html = '<div style="grid-column:1/-1;text-align:center;padding:90px 0;color:#bbb;"><i class="layui-icon layui-icon-component" style="font-size:52px;display:block;margin-bottom:14px;"></i>暂无插件</div>';
        } else {
            plugins.forEach(function(p) {
                var icon = p.icon || '/Assets/img/default-plugin.png';
                var desc = p.description || '暂无简介';
                var badge = '';
                if (p.is_hot == 1) badge = '<span class="card-badge hot">热门</span>';
                else if (p.is_recommend == 1) badge = '<span class="card-badge rec">推荐</span>';

                html += '<div class="plugin-card" data-id="'+p.id+'">';
                html +=   badge;
                html += '  <div class="card-top">';
                html += '    <img src="'+icon+'" class="card-icon" onerror="this.src=\'/Assets/img/default-plugin.png\'">';
                html += '    <div class="card-info">';
                html += '      <div class="card-name" title="'+esc(p.name)+'">'+esc(p.name)+' <span class="card-version">v'+esc(p.version)+'</span></div>';
                html += '      <div class="card-meta"><span class="card-cat-tag">'+(catMap[p.category]||'其他')+'</span> <span class="meta-sep"></span> <i class="layui-icon layui-icon-username meta-icon"></i> '+esc(p.author)+' <span class="meta-sep"></span> <i class="layui-icon layui-icon-download-circle meta-icon"></i> '+fmtCount(p.download_count)+'</div>';
                html += '    </div>';
                html += '  </div>';
                html += '  <div class="card-desc">'+esc(desc)+'</div>';
                html += '  <div class="card-foot">';
                if (p.price == 0) {
                    html += '    <span class="card-price free">免费</span>';
                } else if (p.pay_type == 'points') {
                    html += '    <span class="card-price paid">'+parseInt(p.price)+' <span style="font-size:11px;color:#8e8e93;">积分</span></span>';
                } else {
                    html += '    <span class="card-price paid">¥'+p.price+'</span>';
                }
                html += '    <div class="card-extra"><span class="stars">'+renderStars(p.rating_avg)+'</span> <i class="layui-icon layui-icon-dialogue meta-icon"></i> <span>'+p.comment_count+'</span></div>';
                html += '  </div>';
                html += '</div>';
            });
        }
        $('#pluginGrid').html(html);
        $('.plugin-card').click(function() { showDetail($(this).data('id')); });
    }

    function renderPagination(total, curr) {
        laypage.render({
            elem: 'pagination', count: total, curr: curr, limit: 10,
            layout: ['prev', 'page', 'next'],
            jump: function(obj, first) { if (!first) loadPlugins(obj.curr); }
        });
    }

    function showDetail(id) {
        layer.open({
            type: 2, title: '插件详情',
            content: '{:url("/UserPlugin/detail")}?id=' + id,
            area: ['90%', '90%'], maxmin: true
        });
    }

    function esc(s) {
        var m = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
        return String(s||'').replace(/[&<>"']/g,function(c){return m[c];});
    }

    form.on('submit(SF_TbSearch)', function (data) {
        searchParams = data.field;
        loadPlugins(1);
        return false;
    });

    loadPlugins(1);
});
</script>
