<!DOCTYPE html>
<html lang="{:t('common.lang_code')}">
<head>
    <meta charset="utf-8">
    <title>{$title}|{:t('qq_register.page_title')}</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="{__LIBS__}layui/css/layui.css"/>
    <link rel="stylesheet" href="{__MODULE__}admin.css?v=318"/>
</head>
<style>
    .login-wrapper { max-width: 420px; padding: 20px; margin: 0 auto; position: relative; box-sizing: border-box; z-index: 2; }
    .login-wrapper > .layui-form { padding: 28px 15px; background-color: #fff; box-shadow: 0 3px 6px -1px rgba(0,0,0,.19); box-sizing: border-box; border-radius: 4px; }
    .login-wrapper > .layui-form > .layui-form-item { margin-bottom: 25px; position: relative; }
    .login-wrapper > .layui-form > .layui-form-item:last-child { margin-bottom: 0; }
    .login-wrapper .layui-btn-fluid { height: 40px; line-height: 40px; border-radius: 4px; background-color: #5FB878; border-color: #5FB878; }
    .login-wrapper .layui-link { color: #5FB878 !important; }
    .logo { width: 60px !important; margin: 10px 0 10px 20px !important; }
    .title { font-size: 30px !important; font-weight: 550 !important; margin: 10px 0 0 20px !important; color: #3492ed !important; display: inline-block !important; height: 60px !important; line-height: 60px !important; position: absolute !important; }
    .desc { width: 100% !important; text-align: center !important; color: gray !important; min-height: 48px !important; line-height: 24px !important; box-sizing: border-box; padding: 0 18px; }
    .register-note { text-align: center; color: #8c8c8c; line-height: 1.8; }
    @media screen and (min-height: 550px) {
        .login-wrapper { margin: -225px auto 0; position: absolute; top: 50%; left: 0; right: 0; width: 100%; }
    }
</style>
<body style="background-image:url('{__IMG__}background.svg');background-size:cover;">
<a href="javascript:SF_LANG.toggle();" title="{:t('common.language')}" style="position:absolute;right:24px;top:18px;color:#fff;z-index:3;">{:t('common.lang_toggle')}</a>
<div class="login-wrapper layui-anim layui-anim-scale">
    <form class="layui-form layui-card-body" id="registerCard" style="opacity:.95;">
        <div class="layui-form-item">
            <img class="logo" src="{__IMG__}logo.png" alt="logo"/>
            <div class="title">{:t('qq_register.title')}</div>
            <div class="desc">{:t('qq_register.subtitle')}</div>
        </div>
        <div class="layui-form-item">
            {if $qq_register_enabled}
            <button type="button" class="layui-btn layui-btn-fluid" id="qqRegisterButton">
                <i class="layui-icon layui-icon-login-qq"></i> {:t('qq_register.button')}
            </button>
            {else}
            <button type="button" class="layui-btn layui-btn-fluid layui-btn-disabled" disabled>{:t('qq_register.disabled')}</button>
            {/if}
        </div>
        <div class="layui-form-item register-note">
            <div>{:t('qq_register.existing_login')}</div>
            <div>{:t('qq_register.terms')}</div>
        </div>
        <div class="layui-form-item text-center">
            <a href="{:url('/login/index')}" class="layui-link">{:t('qq_register.back_login')}</a>
        </div>
    </form>
</div>

<script src="//lib.baomitu.com/jquery/1.12.4/jquery.min.js"></script>
<script type="text/javascript" src="{__LIBS__}layui/layui.js"></script>
<script>window.SF_I18N_LOCALE = "{:t('common.lang_code')}"; window.SF_I18N_MESSAGES = {:json_encode(app()->lang->get(), 271)};</script>
<script type="text/javascript" src="{__JS__}lang.js?v={__I18N_VERSION__}"></script>
<script type="text/javascript" src="{__JS__}common.js?v={__I18N_VERSION__}"></script>
<script type="text/javascript" src="{__JS__}qq-oauth.js?v=20261004_3"></script>
<script>
layui.use(['layer', 'notice'], function () {
    var $ = layui.jquery;
    var notice = layui.notice;
    var busy = false;
    var $button = $('#qqRegisterButton');
    var registerText = {
        connecting: '{:t("qq_register.connecting")}',
        button: '{:t("qq_register.button")}',
        success: '{:t("qq_register.success")}',
        incomplete: '{:t("qq_register.incomplete")}',
        unavailable: '{:t("qq_register.unavailable")}',
        componentFailed: '{:t("qq_register.component_failed")}'
    };

    function setBusy(value) {
        busy = value;
        $button.prop('disabled', value).html(value
            ? '<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> ' + registerText.connecting
            : '<i class="layui-icon layui-icon-login-qq"></i> ' + registerText.button);
    }

    function handleResult(result) {
        setBusy(false);
        if (result && result.code === 0 && result.data && result.data.status === 'success') {
            notice.msg(result.msg || registerText.success, {icon: 1});
            window.setTimeout(function () {
                window.location.href = result.data.url || '/user.php/Index/index.html';
            }, 350);
            return;
        }
        notice.msg((result && result.msg) || registerText.incomplete, {icon: 2});
    }

    function handleError(message) {
        setBusy(false);
        notice.msg(message || registerText.unavailable, {icon: 2});
    }

    $button.on('click', function () {
        if (busy || !window.SfQqOauth) return;
        setBusy(true);
        SfQqOauth.start({
            url: '/api.php/Social/register',
            data: {},
            onResult: handleResult,
            onError: handleError
        });
    });

    if (window.SfQqOauth) {
        if (SfQqOauth.resume(handleResult, handleError)) setBusy(true);
    } else if ($button.length) {
        $button.prop('disabled', true);
        notice.msg(registerText.componentFailed, {icon: 2});
    }
});
</script>
</body>
</html>
