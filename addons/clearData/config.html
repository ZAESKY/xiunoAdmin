{include file="/public/header"}
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <div class="layui-btn-container">
                <a class="layui-btn layui-icon layui-icon-menu-fill" onclick="clearCache('menu')"> {:t('cache.clear_menu')}</a>
                <a class="layui-btn layui-icon layui-icon-menu-fill" onclick="clearCache('app')"> {:t('cache.clear_app')}</a>
                <a class="layui-btn layui-icon layui-icon-set-fill" onclick="clearCache('set')"> {:t('cache.clear_settings')}</a>
                <a class="layui-btn layui-icon layui-icon-set-fill" onclick="clearCache('version')"> {:t('cache.clear_version')}</a>
                <a class="layui-btn layui-icon layui-icon-refresh" onclick="clearCache('all')"> {:t('cache.clear_all')}</a>
            </div>
        </div>
    </div>
</div>
{include file="/public/footer"}
<script>
    layui.use(['admin','notice'], function () {
        var $ = layui.jquery;
        var admin = layui.admin;
        var notice = layui.notice;

       window.clearCache = function (type){
           notice.msg(window.t('common.loading'), {icon: 4, close: true});
           admin.ajax({
               url: '{:addons_url("ClearData/clearCache")}',
               data: {'type':type},
               headers: {},
               type: 'post',
               dataType: 'json',
               success: function(data){
                   notice.destroy();
                   if (data.code == 0) {
                       notice.msg(data.msg, {icon: 1, audio:'1'});
                   } else {
                       notice.msg(data.msg, {icon: 2, audio:'1'});
                   }
               },
               error: function() {
                   notice.destroy();
                   notice.msg(window.t('cache.plugin_server_error'), {icon: 2, audio:'1'});
               }
           });
        }
    });
</script>
