{include file="/public/header"}
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            <form class="layui-form toolbar">
                {if $userid > 0}
                <input type="hidden" name="userid" value="{$userid}"/>
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <span class="layui-badge layui-badge-blue">{:t('admin_user.viewing_subordinate', ['uid' => $userid])}</span>
                        <a class="layui-btn layui-btn-primary layui-btn-xs" href="{:url('/User/list')}" style="margin-left:8px;">{:t('admin_user.view_all')}</a>
                    </div>
                </div>
                {/if}
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('auth_portal.content')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('admin_user.search_placeholder')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">{:t('common_ui.select_used_status')}</option>
                                <option value="1">{:t('common.show')}</option>
                                <option value="0">{:t('common.hide')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common_ui.power_type')}</label>
                        <div class="layui-input-inline">
                            <select name="power" class="ew-select-fixed">
                                <option value="">{:t('admin_user.all_permissions')}</option>
                                {volist name="power_list" id="res"}
                                <option value="{$res.id}">{$res.name}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common_ui.belong_app')}</label>
                        <div class="layui-input-inline">
                            <select class="layui-input ew-select-fixed" lay-filter="template" lay-search>
                                <option value="">{:t('common_ui.select_all_apps')}</option>
                                {volist name="app_list.data.data" id="res"}
                                <option value="{$res.id}">{$res.name}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                </div>
            </form>
            <!-- 数据表格 -->
            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>
<!-- 表格操作列 -->
<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-primary layui-btn-sm" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>{:t('common.edit')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon layui-icon-delete"></i>{:t('common.delete')}</a>
</script>
<!-- 表格状态列 -->
<script type="text/html" id="SF_TbState">
    <input type="checkbox" lay-filter="SF_TbStateCk" value="{{d.id}}" lay-skin="switch"
           lay-text="{:t('common_ui.show_hide')}" {{d.status==1?'checked':''}} style="display: none;"/>
    <p style="display: none;">{{d.status==0?'{:t("common.normal")}':'{:t("common.ban")}'}}</p>
</script>

<script type="text/html" id="SF_Tbid">
    <span id="SF_span_{{d.id}}">{{d.status==1?'<span class="layui-badge-dot layui-bg-sf-indigo" style="height: 6px;width: 6px;position: relative;top: -2px"></span></span> '+d.id:'<span class="layui-badge-dot layui-bg-red" style="height: 6px;width: 6px;position: relative;top: -2px"></span></span> '+d.id}}
</script>
<!-- 表单弹窗 -->
<script type="text/html" id="SF_EditDialog">
    <form id="SF_EditForm" lay-filter="SF_EditForm" class="layui-form model-form">
        <input name="id" type="hidden"/>
        <input name="form_mode" type="hidden" value=""/>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">{:t('common_ui.belong_app_label')}</label>
            <div class="layui-input-block">
                <select name="appid" class="layui-input ew-select-fixed" lay-search lay-filter="appid">
                    <option value="">{:t('admin_user.select_app')}</option>
                    {volist name="app_list.data.data" id="res"}
                    <option value="{$res.id}">{$res.name}</option>
                    {/volist}
                </select>
            </div>
        </div>
        <div id="form_data" style="display: none">
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('common_ui.power_label')}</label>
                <div class="layui-input-block">
                    <select id="power" name="power" class="layui-input ew-select-fixed" lay-search>
                        <option value="">{:t('common.please_select')} {:t('common_ui.power_type')}</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('common_ui.username_field')}</label>
                <div class="layui-input-block">
                    <input type="text" name="username" placeholder="{:t('common_ui.username_placeholder')}" class="layui-input"
                           lay-verType="tips" lay-verify="required"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('common_ui.password_field')}</label>
                <div class="layui-input-block">
                    <input type="text" name="password" placeholder="{:t('admin_user.password_keep_placeholder')}" class="layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">QQ:</label>
                <div class="layui-input-block">
                    <input type="number" name="qq" placeholder="{:t('common_ui.qq_placeholder')}" class="layui-input"
                           lay-verType="tips" lay-verify="required"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">{:t('common_ui.email_field')}</label>
                <div class="layui-input-block">
                    <input type="text" name="email" placeholder="{:t('common_ui.email_placeholder')}" class="layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">{:t('admin_user.phone')}:</label>
                <div class="layui-input-block">
                    <input type="text" name="phone" placeholder="{:t('admin_user.phone_placeholder')}" class="layui-input"
                           maxlength="11" inputmode="numeric" autocomplete="off" lay-verType="tips"/>
                    <div class="sf-form-help">{:t('admin_user.phone_help')}</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">{:t('admin_user.verification_status')}:</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="phone_verified" value="1" lay-skin="switch" lay-text="{:t('admin_user.verified_unverified')}"/>
                    <div class="sf-form-help">{:t('admin_user.verify_help')}</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">{:t('common_ui.balance_field')}</label>
                <div class="layui-input-block">
                    <input type="number" name="balance" placeholder="{:t('admin_user.balance_placeholder')}" class="layui-input"
                           lay-verType="tips" step="0.01" min="0" max="999999"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">{:t('common_ui.integral_field')}</label>
                <div class="layui-input-block">
                    <input type="number" name="integral" placeholder="{:t('admin_user.points_placeholder')}" class="layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">{:t('admin_user.login_ip')}:</label>
                <div class="layui-input-block">
                    <textarea name="ip" class="layui-textarea" style="height:100px" placeholder="{:t('common_ui.ip_placeholder_hint')}" ></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('common.status')}:</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="status" value="1" lay-skin="switch" checked/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('admin_user.parent_id')}:</label>
                <div class="layui-input-block">
                    <select id="userList" name="userid" class="layui-input ew-select-fixed" lay-search>
                        <option value="">{:t('admin_user.select_parent')}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="SF_EditSubmit" lay-submit>{:t('common.save')}</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">{:t('common.cancel')}</button>
        </div>
    </form>
</script>

{include file="/public/footer"}
<script>
    layui.use(['layer', 'form', 'table', 'util', 'admin', 'notice'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var util = layui.util;
        var admin = layui.admin;
        var notice = layui.notice;
        var selectedUserId = parseInt('{$userid}', 10) || 0;
        var initialWhere = {};
        if (selectedUserId > 0) initialWhere.userid = selectedUserId;

        /* 渲染表格 */
        var insTb = table.render({
            elem: '#SF_Table',
            url: '{:url("/User/list")}',
            method: 'post',
            where: initialWhere,
            page: true,
            skin: 'line',
            size: 'lg',
            toolbar: ['<p>',
                '<button lay-event="add" class="layui-btn layui-btn-sm icon-btn"><i class="layui-icon">&#xe654;</i>{:t("common.add")}</button>&nbsp;',
                '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>{:t("common.delete")}</button>',
                '</p>'].join(''),
            cellMinWidth: 100,
            request: {
                pageName: 'current_page' //页码的参数名称，默认：page
                ,limitName: 'limit' //每页数据量的参数名，默认：limit
            },
            parseData: function(res){ //res 即为原始返回的数据
                return {
                    "code": res.code, //解析接口状态
                    "msg": res.msg, //解析提示文本
                    "count": res.data.data.total, //解析数据长度
                    "data": res.data.data.data //解析数据列表
                };
            },
            cols: [[
                {type: 'checkbox', fixed: true},
                {field: 'id', title: 'ID', templet: '#SF_Tbid', sort: true, width: 80, fixed: true},
                {field: 'img', title: '{:t("common_ui.avatar_field")}', templet: function (d) {
                        var url = d.imgUrl || '//q4.qlogo.cn/headimg_dl?dst_uin='+d.qq+'&spec=100';
                        return '<img data-index="' + (d.LAY_INDEX - 1) + '" src="' + url + '" class="tb-img-circle" tb-img alt=""/>';
                    }, width: 70, unresize: true},
                {field: 'appName', title: '{:t("common_ui.belong_app")}', sort: true, minWidth: 120, templet: function (d) {
                        return '<span class="layui-badge layui-badge-orange">'+d.appName+'</span>';
                    }},
                {field: 'username', title: '{:t("password.username")}', sort: true, minWidth: 150},
                {field: 'powerName', title: '{:t("common_ui.power_type")}', align: 'right', sort: true, minWidth: 130, templet: function (d) {
                        return '<span class="layui-badge layui-badge-'+d.powerSpan+'">'+d.powerName+'</span>';
                    }},
                {field: 'qq', title: 'QQ', align: 'right', sort: true, minWidth: 108},
                {field: 'email', title: '{:t("registration.email")}', align: 'right', sort: true, minWidth: 170},
                {field: 'phone', title: '{:t("admin_user.phone")}', align: 'center', minWidth: 155, templet: function (d) {
                        var phone = String(d.phone || '').replace(/[^0-9]/g, '');
                        if (!phone) return '<span style="color:#b2b2b2">{:t("profile.unbound")}</span>';
                        return phone + (parseInt(d.phone_verified, 10) === 1
                            ? ' <span class="layui-badge layui-badge-green">{:t("admin_user.verified")}</span>'
                            : ' <span class="layui-badge layui-badge-gray">{:t("admin_user.unverified")}</span>');
                    }},
                {field: 'balance', title: '{:t("common_ui.property_field")}', align: 'right', templet: function (d) {
                        return '<span class="layui-badge layui-badge-green">{:t("accounting.balance")}：'+d.balance+'</span> <span class="layui-badge layui-badge-yellow">{:t("accounting.point_unit")}：'+d.integral+'</span>';
                    }, sort: true, minWidth: 171},

                {field: 'ip', title: 'IP', align: 'right', sort: true, minWidth: 140},
                {field: 'userid', title: '{:t("admin_user.parent_id")}', align: 'right', sort: true, templet: function (d) {
                        if(d.userid == 0){
                            return '<span class="layui-badge layui-badge-green">{:t("admin_user.site_owner")}</span>';
                        }else{
                            return '<span class="layui-badge layui-badge-blue">UID:'+d.userid+'</span>';
                        }
                    }, minWidth: 110},
                {field: 'authCount', title: '{:t("admin_user.auth_count")}', align: 'center', width: 90, sort: true, templet: function(d){
                    return d.authCount > 0
                        ? '<a class="layui-badge layui-badge-blue" style="cursor:pointer" lay-event="viewAuth">'+d.authCount+'</a>'
                        : '<span class="layui-badge layui-badge-gray">0</span>';
                }},
                {field: 'cdkeyCount', title: '{:t("admin_user.cdkey_count")}', align: 'center', width: 90, sort: true, templet: function(d){
                    return d.cdkeyCount > 0
                        ? '<a class="layui-badge layui-badge-orange" style="cursor:pointer" lay-event="viewCdkey">'+d.cdkeyCount+'</a>'
                        : '<span class="layui-badge layui-badge-gray">0</span>';
                }},
                {field: 'userCount', title: '{:t("admin_user.subordinate_count")}', align: 'center', width: 90, sort: true, templet: function(d){
                    return d.userCount > 0
                        ? '<a class="layui-badge layui-badge-green" style="cursor:pointer" lay-event="viewSubUser">'+d.userCount+'</a>'
                        : '<span class="layui-badge layui-badge-gray">0</span>';
                }},
                {field: 'balanceLog', title: '{:t("admin_user.account_activity")}', align: 'center', width: 80, templet: function(d){
                    return '<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="viewBalanceLog">{:t("admin_user.activity_details")}</a>';
                }},
                {field: 'pointLog', title: '{:t("admin_user.points_activity")}', align: 'center', width: 100, templet: function(d){
                    return '<a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="viewPointLog">{:t("admin_user.activity_details")}</a>';
                }},
                {field: 'addtime', title: '{:t("common.add_time")}', sort: true, minWidth: 200},
                {field: 'status', title: '{:t("common.status")}', templet: '#SF_TbState', sort: true, minWidth: 100},
                {title: '{:t("common.operation")}', toolbar: '#SF_TbBar', align: 'center', minWidth: 180}
            ]]
        });
        $(document).off('click.tbImg').on('click.tbImg', '[tb-img]', function () {
            var imgList = table.cache['SF_Table'].map(function (d) {
                return {
                    alt: d.username,
                    src: d.imgUrl || '//q4.qlogo.cn/headimg_dl?dst_uin='+d.qq+'&spec=100'
                }
            });
            layer.photos({photos: {data: imgList, start: $(this).data('index')}, shade: .1, closeBtn: true});
        });
        form.on('select(appid)', function (data) {
            if (data.value == "") {
                $("#form_data").css("display","none");
            }else{
                notice.msg('{:t("common.loading_list")}', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url: '{:url("/User/getPowerList")}',
                    data: {"appid":data.value},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                            var content = '<option value="">{:t("common.please_select")} {:t("common_ui.power_type")}</option>';
                            $.each(data.data.data, function(index, value) {
                                content +='<option value="'+value.id+'">'+value.name+'</option>';
                            });
                            $("#power").html(content);
                        } else {
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                        form.render();
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                    }
                });
                notice.msg('{:t("common.loading_list")}', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url: '{:url("/User/getAppUserList")}',
                    data: {"appid":data.value},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                            var content = '<option value="">{:t("admin_user.select_parent")}</option><option value="0">{:t("admin_user.site_owner")}</option>';
                            $.each(data.data.data, function(index, value) {
                                content +='<option value="'+value.id+'">ID:'+value.id+' '+value.username+'</option>';
                            });
                            $("#userList").html(content);
                        } else {
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                        form.render();
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                    }
                });
                $("#form_data").css("display","inherit");
            }
        });
        /* 表格搜索 */
        form.on('submit(SF_TbSearch)', function (data) {
            insTb.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        form.on('select(template)', function (data) {
            var where = {appid:data.value};
            if (selectedUserId > 0) where.userid = selectedUserId;
            insTb.reload({where: where, page: {curr: 1}});
            return false;
        });
        {if $appid != ''}
        initialWhere.appid = {$appid};
        insTb.reload({where: initialWhere, page: {curr: 1}});
        {/if}
            /* 表格工具条点击事件 */
            table.on('tool(SF_Table)', function (obj) {
                if (obj.event === 'edit') { // 修改
                    showEditModel(obj.data);
                } else if (obj.event === 'del') { // 删除
                    doDel(obj);
                } else if (obj.event === 'viewAuth') {
                    window.open('{:url("/Auth/list")}?userid='+obj.data.id);
                } else if (obj.event === 'viewCdkey') {
                    window.open('{:url("/Cdkey/list")}?userid='+obj.data.id);
                } else if (obj.event === 'viewSubUser') {
                    window.open('{:url("/User/list")}?userid='+obj.data.id);
                } else if (obj.event === 'viewBalanceLog') {
                    showBalanceLog(obj.data);
                } else if (obj.event === 'viewPointLog') {
                    showPointLog(obj.data);
                }
            });

            /* 表格头工具栏点击事件 */
            table.on('toolbar(SF_Table)', function (obj) {
                if (obj.event === 'add') { // 添加
                    showEditModel();
                } else if (obj.event === 'del') { // 删除
                    var checkRows = table.checkStatus('SF_Table');
                    if (checkRows.data.length === 0) {
                        notice.msg('{:t("confirm.please_select_data")}', {icon: 3, audio:'1'});
                        return;
                    }
                    var ids = checkRows.data.map(function (d) {
                        return d.id;
                    });
                    doDel({ids: ids});
                }
            });

            /* 显示表单弹窗 */
            function showEditModel(mData) {
                admin.popupRight({
                    type: 1,
                    title: (mData ? '{:t("common.edit")}' : '{:t("common.add")}') + ' {:t("admin_user.user_suffix")}',
                    content: $('#SF_EditDialog').html(),
                    success: function (layero, dIndex) {
                        // 设置表单模式
                        $('input[name="form_mode"]').val(mData ? 'edit' : 'add');
                        // 回显表单数据
                        if(mData){
                            $("#form_data").css("display", "inherit");
                            notice.msg('{:t("common.loading_list")}', {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: '{:url("/User/getPowerList")}',
                                data: {"appid":mData.appid},
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        notice.msg(data.msg, {icon: 1, audio:'1'});
                                        var content = '<option value="">{:t("common.please_select")} {:t("common_ui.power_type")}</option>';
                                        $.each(data.data.data, function(index, value) {
                                            content +='<option value="'+value.id+'">'+value.name+'</option>';
                                        });
                                        $("#power").html(content);
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                    form.render();
                                    form.val('SF_EditForm', mData);
                                    $(layero).find('input[name="phone_verified"]')
                                        .prop('checked', parseInt(mData.phone_verified, 10) === 1);
                                    form.render('checkbox');
                                },
                                error: function() {
                                    notice.destroy();
                                    notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                                }
                            });

                            notice.msg('{:t("common.loading_list")}', {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: '{:url("/User/getAppUserList")}',
                                data: {"appid":mData.appid},
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        notice.msg(data.msg, {icon: 1, audio:'1'});
                                        var content = '<option value="">{:t("admin_user.select_parent")}</option><option value="0">{:t("admin_user.site_owner")}</option>';
                                        $.each(data.data.data, function(index, value) {
                                            content +='<option value="'+value.id+'">ID:'+value.id+' '+value.username+'</option>';
                                        });
                                        $("#userList").html(content);
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                    form.render();
                                    form.val('SF_EditForm', mData);
                                    $(layero).find('input[name="phone_verified"]')
                                        .prop('checked', parseInt(mData.phone_verified, 10) === 1);
                                    form.render('checkbox');
                                },
                                error: function() {
                                    notice.destroy();
                                    notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                                }
                            });
                        }else{
                            form.render();
                            $("#form_data").css("display","none");
                        }
                        // 表单提交事件
                        form.on('submit(SF_EditSubmit)', function (data) {
                            var phone = $.trim(data.field.phone || '');
                            if (phone && !/^1[3-9][0-9]{9}$/.test(phone)) {
                                notice.msg('{:t("admin_user.invalid_phone")}', {icon: 2});
                                return false;
                            }
                            if (data.field.phone_verified && !phone) {
                                notice.msg('{:t("admin_user.phone_required_for_verified")}', {icon: 2});
                                return false;
                            }
                            notice.msg('{:t("common.loading")}', {icon: 4, close: true});
                            $.ajax({
                                type: "POST",
                                url: '{:url("/User/edit")}',
                                data: data.field,
                                dataType: "json",
                                success: function(data) {
                                    notice.destroy();
                                    if (data.code == 0) {
                                        table.reload('SF_Table');
                                        notice.msg(data.msg, {icon: 1, audio:'1'});
                                    } else {
                                        notice.msg(data.msg, {icon: 2, audio:'1'});
                                    }
                                },
                                error: function() {
                                    notice.destroy();
                                    notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                                }
                            });
                            return false;
                        });
                        // 禁止弹窗出现滚动条
                        $(layero).children('.layui-layer-content').css('overflow', 'visible');
                    }
                });
            }

            /* 查看动账明细 */
            function showBalanceLog(mData){
                admin.popupRight({
                    type: 1,
                    title: mData.username + ' - {:t("accounting.balance_detail")}',
                    content: '<table id="SF_BalanceLogTable" lay-filter="SF_BalanceLogTable"></table>',
                    area: ['800px', '600px'],
                    success: function(layero, dIndex){
                        table.render({
                            elem: '#SF_BalanceLogTable',
                            url: '{:url("/User/balanceLog")}',
                            method: 'post',
                            where: {user_id: mData.id},
                            page: true, limit: 12,
                            request: {pageName: 'current_page', limitName: 'limit'},
                            parseData: function(res){
                                return {code: res.code, msg: res.msg, count: res.data.data.total || 0, data: res.data.data.data || []};
                            },
                            cols: [[
                                {field: 'type_label', title: '{:t("accounting.type")}', width: 130, templet: function(d){
                                    return '<span class="layui-badge '+(d.amount>0?'layui-badge-green':'layui-badge-blue')+'">'+d.type_label+'</span>';
                                }},
                                {field: 'amount', title: '{:t("accounting.amount")}', width: 130, templet: function(d){
                                    return d.amount > 0 ? '<span class="text-success">+'+d.amount+' {:t("accounting.currency_unit")}</span>' : '<span class="text-danger">'+d.amount+' {:t("accounting.currency_unit")}</span>';
                                }},
                                {field: 'balance', title: '{:t("accounting.balance")}', width: 130, templet: function(d){ return (d.balance||'0.00')+' {:t("accounting.currency_unit")}'; }},
                                {field: 'description', title: '{:t("accounting.description")}', minWidth: 180},
                                {field: 'created_at', title: '{:t("accounting.time")}', width: 170}
                            ]]
                        });
                    }
                });
            }

            /* 查看积分动账明细 */
            function showPointLog(mData){
                admin.popupRight({

                    content: '<table id="SF_PointLogTable" lay-filter="SF_PointLogTable"></table>',

                    success: function(layero, dIndex){
                        table.render({
                            elem: '#SF_PointLogTable',
                            url: '{:url("/User/pointLog")}',
                            method: 'post',
                            where: {user_id: mData.id},
                            page: true, limit: 12,
                            request: {pageName: 'current_page', limitName: 'limit'},
                            parseData: function(res){
                                return {code: res.code, msg: res.msg, count: res.data.data.total || 0, data: res.data.data.data || []};
                            },
                            cols: [[
                                {field: 'type_label', title: '{:t("accounting.type")}', width: 130, templet: function(d){
                                    return '<span class="layui-badge '+(d.amount>0?'layui-badge-green':'layui-badge-blue')+'">'+d.type_label+'</span>';
                                }},
                                {field: 'amount', title: '{:t("accounting.point_change")}', width: 140, templet: function(d){
                                    return d.amount > 0 ? '<span class="text-success">+'+d.amount+'</span>' : '<span class="text-danger">'+d.amount+'</span>';
                                }},
                                {field: 'integral_after', title: '{:t("accounting.remaining_points")}', width: 150, templet: function(d){ return (d.integral_after||0)+' {:t("accounting.point_unit")}'; }},
                                {field: 'description', title: '{:t("accounting.description")}', minWidth: 180},
                                {field: 'source_type', title: '{:t("accounting.source")}', width: 120},
                                {field: 'created_at', title: '{:t("accounting.time")}', width: 170}

            /* 删除 */
            function doDel(obj) {
                layer.confirm('{:t("confirm.delete_selected")}', {
                    skin: 'layui-layer-admin',
                    icon: 3,
                    shade: .1
                }, function (i) {
                    layer.close(i);
                    notice.msg('{:t("common.loading")}', {icon: 4, close: true});
                    $.ajax({
                        type: "POST",
                        url: obj.data ? '{:url("/User/drop")}' : '{:url("/User/batchDrop")}',
                        data: {id: obj.data ? obj.data.id : obj.ids.join(',')},
                        dataType: "json",
                        success: function(data) {
                            notice.destroy();
                            if (data.code == 0) {
                                insTb.reload({page: {curr: 1}});
                                notice.msg(data.msg, {icon: 1, audio:'1'});
                            }else{
                                notice.msg(data.msg, {icon: 2, audio:'1'});
                            }
                        },
                        error: function() {
                            notice.destroy();
                            notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                        }
                    });
                });
            }

            /* 修改用户状态 */
            form.on('switch(SF_TbStateCk)', function (obj) {
                notice.msg('{:t("common.loading")}', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url:'{:url("/User/setStatus")}',
                    data: {id:obj.value,status:obj.elem.checked ? 1 : 0},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            insTb.reload({page: {curr: 1}});
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                        }else{
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                    }
                });
            });
        });
</script>
