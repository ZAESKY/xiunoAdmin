{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">{:t('set_ui.carousel_management')}</div>
        <div class="layui-card-body">
            <div class="layui-btn-container" style="margin-bottom:12px;">
                <button class="layui-btn layui-btn-sm icon-btn" id="carouselAdd"><i class="layui-icon">&#xe654;</i>{:t('set_ui.add_carousel')}</button>
            </div>
            <table id="carouselTable" lay-filter="carouselTable"></table>
        </div>
    </div>
</div>

<script type="text/html" id="carouselBar">
    <a class="layui-btn layui-btn-primary layui-btn-sm" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>{:t('common.edit')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon layui-icon-delete"></i>{:t('common.delete')}</a>
</script>
<script type="text/html" id="carouselState">
    <input type="checkbox" lay-filter="carouselStateCk" value="{{d.id}}" lay-skin="switch" lay-text="{:t('common_ui.show_hide')}" {{d.status==1?'checked':''}}>
</script>
<script type="text/html" id="carouselDialog">
    <form id="carouselForm" lay-filter="carouselForm" class="layui-form model-form">
        <input name="id" type="hidden"/><input name="action" type="hidden" value="edit"/>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">{:t('feedback.title')}</label>
            <div class="layui-input-block"><input type="text" name="title" placeholder="{:t('set_ui.carousel_title')}" class="layui-input" lay-verType="tips" lay-verify="required"/></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">{:t('set_ui.image')}</label>
            <div class="layui-input-block">
                <input type="text" name="image" id="carouselImageInput" placeholder="{:t('set_ui.upload_image_placeholder')}" class="layui-input" lay-verType="tips" lay-verify="required"/>
                <button type="button" class="layui-btn layui-btn-normal" id="carouselUploadBtn" style="margin-top:8px;"><i class="layui-icon layui-icon-upload"></i> {:t('set_ui.upload_image')}</button>
                <div id="carouselImgPreview" style="margin-top:8px;display:none;"><img src="" style="max-width:260px;border-radius:6px;border:1px solid #eee;"></div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:t('set_ui.target_url')}</label>
            <div class="layui-input-block"><input type="text" name="url" placeholder="{:t('set_ui.target_url_hint')}" class="layui-input"/></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:t('plugin_ui.sort')}</label>
            <div class="layui-input-block"><input type="number" name="sort" value="0" placeholder="{:t('set_ui.sort_hint')}" class="layui-input" style="width:120px;"/></div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="carouselSubmit" lay-submit>{:t('common.save')}</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">{:t('common.cancel')}</button>
        </div>
    </form>
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'admin', 'notice', 'upload'], function () {
    var $ = layui.jquery, form = layui.form, table = layui.table, admin = layui.admin, notice = layui.notice, upload = layui.upload;
    var insTb = table.render({
        elem: '#carouselTable', url: '{:url("/Set/carousel")}', method: 'post', page: false, skin: 'line', size: 'lg',
        parseData: function(res) { return { code: res.code, msg: res.msg, count: res.count, data: res.data }; },
        cols: [[
            {field: 'id', title: 'ID', width: 60},
            {field: 'image', title: '{:t("set_ui.image")}', width: 100, templet: function(d) { return '<img src="'+d.image+'" style="width:60px;height:40px;object-fit:cover;border-radius:4px;" onerror="this.style.display=\'none\'">'; }},
            {field: 'title', title: '{:t("feedback.title")}', minWidth: 140},
            {field: 'url', title: '{:t("set_ui.target_url")}', minWidth: 180, templet: function(d) { return d.url ? '<span style="color:#3a6fd8;">'+d.url+'</span>' : '<span style="color:#bbb;">-</span>'; }},
            {field: 'sort', title: '{:t("plugin_ui.sort")}', width: 70},
            {field: 'status', title: '{:t("common.status")}', templet: '#carouselState', width: 90},
            {title: '{:t("common.operation")}', toolbar: '#carouselBar', width: 160}
        ]]
    });
    function reloadTb() { insTb.reload(); }
    $('#carouselAdd').click(function(){ showEdit(); });
    table.on('tool(carouselTable)', function(obj) {
        if (obj.event === 'edit') showEdit(obj.data);
        else if (obj.event === 'del') {
            layer.confirm('{:t("set_ui.carousel_delete_confirm")}', {icon:3, shade:.1}, function(i) {
                layer.close(i); notice.msg('{:t("set_ui.deleting")}', {icon:4, close:true});
                $.ajax({ type:'POST', url:'{:url("/Set/carousel")}', data:{action:'drop', id:obj.data.id}, dataType:'json',
                    success:function(r){ notice.destroy(); reloadTb(); notice.msg(r.msg, {icon: r.code==0?1:2}); } });
            });
        }
    });
    form.on('switch(carouselStateCk)', function(obj) {
        $.ajax({ type:'POST', url:'{:url("/Set/carousel")}', data:{action:'setStatus', id:obj.value, status:obj.elem.checked?1:0}, dataType:'json',
            success:function(r){ reloadTb(); notice.msg(r.msg, {icon: r.code==0?1:2}); } });
    });
    function showEdit(mData) {
        admin.open({ type: 1, area: ['600px', '420px'], title: mData?'{:t("set_ui.edit_carousel")}':'{:t("set_ui.add_carousel")}', content: $('#carouselDialog').html(),
            success: function(layero, dIndex) {
                form.render();
                if (mData) { form.val('carouselForm', mData); if (mData.image) { $('#carouselImgPreview').show().find('img').attr('src', mData.image); } }
                upload.render({ elem: '#carouselUploadBtn', url: '{:url("/Upload/image")}', before: function() { notice.msg('{:t("app_ui.uploading")}', {icon:4, close:true}); },
                    done: function(res) { notice.destroy(); if (res.code == 0) { $('#carouselImageInput').val(res.data.path); $('#carouselImgPreview').show().find('img').attr('src', res.data.path); notice.msg('{:t("version_ui.upload_success")}', {icon:1}); } else { notice.msg(res.msg||'{:t("common.upload_failed")}', {icon:2}); } } });
                $('#carouselImageInput').on('input', function() { var v = $(this).val(); v ? $('#carouselImgPreview').show().find('img').attr('src', v) : $('#carouselImgPreview').hide(); });
                form.on('submit(carouselSubmit)', function(data) {
                    notice.msg('{:t("set_ui.saving")}', {icon:4, close:true});
                    $.ajax({ type:'POST', url:'{:url("/Set/carousel")}', data: data.field, dataType:'json',
                        success: function(r) { notice.destroy(); if (r.code == 0) { reloadTb(); admin.closeDialog(dIndex); notice.msg(r.msg, {icon:1}); } else { notice.msg(r.msg, {icon:2}); } } });
                    return false;
                });
                $(layero).children('.layui-layer-content').css('overflow', 'visible');
            }
        });
    }
});
</script>
