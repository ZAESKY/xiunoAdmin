<div class="layui-card sf-message-card">
    <div class="layui-tab layui-tab-brief">
        <ul class="layui-tab-title">
            <li class="layui-this"><span data-i18n="feedback.notifications"></span> (<span id="SF_NotifyCount">0</span>)</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <div class="message-list" id="SF_NotifyList"></div>
                <div class="message-list-empty" id="SF_NotifyEmpty">
                    <i class="layui-icon layui-icon-notice"></i>
                    <div data-i18n="feedback.no_notifications"></div>
                </div>
                <a id="messageClearBtn1" class="message-btn-clear" onclick="SF_Notification.markAllRead()" data-i18n="feedback.mark_all_read"></a>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    var parentDoc = window.parent && window.parent.document ? window.parent.document : document;
    var roleEl = parentDoc.querySelector('[data-role]');
    var role = roleEl ? roleEl.getAttribute('data-role') : 'user';
    var appPrefix = role === 'admin' ? '/admin.php' : '/user.php';
    var translate = (window.parent && window.parent.t) ? window.parent.t : (window.t || function(key){ return key; });

    function t(key, vars) {
        return translate(key, vars);
    }

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatContent(value) {
        return escapeHtml(value).replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
    }

    function request(url, body, done) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', appPrefix + url, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onload = function() {
            var res = null;
            try {
                res = JSON.parse(xhr.responseText || '{}');
            } catch(e) {}
            done(res || {code: -1, data: {}});
        };
        xhr.onerror = function() {
            done({code: -1, data: {}});
        };
        xhr.send(body || '');
    }

    function setBadge(count) {
        var dots = parentDoc.querySelectorAll('.sf-notify-badge');
        dots.forEach(function(dot) {
            dot.textContent = count > 0 ? (count > 99 ? '99+' : count) : '';
            dot.style.display = count > 0 ? 'inline-block' : 'none';
        });
    }

    function getTargetByType(type) {
        var url = appPrefix + '/Feedback/index.html';
        var title = t('feedback.submit_title');
        var typeRouteMap = {
            'plugin_new':      { admin: '/Plugin/list.html',        adminTitle: 'menu.plugin_list',     user: '/UserPlugin/market.html',   userTitle: 'menu.plugin_market' },
            'plugin_audit':    { admin: '/Plugin/list.html',        adminTitle: 'menu.plugin_list',     user: '/UserPlugin/list.html',     userTitle: 'menu.my_plugin' },
            'plugin_comment':  { admin: '/PluginComment/list.html', adminTitle: 'menu.plugin_comments', user: '/UserPlugin/comments.html', userTitle: 'menu.plugin_comments' },
            'plugin_purchase': { admin: '/PluginOrder/list.html',   adminTitle: 'menu.plugin_order',    user: '/UserPlugin/list.html',     userTitle: 'menu.my_plugin' },
            'comment_audit':   { admin: '/PluginComment/list.html', adminTitle: 'menu.plugin_comments', user: '/UserPlugin/comments.html', userTitle: 'menu.plugin_comments' },
            'comment_reply':   { admin: '/PluginComment/list.html', adminTitle: 'menu.plugin_comments', user: '/UserPlugin/comments.html', userTitle: 'menu.plugin_comments' },
            'feedback_new':    { admin: '/Feedback/list.html',      adminTitle: 'admin_home.feedback_management', user: '/Feedback/index.html', userTitle: 'feedback.submit_title' },
            'feedback_handled':{ admin: '/Feedback/list.html',      adminTitle: 'admin_home.feedback_management', user: '/Feedback/index.html', userTitle: 'feedback.submit_title' },
            'rebate':          { admin: '/Feedback/list.html',      adminTitle: 'admin_home.feedback_management', user: '/Feedback/index.html', userTitle: 'feedback.submit_title' }
        };
        var route = typeRouteMap[type];
        if (route) {
            if (role === 'admin') {
                url = appPrefix + (route.admin || '/Feedback/list.html');
                title = t(route.adminTitle || 'admin_home.feedback_management');
            } else {
                url = appPrefix + (route.user || '/Feedback/index.html');
                title = t(route.userTitle || 'feedback.submit_title');
            }
        }
        return { url: url, title: title };
    }

    function closeMessagePanel() {
        var layerBox = parentDoc.querySelector('.layui-layer-adminRight');
        var parentLayer = window.parent && window.parent.layui ? window.parent.layui.layer : null;
        if (layerBox && parentLayer) {
            var layerIndex = parseInt(layerBox.id.replace('layui-layer', ''), 10);
            if (!isNaN(layerIndex)) {
                parentLayer.close(layerIndex);
            }
        }
    }

    function getFeedbackTarget() {
        if (role === 'admin') {
            return {
                url: appPrefix + '/Feedback/list.html',
                title: t('admin_home.feedback_management')
            };
        }
        return {
            url: appPrefix + '/Feedback/index.html',
            title: t('feedback.submit_title')
        };
    }

    function openFeedbackPage(link, type) {
        var parentWin = window.parent || window;
        var target;
        if (link) {
            var url = link.indexOf('/') === 0 ? appPrefix + link : link;
            var titleMap = {
                'Plugin/list': 'menu.plugin_list',
                'PluginComment/list': 'menu.plugin_comments',
                'UserPlugin/market': 'menu.plugin_market',
                'UserPlugin/detail': 'home.plugin_details',
                'UserPlugin/comments': 'menu.plugin_comments',
                'UserPlugin/list': 'menu.my_plugin',
                'Feedback/index': 'feedback.submit_title',
                'Feedback/list': 'admin_home.feedback_management'
            };
            var title = t('feedback.notifications');
            for (var key in titleMap) {
                if (url.indexOf(key) !== -1) { title = t(titleMap[key]); break; }
            }
            target = { url: url, title: title };
        } else if (type) {
            target = getTargetByType(type);
        } else {
            target = getFeedbackTarget();
        }
        if (parentWin.layui && parentWin.layui.index && parentWin.layui.index.openTab) {
            parentWin.layui.index.openTab({
                title: target.title,
                url: target.url
            });
            setTimeout(function() {
                if (parentWin.layui.admin && parentWin.layui.admin.refresh) {
                    parentWin.layui.admin.refresh(target.url, true);
                }
            }, 350);
        } else {
            parentWin.location.href = target.url;
        }
        closeMessagePanel();
    }

    document.querySelectorAll('[data-i18n]').forEach(function(node) {
        node.textContent = t(node.getAttribute('data-i18n'));
    });

    window.SF_Notification = {
        loadList: function() {
            var listEl = document.getElementById('SF_NotifyList');
            var emptyEl = document.getElementById('SF_NotifyEmpty');
            var countEl = document.getElementById('SF_NotifyCount');

            request('/Feedback/notificationList.html', '', function(res) {
                var items = (res.code === 0 && res.data && Array.isArray(res.data.data)) ? res.data.data : [];
                if (items.length > 0) {
                    var html = '';
                    items.forEach(function(item) {
                        var link = item.link || '';
                        var type = item.type || '';
                        html += '<a class="message-list-item" href="javascript:;" data-id="' + encodeURIComponent(item.id) + '" data-link="' + escapeHtml(link) + '" data-type="' + escapeHtml(type) + '" onclick="SF_Notification.markRead(' + parseInt(item.id, 10) + ', true, this.getAttribute(\'data-link\'), this.getAttribute(\'data-type\'))">';
                        var iconClass = 'layui-icon-speaker';
                        var iconColor = '#2d8cf0';
                        switch(item.type) {
                            case 'plugin_audit': iconClass = 'layui-icon-template'; iconColor = '#ff9800'; break;
                            case 'plugin_new': iconClass = 'layui-icon-addition'; iconColor = '#5fb878'; break;
                            case 'plugin_comment': iconClass = 'layui-icon-dialogue'; iconColor = '#1890ff'; break;
                            case 'plugin_purchase': iconClass = 'layui-icon-diamond'; iconColor = '#ff5722'; break;
                            case 'comment_audit': iconClass = 'layui-icon-dialogue'; iconColor = '#ff9800'; break;
                            case 'comment_reply': iconClass = 'layui-icon-reply-fill'; iconColor = '#7c4dff'; break;
                            case 'feedback_new': case 'feedback_handled': iconClass = 'layui-icon-flag'; iconColor = '#2d8cf0'; break;
                        }
                        html += '<i class="layui-icon ' + iconClass + ' message-item-icon" style="background-color:' + iconColor + ';"></i>';
                        html += '<div class="message-item-right">';
                        html += '<h2 class="message-item-title">' + escapeHtml(item.title) + '</h2>';
                        html += '<p class="message-item-text message-item-content">' + formatContent(item.content) + '</p>';
                        html += '<p class="message-item-time">' + escapeHtml(item.created_at) + '</p>';
                        html += '</div></a>';
                    });
                    listEl.innerHTML = html;
                    listEl.style.display = '';
                    emptyEl.style.display = 'none';
                } else {
                    listEl.innerHTML = '';
                    listEl.style.display = 'none';
                    emptyEl.style.display = '';
                }
                countEl.textContent = items.length;
            });
        },
        markRead: function(id, openAfterRead, link, type) {
            request('/Feedback/notificationRead.html', 'id=' + encodeURIComponent(id), function() {
                SF_Notification.loadList();
                SF_Notification.updateBadge();
                if (openAfterRead) {
                    openFeedbackPage(link, type);
                }
            });
        },
        markAllRead: function() {
            request('/Feedback/notificationReadAll.html', '', function() {
                SF_Notification.loadList();
                SF_Notification.updateBadge();
            });
        },
        updateBadge: function() {
            request('/Feedback/notificationCount.html', '', function(res) {
                var count = res.data && res.data.count ? parseInt(res.data.count, 10) : 0;
                setBadge(isNaN(count) ? 0 : count);
            });
        }
    };

    SF_Notification.loadList();
    SF_Notification.updateBadge();
})();
</script>

<style>
    .sf-message-card {
        box-shadow: none;
        border: none;
        height: 100%;
    }
    .sf-message-card .layui-tab-title {
        text-align: center;
    }
    .sf-message-card .layui-tab-content {
        padding: 0;
    }
    .message-list {
        position: absolute;
        top: 48px;
        left: 0;
        right: 0;
        bottom: 45px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    .message-list-item {
        display: block;
        padding: 12px 18px;
        line-height: 22px;
        position: relative;
        border-bottom: 1px solid #e8e8e8;
        text-decoration: none;
        color: inherit;
    }
    .message-list-item:hover, .message-btn-clear:hover {
        background: #f7f8fa;
    }
    .message-list-item .message-item-icon {
        width: 38px;
        height: 38px;
        line-height: 38px;
        margin-top: -19px;
        border-radius: 50%;
        position: absolute;
        left: 18px;
        top: 50%;
    }
    .message-list-item .message-item-icon.layui-icon {
        color: #fff;
        font-size: 20px;
        text-align: center;
        background-color: #2d8cf0;
    }
    .message-list-item .message-item-icon + .message-item-right {
        margin-left: 54px;
    }
    .message-list-item .message-item-title {
        color: #333;
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
    }
    .message-list-item .message-item-text {
        color: #666;
        font-size: 12px;
        margin: 0 0 4px;
        word-break: break-word;
    }
    .message-list-item .message-item-time {
        color: #999;
        font-size: 12px;
        margin: 0;
    }
    .message-btn-clear {
        color: #666;
        display: block;
        padding: 10px 5px;
        line-height: 24px;
        text-align: center;
        cursor: pointer;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        border-top: 1px solid #e8e8e8;
    }
    .message-list-empty {
        color: #999;
        padding: 100px 0;
        text-align: center;
        display: none;
    }
    .message-list-empty > .layui-icon {
        color: #ccc;
        display: block;
        font-size: 45px;
        margin-bottom: 15px;
    }
</style>
