{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('auth_portal.content')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('plugin_ui.search_placeholder')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">{:t('feedback.all_statuses')}</option>
                                <option value="0">{:t('plugin_ui.pending_review')}</option>
                                <option value="1">{:t('user_home.published')}</option>
                                <option value="2">{:t('plugin_ui.off_shelf')}</option>
                                <option value="3">{:t('plugin_ui.review_rejected')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('app_ui.app_name')}</label>
                        <div class="layui-input-inline">
                            <select name="app_id" class="ew-select-fixed" lay-search>
                                <option value="">{:t('app_ui.all_apps')}</option>
                                {volist name="appList" id="app"}
                                <option value="{$app.id}">{$app.name} ({$app.product_id})</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">
                        <button class="layui-btn icon-btn" lay-filter="QH_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common.search')}
                        </button>
                        <button type="button" class="layui-btn layui-btn-normal" onclick="showEditDialog(0)">
                            <i class="layui-icon">&#xe654;</i>{:t('plugin_ui.add_plugin')}
                        </button>
                    </div>
                </div>
            </form>
            <!-- 数据表格 -->
            <table id="QH_Table" lay-filter="QH_Table"></table>
        </div>
    </div>
</div>

<style>
    /* 操作按钮必须保持单行；列宽不足时由表格主体横向滚动。 */
    #QH_Table + .layui-table-view td[data-off="true"] > .layui-table-cell {
        height: 40px;
        overflow: hidden;
        white-space: nowrap;
    }
    .plugin-table-actions {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
    }
</style>

<!-- 表格操作列 -->
<script type="text/html" id="QH_TbBar">
    <div class="plugin-table-actions">
        <a class="layui-btn layui-btn-sm layui-btn-normal" lay-event="edit"><i class="layui-icon">&#xe642;</i>{:t('common_ui.edit')}</a>
        <a class="layui-btn layui-btn-sm layui-btn-primary" lay-event="purchases"><i class="layui-icon layui-icon-rmb"></i>{:t('plugin_ui.purchase')}</a>
        <a class="layui-btn layui-btn-sm layui-btn-primary" lay-event="downloads"><i class="layui-icon layui-icon-download-circle"></i>{:t('wxpay_ui.download')}</a>
        <a class="layui-btn layui-btn-sm layui-btn-warm" lay-event="rewards"><i class="layui-icon layui-icon-gift"></i>{:t('plugin_ui.reward')}</a>
        <a class="layui-btn layui-btn-sm" lay-event="status"><i class="layui-icon">&#xe605;</i>{:t('common.status')}</a>
        <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon">&#xe640;</i>{:t('common.delete')}</a>
    </div>
</script>

<!-- 状态模板 -->
<script type="text/html" id="QH_TbStatus">
    {{# if(d.status == 0){ }}
        <span class="layui-badge layui-badge-orange">{:t('plugin_ui.pending_review')}</span>
    {{# } else if(d.status == 1){ }}

    {{# } else if(d.status == 2){ }}
        <span class="layui-badge layui-badge-gray">{:t('plugin_ui.off_shelf')}</span>
    {{# } else if(d.status == 3){ }}
        <span class="layui-badge layui-badge-red">{:t('plugin_ui.review_rejected')}</span>
    {{# } }}
</script>

<!-- 价格模板 -->
<script type="text/html" id="QH_TbPrice">
    {{# if(d.price == 0){ }}
        <span class="layui-badge layui-badge-green">{:t('upgrade.free')}</span>
    {{# } else if(d.pay_type == 'points') { }}
        <span class="layui-badge layui-badge-orange">{{parseInt(d.price)}} {:t('accounting.point_unit')}</span>
    {{# } else { }}
        <span class="layui-badge layui-badge-orange">¥{{d.price}}</span>

    {{# if(d.publish_type == 1){ }}
        <span class="layui-badge layui-badge-blue">{:t('plugin_ui.publish_scheduled')}</span>

        <span class="layui-badge layui-bg-gray">{:t('plugin_ui.publish_now')}</span>
    {{# } }}

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'notice'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var table = layui.table;
    var notice = layui.notice;
    var rewardConfig = {
        enabled: parseInt('{$pluginRewardConfig.enabled|default=0}', 10) === 1,
        points: parseInt('{$pluginRewardConfig.points|default=0}', 10) || 0,
        balance: '{$pluginRewardConfig.balance|default="0.00"}',
        originalOnly: parseInt('{$pluginRewardConfig.original_only|default=1}', 10) === 1,
        monthlyLimit: parseInt('{$pluginRewardConfig.monthly_limit|default=0}', 10) || 0,
        minAccountDays: parseInt('{$pluginRewardConfig.min_account_days|default=0}', 10) || 0
    };

    function esc(value) {
        return $('<div>').text(value == null ? '' : String(value)).html();
    }

    /* 渲染表格 */
    var insTb = table.render({
        elem: '#QH_Table',
        url: '{:url("/Plugin/list")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        toolbar: ['<p>',
            '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>{:t('plugin_ui.batch_delete')}</button>',
            '</p>'].join(''),
        cellMinWidth: 100,
        request: {
            pageName: 'current_page',
            limitName: 'limit'
        },
        parseData: function(res){
            return {
                "code": res.code,
                "msg": res.msg,
                "count": res.data.data.total,
                "data": res.data.data.data
            };
        },
        cols: [[
            {type: 'checkbox', fixed: true},
            {field: 'id', title: 'ID', sort: true, width: 80, fixed: true},
            {field: 'icon', title: '{:t("plugin_ui.icon")}', width: 80, templet: function(d){
                return '<img src="'+(d.icon || '/Assets/img/default-plugin.png')+'" style="width:50px;height:50px;object-fit:cover;">';
            }},
            {field: 'name', title: '{:t("plugin_ui.name")}', minWidth: 150},
            {field: 'app_name', title: '{:t("app_ui.app_name")}', minWidth: 150},
            {field: 'slug', title: '{:t("plugin_ui.slug")}', minWidth: 120},
            {field: 'version', title: '{:t("version_ui.version_suffix")}', width: 100},
            {field: 'author', title: '{:t("plugin_ui.author")}', width: 120},
            {field: 'origin_type', title: '{:t("accounting.source")}', width: 80, templet: function(d){
                return d.origin_type == 2 ? '<span class="layui-badge layui-badge-orange">{:t('plugin_ui.repost')}</span>' : '<span class="layui-badge layui-badge-green">{:t('plugin_ui.original')}</span>';
            }},
            {field: 'user_id', title: '{:t("plugin_ui.publisher")}', width: 80, templet: function(d){
                return d.user_id == 0 ? '{:t("feedback.admin_role")}' : 'UID:'+d.user_id;
            }},
            {field: 'price', title: '{:t("plugin_ui.price")}', width: 100, templet: '#QH_TbPrice'},
            {field: 'publish_type', title: '{:t("plugin_ui.publish_method")}', width: 105, templet: '#QH_TbPublish'},
            {field: 'publish_time', title: '{:t("plugin_ui.publish_time")}', minWidth: 160, templet: function(d){
                return d.publish_type == 1 ? (d.publish_time || '-') : (d.published_at || '-');
            }},
            {field: 'download_count', title: '{:t("common_ui.download_count")}', width: 100, sort: true},
            {field: 'download_record_count', title: '{:t("plugin_ui.download_records")}', width: 100, templet: function(d){
                return '<a lay-event="downloads" style="color:#2d8cf0;">'+(d.download_record_count || 0)+'</a>';
            }},
            {field: 'purchase_count', title: '{:t("plugin_ui.purchase_records")}', width: 100, templet: function(d){
                return '<a lay-event="purchases" style="color:#2d8cf0;">'+(d.purchase_count || 0)+'</a>';
            }},
            {field: 'rating_avg', title: '{:t("plugin_ui.rating")}', width: 100, sort: true, templet: function(d){
                return d.rating_avg + ' (' + d.rating_count + ' {:t("plugin_ui.people_suffix")})';
            }},
            {field: 'comment_count', title: '{:t("plugin_ui.comment_count")}', width: 100},
            {field: 'status', title: '{:t("common.status")}', width: 100, templet: '#QH_TbStatus'},
            {field: 'reward_status', title: '{:t("plugin_ui.publish_reward")}', minWidth: 150, templet: function(d){
                if (d.reward_status === 'issued') {
                    var parts = [];
                    if (parseInt(d.reward_points, 10) > 0) parts.push(parseInt(d.reward_points, 10) + '{:t("accounting.point_unit")}');
                    if (parseFloat(d.reward_balance) > 0) parts.push('¥' + d.reward_balance);
                    return '<span class="layui-badge layui-badge-green">{:t('plugin_ui.reward_issued')}</span> ' + esc(parts.join(' + '));
                }
                if (d.reward_status === 'skipped') {
                    return '<span class="layui-badge layui-badge-gray" title="'+esc(d.reward_reason)+'">{:t('plugin_ui.reward_not_issued')}</span>';
                }
                return '<span style="color:#999;">{:t('plugin_ui.reward_unprocessed')}</span>';
            }},
            {field: 'sort', title: '{:t("plugin_ui.sort")}', width: 80, sort: true},
            {field: 'created_at', title: '{:t("payment_ui.create_time")}', minWidth: 160},
            {title: '{:t("common.operation")}', toolbar: '#QH_TbBar', align: 'center', width: 480, unresize: true}
        ]]
    });

    /* 表格搜索 */
    form.on('submit(QH_TbSearch)', function (data) {
        insTb.reload({where: data.field, page: {curr: 1}});
        return false;
    });

    /* 表格工具条点击事件 */
    table.on('tool(QH_Table)', function (obj) {
        if (obj.event === 'edit') {
            showEditDialog(obj.data.id);
        } else if (obj.event === 'purchases') {
            showRecordDialog('purchase', obj.data);
        } else if (obj.event === 'downloads') {
            showRecordDialog('download', obj.data);
        } else if (obj.event === 'rewards') {
            showRewardDialog(obj.data);
        } else if (obj.event === 'status') {
            showStatusDialog(obj.data);
        } else if (obj.event === 'del') {
            doDel(obj);
        }
    });

    /* 表格头工具栏点击事件 */
    table.on('toolbar(QH_Table)', function (obj) {
        if (obj.event === 'del') {
            var checkRows = table.checkStatus('QH_Table');
            if (checkRows.data.length === 0) {
                notice.msg('{:t("confirm.please_select_data")}', {icon: 3, audio:'1'});
                return;
            }
            var ids = checkRows.data.map(function (d) {
                return d.id;
            });
            doDel({ids: ids});
        }
    });

    /* 删除 */
    function doDel(obj) {
        layer.confirm('{:t("auth_portal.confirm_delete")}', {
            skin: 'layui-layer-admin',
            icon: 3,
            shade: .1
        }, function (i) {
            layer.close(i);
            notice.msg('{:t("common.loading")}', {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: obj.data ? '{:url("/Plugin/drop")}' : '{:url("/Plugin/batchDrop")}',
                data: {id: obj.data ? obj.data.id : obj.ids.join(',')},
                dataType: "json",
                success: function(data) {
                    notice.destroy();
                    if (data.code == 0) {
                        table.reload('QH_Table');
                        notice.msg(data.msg, {icon: 1, audio:'1'});
                    }else{
                        notice.msg(data.msg, {icon: 2, audio:'1'});
                    }
                },
                error: function() {
                    notice.destroy();
                    notice.msg("{:t('common.server_error')}", {icon: 2, audio:'1'});
                }
            });
        });
    }

    /* 显示编辑对话框 */
    window.showEditDialog = function(id) {
        layer.open({
            type: 2,
            title: id > 0 ? '{:t("plugin_ui.edit_plugin")}' : '{:t("plugin_ui.add_plugin")}',
            content: '{:url("/Plugin/edit")}?id=' + id,
            area: ['90%', '90%'],
            maxmin: true,
            end: function() {
                table.reload('QH_Table');
            }
        });
    };

    function showRecordDialog(type, data) {
        var tableId = 'plugin_record_table_' + type + '_' + data.id;
        layer.open({
            type: 1,
            title: (type === 'purchase' ? '{:t("plugin_ui.purchase_records")} - ' : '{:t("plugin_ui.download_records")} - ') + data.name,
            area: ['90%', '78%'],
            maxmin: true,
            content: '<div style="padding:15px;"><table id="'+tableId+'" lay-filter="'+tableId+'"></table></div>',
            success: function() {
                if (type === 'purchase') {
                    table.render({
                        elem: '#' + tableId,
                        url: '{:url("/PluginOrder/list")}',
                        method: 'post',
                        page: true,
                        skin: 'line',
                        size: 'lg',
                        where: {plugin_id: data.id},
                        request: {pageName: 'current_page', limitName: 'limit'},
                        parseData: function(res){
                            return {code: res.code, msg: res.msg, count: res.data.data.total, data: res.data.data.data};
                        },
                        cols: [[
                            {field:'order_no', title:'{:t("plugin_ui.order_number")}', minWidth:190},
                            {field:'user_id', title:'{:t("common_ui.user_id")}', width:90},
                            {field:'app_id', title:'{:t("plugin_ui.app_id")}', width:90},
                            {field:'price', title:'{:t("accounting.amount")}', width:100, templet:function(d){
                                return d.pay_type === 'points' ? parseInt(d.price) + ' {:t("accounting.point_unit")}' : '¥' + d.price;
                            }},
                            {field:'pay_type', title:'{:t("common_ui.payment_method")}', width:100},
                            {field:'status', title:'{:t("common.status")}', width:100, templet:function(d){
                                if (d.status == 1) return '<span class="layui-badge layui-badge-green">{:t('plugin_ui.paid')}</span>';
                                if (d.status == 0) return '<span class="layui-badge layui-badge-orange">{:t('plugin_ui.pending_payment')}</span>';
                                if (d.status == 2) return '<span class="layui-badge layui-bg-gray">{:t('plugin_ui.cancelled')}</span>';
                                if (d.status == 3) return '<span class="layui-badge layui-badge-red">{:t('plugin_ui.refunded')}</span>';
                                return '-';
                            }},
                            {field:'paid_at', title:'{:t("plugin_ui.payment_time")}', minWidth:160},
                            {field:'created_at', title:'{:t("payment_ui.create_time")}', minWidth:160}
                        ]]
                    });
                } else {
                    table.render({
                        elem: '#' + tableId,
                        url: '{:url("/Plugin/downloadRecords")}',
                        method: 'post',
                        page: true,
                        skin: 'line',
                        size: 'lg',
                        where: {plugin_id: data.id},
                        request: {pageName: 'current_page', limitName: 'limit'},
                        parseData: function(res){
                            return {code: res.code, msg: res.msg, count: res.data.data.total, data: res.data.data.data};
                        },
                        cols: [[
                            {field:'id', title:'ID', width:80},
                            {field:'username', title:'{:t("admin_user.user_suffix")}', minWidth:120, templet:function(d){
                                return d.username || ('UID:' + d.user_id);
                            }},
                            {field:'app_id', title:'{:t("plugin_ui.app_id")}', width:90},
                            {field:'plugin_version', title:'{:t("version_ui.version_suffix")}', width:100},
                            {field:'order_id', title:'{:t("plugin_ui.order_id")}', width:100},
                            {field:'ip', title:'IP', width:140},
                            {field:'created_at', title:'{:t("plugin_ui.download_time")}', minWidth:160}
                        ]]
                    });
                }
            }
        });
    }

    function showRewardDialog(data) {
        var tableId = 'plugin_reward_table_' + data.id;
        layer.open({
            type: 1,
            title: '{:t("plugin_ui.reward_records")} - ' + esc(data.name),
            area: ['900px', '520px'],
            content: '<div style="padding:15px;"><table id="'+tableId+'"></table></div>',
            success: function() {
                table.render({
                    elem: '#' + tableId,
                    url: '{:url("/Plugin/rewardRecords")}',
                    method: 'post',
                    page: true,
                    skin: 'line',
                    where: {plugin_id: data.id},
                    request: {pageName: 'current_page', limitName: 'limit'},
                    parseData: function(res){
                        var page = res.data && res.data.data ? res.data.data : {total:0,data:[]};
                        return {code: res.code, msg: res.msg, count: page.total || 0, data: page.data || []};
                    },
                    cols: [[
                        {field:'id', title:'ID', width:70},
                        {field:'status', title:'{:t("common.status")}', width:90, templet:function(d){
                            return d.status === 'issued'
                                ? '<span class="layui-badge layui-badge-green">{:t('plugin_ui.reward_issued')}</span>'
                                : '<span class="layui-badge layui-badge-gray">{:t('plugin_ui.reward_not_issued')}</span>';
                        }},
                        {field:'points', title:'{:t("accounting.point_unit")}', width:90},
                        {field:'balance', title:'{:t("plugin_ui.platform_balance_label")}', width:100, templet:function(d){ return '¥'+d.balance; }},
                        {field:'reason', title:'{:t("accounting.description")}', minWidth:200, templet:function(d){ return esc(d.reason || '{:t("plugin_ui.first_approval")}'); }},
                        {field:'admin_username', title:'{:t("plugin_ui.reviewer")}', width:100, templet:function(d){ return esc(d.admin_username || ('ID:'+d.approved_by)); }},
                        {field:'approved_at', title:'{:t("plugin_ui.review_time")}', width:165}
                    ]]
                });
            }
        });
    }

    /* 显示状态对话框 */
    function showStatusDialog(data) {
        var statusOptions = [
            {value: 0, text: '{:t("plugin_ui.pending_review")}'},
            {value: 1, text: '{:t("user_home.published")}'},
            {value: 2, text: '{:t("plugin_ui.off_shelf")}'},
            {value: 3, text: '{:t("plugin_ui.review_rejected")}'}
        ];

        var html = '<div style="padding:20px;">';
        html += '<div class="layui-form-item">';
        html += '<label class="layui-form-label">{:t('common.status')}</label>';
        html += '<div class="layui-input-block">';
        html += '<select id="plugin_status">';
        statusOptions.forEach(function(opt) {
            html += '<option value="'+opt.value+'" '+(data.status == opt.value ? 'selected' : '')+'>'+opt.text+'</option>';
        });
        html += '</select>';
        html += '</div>';
        html += '</div>';
        html += '<div class="layui-form-item">';
        html += '<label class="layui-form-label">{:t('plugin_ui.review_note')}</label>';
        html += '<div class="layui-input-block">';
        html += '<textarea id="audit_note" class="layui-textarea" placeholder="{:t('plugin_ui.review_note_placeholder')}">'+esc(data.audit_note || '')+'</textarea>';
        html += '</div>';
        html += '</div>';
        html += '<div class="layui-form-item" id="plugin_reward_row">';
        html += '<label class="layui-form-label">{:t('plugin_ui.publish_reward')}</label>';
        html += '<div class="layui-input-block">';
        html += '<input type="checkbox" id="issue_reward" value="1" checked> {:t("plugin_ui.issue_on_first_approval")}';
        var rewardParts = [];
        if (rewardConfig.points > 0) rewardParts.push(rewardConfig.points + ' {:t("accounting.point_unit")}');
        if (parseFloat(rewardConfig.balance) > 0) rewardParts.push(rewardConfig.balance + ' {:t("plugin_ui.platform_balance")}');
        html += '<div id="plugin_reward_hint" style="font-size:12px;color:#999;margin-top:6px;line-height:20px;">{:t("plugin_ui.current_config")}：'+esc(rewardParts.join(' + ') || '{:t("plugin_ui.zero_reward")}')+'。{:t("plugin_ui.reward_validation_help")}</div>';
        html += '</div>';
        html += '</div>';
        html += '</div>';

        layer.open({
            type: 1,
            title: '{:t("plugin_ui.change_status")}',
            content: html,
            area: ['560px', '410px'],
            btn: ['{:t("common.confirm")}', '{:t("common.cancel")}'],
            yes: function(index) {
                var status = $('#plugin_status').val();
                var audit_note = $('#audit_note').val();
                var issue_reward = $('#issue_reward').prop('checked') ? 1 : 0;

                $.ajax({
                    type: "POST",
                    url: '{:url("/Plugin/setStatus")}',
                    data: {id: data.id, status: status, audit_note: audit_note, issue_reward: issue_reward},
                    dataType: "json",
                    success: function(res) {
                        if (res.code == 0) {
                            notice.msg(res.msg, {icon: 1, audio:'1'});
                            table.reload('QH_Table');
                            layer.close(index);
                        } else {
                            notice.msg(res.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.msg("{:t('common.server_error')}", {icon: 2, audio:'1'});
                    }
                });
            }
        });

        form.render('select');
        function updateRewardRow() {
            var approving = parseInt($('#plugin_status').val(), 10) === 1 && parseInt(data.status, 10) !== 1;
            $('#plugin_reward_row').toggle(approving);
            if (!approving) return;
            if (!rewardConfig.enabled) {
                $('#issue_reward').prop('checked', false).prop('disabled', true);
                $('#plugin_reward_hint').text('{:t("plugin_ui.reward_disabled")}');
            } else if (data.published_at || data.reward_status) {
                $('#issue_reward').prop('checked', false).prop('disabled', true);
                $('#plugin_reward_hint').text(data.reward_status ? '{:t("plugin_ui.reward_already_processed")}' : '{:t("plugin_ui.reward_re_review")}');
            } else if (rewardConfig.originalOnly && parseInt(data.origin_type, 10) !== 1) {
                $('#issue_reward').prop('checked', false).prop('disabled', true);
                $('#plugin_reward_hint').text('{:t("plugin_ui.reward_original_only")}');
            }
        }
        $('#plugin_status').on('change', updateRewardRow);
        updateRewardRow();
    }
});
</script>
