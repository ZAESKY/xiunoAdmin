{include file="/public/header"}
<style>
    .point-product-cover{width:44px;height:44px;object-fit:cover;border-radius:4px;background:#f5f5f5;}
    .point-upload-preview{margin-top:8px;}
    .point-upload-preview img{width:88px;height:88px;object-fit:cover;border-radius:4px;border:1px solid #eee;}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('codepay_ui.label_product')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('point_product.search_placeholder')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status">
                                <option value="">{:t('feedback.all_statuses')}</option>
                                <option value="1">{:t('point_product.listed')}</option>
                                <option value="0">{:t('point_product.unlisted')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                        <button type="button" class="layui-btn layui-btn-normal icon-btn" id="SF_Add">
                            <i class="layui-icon">&#xe654;</i>{:t('point_product.add_product')}
                        </button>
                    </div>
                </div>
            </form>
            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>

<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-primary layui-btn-sm" lay-event="edit">{:t('common_ui.edit')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del">{:t('common.delete')}</a>
</script>

<script type="text/html" id="SF_Status">
    <input type="checkbox" lay-filter="SF_StatusCk" value="{{d.id}}" lay-skin="switch"
           lay-text="{:t('point_product.listed_unlisted')}" {{d.status==1?'checked':''}}/>
</script>

<script type="text/html" id="SF_EditDialog">
    <form id="SF_EditForm" lay-filter="SF_EditForm" class="layui-form model-form">
        <input name="id" type="hidden"/>
        <input name="image" type="hidden"/>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">{:t('point_product.name')}</label>
            <div class="layui-input-block">
                <input name="name" class="layui-input" lay-verify="required" placeholder="{:t('point_product.name_placeholder')}"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:t('point_product.image')}</label>
            <div class="layui-input-block">
                <button type="button" class="layui-btn layui-btn-primary" id="SF_UploadImage">
                    <i class="layui-icon layui-icon-upload"></i>{:t('set_ui.upload_image')}
                </button>
                <div class="point-upload-preview layui-hide" id="SF_ImagePreview">
                    <img src="" alt="{:t('point_product.image')}"/>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">{:t('point_product.required_points')}</label>
            <div class="layui-input-block">
                <input type="number" name="required_points" class="layui-input" min="1" step="1" lay-verify="required|number"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:t('point_product.user_limit')}</label>
            <div class="layui-input-block">
                <input type="number" name="exchange_limit" class="layui-input" min="0" step="1" placeholder="{:t('point_product.no_limit_hint')}"/>
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">{:t('point_product.description')}</label>
            <div class="layui-input-block">
                <textarea name="description" class="sf-product-desc" style="display:none;"></textarea>
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label layui-form-required">{:t('point_product.reward_info')}</label>
            <div class="layui-input-block">
                <textarea name="reward_info" class="layui-textarea" style="min-height:160px;" lay-verify="required" placeholder="{:t('point_product.reward_info_help')}"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:t('common.status')}</label>
            <div class="layui-input-block">
                <input type="checkbox" name="status" value="1" lay-skin="switch" lay-text="{:t('point_product.listed_unlisted')}" checked/>
            </div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="SF_EditSubmit" lay-submit>{:t('common.save')}</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">{:t('common.cancel')}</button>
        </div>
    </form>
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'admin', 'notice', 'upload', 'layedit'], function () {
    var $ = layui.jquery;
    var form = layui.form;
    var table = layui.table;
    var admin = layui.admin;
    var notice = layui.notice;
    var upload = layui.upload;
    var layedit = layui.layedit;
    var descLayeditIndex;

    var insTb = table.render({
        elem: '#SF_Table',
        url: '{:url("/PointProduct/list")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        request: {pageName: 'current_page', limitName: 'limit'},
        parseData: function(res){
            return {code: res.code, msg: res.msg, count: res.data.data.total || 0, data: res.data.data.data || []};
        },
        cols: [[
            {field: 'id', title: 'ID', width: 70, sort: true},
            {field: 'image', title: '{:t("set_ui.image")}', width: 90, templet: function(d){
                return d.image ? '<img class="point-product-cover" src="'+escapeAttr(d.image)+'">' : '-';
            }},
            {field: 'name', title: '{:t("point_product.name")}', minWidth: 170},
            {field: 'required_points', title: '{:t("point_product.required_points")}', width: 110, sort: true},
            {field: 'stock', title: '{:t("point_product.remaining_stock")}', width: 100, sort: true},
            {field: 'exchange_limit', title: '{:t("point_product.user_limit")}', width: 100, templet:function(d){return d.exchange_limit > 0 ? d.exchange_limit : '{:t("point_product.unlimited")}';}},
            {field: 'status', title: '{:t("common.status")}', width: 100, templet: '#SF_Status'},
            {field: 'created_at', title: '{:t("payment_ui.create_time")}', minWidth: 170},
            {title: '{:t("common.operation")}', toolbar: '#SF_TbBar', align: 'center', width: 150}
        ]]
    });

    form.on('submit(SF_TbSearch)', function (data) {
        insTb.reload({where: data.field, page: {curr: 1}});
        return false;
    });

    $('#SF_Add').on('click', function(){ showEdit(); });

    table.on('tool(SF_Table)', function(obj){
        if (obj.event === 'edit') showEdit(obj.data);
        if (obj.event === 'del') doDel(obj);
    });

    form.on('switch(SF_StatusCk)', function(obj){
        $.post('{:url("/PointProduct/setStatus")}', {id: obj.value, status: obj.elem.checked ? 1 : 0}, function(res){
            notice.msg(res.msg, {icon: res.code == 0 ? 1 : 2});
            if (res.code != 0) insTb.reload();
        }, 'json');
    });

    function showEdit(data) {
        admin.open({
            type: 1,
            title: data ? '{:t("point_product.edit_product")}' : '{:t("point_product.add_product")}',
            area: ['720px', '700px'],
            content: $('#SF_EditDialog').html(),
            success: function(layero, index){
                var initData = data || {stock:0, exchange_limit:0, status:1};
                form.val('SF_EditForm', initData);
                if (initData.image) {
                    $(layero).find('#SF_ImagePreview').removeClass('layui-hide').find('img').attr('src', initData.image);
                }
                form.render();

                // 初始化富文本编辑器（使用唯一ID避免DOM冲突）
                var descId = 'SF_ProductDesc_' + Date.now();
                $(layero).find('.sf-product-desc').attr('id', descId);
                descLayeditIndex = layedit.build(descId, {
                    height: 200,
                    uploadImage: { url: '{:url("/Feedback/uploadImage")}', type: 'post' }
                });
                if (descLayeditIndex >= 0) {
                    var desc = initData.description || '';
                    if (desc.length > 0) {
                        // 解码 XSS 中间件转义的 HTML 实体
                        var t = document.createElement('textarea');
                        t.innerHTML = desc;
                        desc = t.value;
                        try { layedit.setContent(descLayeditIndex, desc); } catch(e) {}
                    }
                }

                // 限制编辑器内图片宽度
                setTimeout(function(){
                    var ifr = $('#LAY_layedit_' + descLayeditIndex)[0];
                    if (ifr && ifr.contentWindow) {
                        var doc = ifr.contentWindow.document;
                        var s = doc.createElement('style');
                        s.innerHTML = 'img{max-width:60%!important;height:auto!important;}';
                        doc.head.appendChild(s);
                    }
                }, 500);

                upload.render({
                    elem: $(layero).find('#SF_UploadImage')[0],
                    url: '{:url("/Upload/image")}',
                    before: function(obj){
                        obj.preview(function(index, file, result){
                            $(layero).find('#SF_ImagePreview').removeClass('layui-hide').find('img').attr('src', result);
                        });
                        notice.msg('{:t("app_ui.uploading")}', {icon: 4, close: true});
                    },
                    done: function(res){
                        notice.destroy();
                        if(res.code == 0){
                            $(layero).find('input[name="image"]').val(res.data.path);
                            $(layero).find('#SF_ImagePreview').removeClass('layui-hide').find('img').attr('src', res.data.path);
                            notice.msg('{:t("upload.upload_success")}', {icon: 1, audio:'1'});
                        }else{
                            notice.msg(res.msg || '{:t("common.upload_failed")}', {icon: 2, audio:'1'});
                        }
                    },
                    error: function(){
                        notice.destroy();
                        notice.msg('{:t("common.upload_failed")}', {icon: 2, audio:'1'});
                    }
                });

                form.on('submit(SF_EditSubmit)', function(fd){
                    fd.field.description = layedit.getContent(descLayeditIndex);
                    $.post('{:url("/PointProduct/edit")}', fd.field, function(res){
                        notice.msg(res.msg, {icon: res.code == 0 ? 1 : 2});
                        if (res.code == 0) { layer.close(index); insTb.reload(); }
                    }, 'json');
                    return false;
                });
            }
        });
    }

    function doDel(obj) {
        layer.confirm('{:t("point_product.delete_confirm")}', {icon: 3, shade: .1}, function(i){
            layer.close(i);
            $.post('{:url("/PointProduct/drop")}', {id: obj.data.id}, function(res){
                notice.msg(res.msg, {icon: res.code == 0 ? 1 : 2});
                if (res.code == 0) insTb.reload();
            }, 'json');
        });
    }

    function escapeAttr(value){
        return String(value || '').replace(/[&<>"']/g, function(s){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];});
    }
});
</script>
