{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">搜索</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="搜索插件名称/标识"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">状态</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">全部状态</option>
                                <option value="0">待审核</option>
                                <option value="1">已上架</option>
                                <option value="2">已下架</option>
                                <option value="3">审核拒绝</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>搜索
                        </button>
                    </div>
                </div>
            </form>
            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>

<script type="text/html" id="SF_TbBar">
    {{# if(d.price > 0 && d.status == 1){ }}
    <a class="layui-btn layui-btn-sm layui-btn-warm" lay-event="purchases"><i class="layui-icon layui-icon-user"></i>购买记录</a>
    {{# } }}
    {{# if(d.status != 1){ }}
    <a class="layui-btn layui-btn-sm layui-btn-normal" lay-event="edit"><i class="layui-icon">&#xe642;</i>编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon">&#xe640;</i>删除</a>
    {{# } else { }}
    <a class="layui-btn layui-btn-sm layui-btn-normal" lay-event="edit"><i class="layui-icon">&#xe642;</i>编辑</a>
    {{# } }}
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'notice'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var table = layui.table;
    var notice = layui.notice;

    var insTb = table.render({
        elem: '#SF_Table',
        url: '{:url("/UserPlugin/list")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        cellMinWidth: 100,
        request: { pageName: 'current_page', limitName: 'limit' },
        parseData: function(res){
            return {
                "code": res.code, "msg": res.msg,
                "count": res.data.data.total, "data": res.data.data.data
            };
        },
        cols: [[
            {field: 'id', title: 'ID', sort: true, width: 80},
            {field: 'icon', title: '图标', width: 80, templet: function(d){
                return '<img src="'+(d.icon || '/Assets/img/default-plugin.png')+'" style="width:40px;height:40px;object-fit:cover;border-radius:4px;">';
            }},
            {field: 'name', title: '插件名称', minWidth: 150},
            {field: 'version', title: '版本', width: 80},
            {field: 'price', title: '价格', width: 100, templet: function(d){
                return d.price == 0 ? '<span class="layui-badge layui-badge-green">免费</span>' : '<span class="layui-badge layui-badge-orange">¥'+d.price+'</span>';
            }},
            {field: 'download_count', title: '下载', width: 80},
            {field: 'rating_avg', title: '评分', width: 80},
            {field: 'status', title: '状态', width: 100, templet: function(d){
                switch(d.status){
                    case 0: return '<span class="layui-badge layui-badge-orange">待审核</span>';
                    case 1: return '<span class="layui-badge layui-badge-green">已上架</span>';
                    case 2: return '<span class="layui-badge layui-badge-gray">已下架</span>';
                    case 3: return '<span class="layui-badge layui-badge-red">审核拒绝</span>';
                    default: return '-';
                }
            }},
            {field: 'audit_note', title: '审核备注', minWidth: 150, templet: function(d){
                return d.audit_note || '-';
            }},
            {field: 'created_at', title: '创建时间', minWidth: 160},
            {title: '操作', toolbar: '#SF_TbBar', align: 'center', minWidth: 160, fixed: 'right'}
        ]]
    });

    form.on('submit(SF_TbSearch)', function (data) {
        insTb.reload({where: data.field, page: {curr: 1}});
        return false;
    });

    table.on('tool(SF_Table)', function (obj) {
        if (obj.event === 'purchases') {
            showPurchases(obj.data);
            return;
        }
        if (obj.event === 'edit') {
            layer.open({
                type: 2, title: '编辑插件',
                content: '{:url("/UserPlugin/create")}?id=' + obj.data.id,
                area: ['90%', '90%'], maxmin: true,
                end: function() { table.reload('SF_Table'); }
            });
        } else if (obj.event === 'del') {
            layer.confirm('确定要删除此插件吗？', {skin:'layui-layer-admin',icon:3,shade:.1}, function(i) {
                layer.close(i);
                $.ajax({
                    type: "POST", url: '{:url("/UserPlugin/drop")}', data: {id: obj.data.id}, dataType: "json",
                    success: function(res) {
                        if (res.code == 0) { table.reload('SF_Table'); notice.msg(res.msg, {icon:1}); }
                        else { notice.msg(res.msg, {icon:2}); }
                    }
                });
            });
        }
    });

    function showPurchases(data) {
        var t2 = layui.table;
        layer.open({
            type: 1, title: '购买记录 - '+data.name, area: ['700px', '480px'],
            content: '<table id="SF_PurchaseTable" lay-filter="SF_PurchaseTable"></table>',
            success: function() {
                t2.render({
                    elem: '#SF_PurchaseTable', url: '{:url("/UserPlugin/pluginPurchases")}', method: 'post',
                    page: true, limit: 15, where: { plugin_id: data.id },
                    request: { pageName: 'current_page', limitName: 'limit' },
                    parseData: function(r){ return {code:r.code,msg:r.msg,count:r.data.data.total,data:r.data.data.data}; },
                    cols: [[
                        {field: 'username', title: '购买用户', width: 150},
                        {field: 'paid_price', title: '支付金额', width: 100, templet: function(d){ return d.order_pay_type==='points' ? '<span style="color:#ff5722;">'+parseInt(d.paid_price)+' 积分</span>' : '<span style="color:#ff5722;">¥'+d.paid_price+'</span>'; }},
                        {field: 'order_no', title: '订单号', minWidth: 180},
                        {field: 'paid_at', title: '购买时间', width: 170}
                    ]]
                });
            }
        });
    }

});
</script>
