{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <div class="layui-tab layui-tab-brief">
                <ul class="layui-tab-title">
                    <li class="layui-this" data-type="my_comments">{:t('plugin_detail.my_comment')}</li>
                    <li data-type="my_app_comments">{:t('plugin_record.my_app_comments')}</li>
                </ul>
                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <form class="layui-form toolbar">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <label class="layui-form-label">{:t('common.search')}</label>
                                    <div class="layui-input-inline">
                                        <input name="text" class="layui-input" placeholder="{:t('plugin_record.search_comment_plugin')}"/>
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <label class="layui-form-label">{:t('common.status')}</label>
                                    <div class="layui-input-inline">
                                        <select name="status">
                                            <option value="">{:t('feedback.all_statuses')}</option>
                                            <option value="0">{:t('plugin_ui.pending_review')}</option>
                                            <option value="1">{:t('plugin_detail.approved')}</option>
                                            <option value="2">{:t('plugin_detail.rejected')}</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-btn-container">
                                    <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                                        <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                                    </button>
                                </div>
                            </div>
                        </form>
                        <table id="SF_Table" lay-filter="SF_Table"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="view"><i class="layui-icon">&#xe705;</i>{:t('common.view')}</a>
    {{# if(currentType === 'my_app_comments'){ }}
        {{# if(!d.reply_content){ }}
        <a class="layui-btn layui-btn-xs" lay-event="reply"><i class="layui-icon">&#xe611;</i>{:t('feedback.reply')}</a>
        {{# } else { }}
        <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="reply"><i class="layui-icon">&#xe642;</i>{:t('plugin_record.edit_reply')}</a>
        {{# } }}
    {{# } }}
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'notice', 'element'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var table = layui.table;
    var notice = layui.notice;
    var element = layui.element;

    var currentType = 'my_comments';

    var insTb = table.render({
        elem: '#SF_Table',
        url: '{:url("/UserPlugin/comments")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        cellMinWidth: 100,
        where: { type: currentType },
        request: { pageName: 'current_page', limitName: 'limit' },
        parseData: function(res){
            return {
                "code": res.code, "msg": res.msg,
                "count": res.data.data.total, "data": res.data.data.data
            };
        },
        cols: [[
            {field: 'id', title: 'ID', width: 80, fixed: 'left'},
            {field: 'plugin_name', title: '{:t("plugin_ui.name")}', minWidth: 150},
            {field: 'username', title: '{:t("plugin_record.comment_user")}', width: 120},
            {field: 'content', title: '{:t("plugin_record.comment_content")}', minWidth: 250, templet: function(d){
                var content = d.content || '';
                if(content.length > 50) {
                    return content.substring(0, 50) + '...';
                }
                return content;
            }},
            {field: 'rating', title: '{:t("plugin_ui.rating")}', width: 80, templet: function(d){
                return '<span style="color:#ff5722;">'+d.rating + '{:t("plugin_record.rating_suffix")}</span>';
            }},
            {field: 'status', title: '{:t("common.status")}', width: 100, templet: function(d){
                switch(d.status){
                    case 0: return '<span class="layui-badge layui-badge-orange">{:t('plugin_ui.pending_review')}</span>';
                    case 1: return '<span class="layui-badge layui-badge-green">{:t('plugin_detail.approved')}</span>';
                    case 2: return '<span class="layui-badge layui-badge-red">{:t('plugin_detail.rejected')}</span>';
                    default: return '-';
                }
            }},
            {field: 'reply_content', title: '{:t("plugin_record.reply_status")}', width: 100, templet: function(d){
                return d.reply_content ? '<span class="layui-badge layui-badge-green">{:t('plugin_record.replied')}</span>' : '<span style="color:#999;">{:t('plugin_record.not_replied')}</span>';
            }},
            {field: 'created_at', title: '{:t("plugin_record.comment_time")}', width: 160},
            {title: '{:t("common.operation")}', toolbar: '#SF_TbBar', align: 'center', width: 180, fixed: 'right'}
        ]]
    });

    window.currentType = currentType;

    // 切换标签页
    element.on('tab', function(data) {
        var type = $(this).attr('data-type') || 'my_comments';
        currentType = type;
        window.currentType = type;

        // 更新表格列显示
        if (type === 'my_comments') {
            insTb.reload({
                where: { type: type },
                page: { curr: 1 }
            });
        } else {
            insTb.reload({
                where: { type: type },
                page: { curr: 1 }
            });
        }
    });

    form.on('submit(SF_TbSearch)', function (data) {
        var params = Object.assign({}, data.field, { type: currentType });
        insTb.reload({where: params, page: {curr: 1}});
        return false;
    });

    table.on('tool(SF_Table)', function (obj) {
        if (obj.event === 'view') {
            showDetail(obj.data);
        } else if (obj.event === 'reply') {
            showReplyDialog(obj.data);
        }
    });

    function showDetail(data) {
        var statusCfg = {0:{cls:'layui-badge-orange',txt:'{:t("plugin_ui.pending_review")}'},1:{cls:'layui-badge-green',txt:'{:t("plugin_detail.approved")}'},2:{cls:'layui-badge-red',txt:'{:t("plugin_detail.rejected")}'}};
        var s = statusCfg[data.status] || {cls:'',txt:'{:t("home.unknown_author")}'};
        var stars = '';
        for (var i = 1; i <= 5; i++) stars += i <= data.rating ? '★' : '☆';

        var html = '';
        html += '<div style="padding:24px 28px;">';
        // 头部信息
        html += '<div style="display:flex;align-items:flex-start;gap:20px;padding-bottom:20px;border-bottom:1px solid #f0f0f0;margin-bottom:20px;">';
        html += '  <div style="flex:1;">';
        html += '    <div style="font-size:16px;font-weight:600;color:#1d1d1f;margin-bottom:4px;">'+escapeHtml(data.plugin_name)+'</div>';
        html += '    <div style="font-size:13px;color:#8e8e93;">'+escapeHtml(data.username||'{:t("plugin_detail.anonymous")}')+' · '+escapeHtml(data.created_at)+'</div>';
        html += '  </div>';
        html += '  <span class="layui-badge '+s.cls+'">'+s.txt+'</span>';
        html += '</div>';
        // 评分
        html += '<div style="margin-bottom:18px;"><span style="font-size:14px;color:#f5a623;letter-spacing:2px;">'+stars+'</span><span style="font-size:14px;color:#1d1d1f;font-weight:600;margin-left:8px;">'+data.rating+'{:t("plugin_record.rating_suffix")}</span></div>';
        // 评论内容
        html += '<div style="background:#f9f9fb;border-radius:8px;padding:16px 20px;font-size:14px;color:#444;line-height:1.8;margin-bottom:18px;">'+escapeHtml(data.content)+'</div>';
        // 开发者回复
        if(data.reply_content) {
            html += '<div style="border-left:3px solid #1890ff;background:#f6f9ff;border-radius:0 6px 6px 0;padding:14px 18px;">';
            html += '  <div style="font-size:12px;color:#1890ff;font-weight:600;margin-bottom:6px;"><i class="layui-icon layui-icon-username"></i> {:t("plugin_detail.developer_reply")} <span style="color:#bbb;font-weight:400;">'+escapeHtml(data.reply_at)+'</span></div>';
            html += '  <div style="font-size:13px;color:#555;line-height:1.8;">'+escapeHtml(data.reply_content)+'</div>';
            html += '</div>';
        }
        html += '</div>';

        layer.open({ type:1, title:'{:t("plugin_record.comment_detail")}', area:['560px','auto'], content:html });
    }

    function showReplyDialog(data) {
        layer.prompt({
            formType: 2,
            title: data.reply_content ? '{:t("plugin_record.edit_reply")}' : '{:t("plugin_record.reply_comment")}',
            area: ['500px', '250px'],
            maxlength: 500,
            value: data.reply_content || ''
        }, function(value, index) {
            if(!value || value.trim() === '') {
                notice.msg('{:t("plugin_record.reply_required")}', {icon: 2});
                return;
            }
            notice.msg('{:t("registration.submitting")}', {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: '{:url("/UserPlugin/replyComment")}',
                data: { comment_id: data.id, reply_content: value },
                dataType: "json",
                success: function(res) {
                    notice.destroy();
                    if (res.code == 0) {
                        layer.close(index);
                        table.reload('SF_Table');
                        notice.msg(res.msg, {icon: 1, audio: '1'});
                    } else {
                        notice.msg(res.msg, {icon: 2, audio: '1'});
                    }
                },
                error: function() {
                    notice.destroy();
                    notice.msg("{:t('common.server_error')}", {icon: 2, audio: '1'});
                }
            });
        });
    }

    function escapeHtml(text) {
        var map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(text || '').replace(/[&<>"']/g, function(m) { return map[m]; });
    }
});
</script>
