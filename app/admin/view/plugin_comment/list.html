{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('auth_portal.content')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('plugin_record.search_comment')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">{:t('feedback.all_statuses')}</option>
                                <option value="0">{:t('plugin_ui.pending_review')}</option>
                                <option value="1">{:t('plugin_detail.approved')}</option>
                                <option value="2">{:t('plugin_detail.rejected')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                    </div>
                </div>
            </form>
            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>

<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-sm layui-btn-normal" lay-event="approve"><i class="layui-icon">&#xe605;</i>{:t('plugin_record.approve')}</a>
    <a class="layui-btn layui-btn-sm layui-btn-warm" lay-event="reject"><i class="layui-icon">&#x1006;</i>{:t('plugin_record.reject')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon">&#xe640;</i>{:t('common.delete')}</a>
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'notice'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var table = layui.table;
    var notice = layui.notice;

    var insTb = table.render({
        elem: '#SF_Table',
        url: '{:url("/PluginComment/list")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        toolbar: ['<p>',
            '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>{:t('plugin_ui.batch_delete')}</button>',
            '</p>'].join(''),
        cellMinWidth: 100,
        request: {
            pageName: 'current_page',
            limitName: 'limit'
        },
        parseData: function(res){
            return {
                "code": res.code,
                "msg": res.msg,
                "count": res.data.data.total,
                "data": res.data.data.data
            };
        },
        cols: [[
            {type: 'checkbox', fixed: true},
            {field: 'id', title: 'ID', sort: true, width: 80, fixed: true},
            {field: 'plugin_id', title: '{:t("plugin_record.plugin_id")}', width: 100},
            {field: 'plugin_name', title: '{:t("plugin_ui.name")}', minWidth: 150},
            {field: 'user_id', title: '{:t("common_ui.user_id")}', width: 100},
            {field: 'username', title: '{:t("registration.username")}', width: 120},
            {field: 'app_id', title: '{:t("plugin_ui.app_id")}', width: 100},
            {field: 'content', title: '{:t("plugin_record.comment_content")}', minWidth: 250},
            {field: 'rating', title: '{:t("plugin_ui.rating")}', width: 80, templet: function(d){
                return d.rating + '{:t("plugin_detail.star")}';
            }},
            {field: 'status', title: '{:t("common.status")}', width: 100, templet: function(d){
                switch(d.status){
                    case 0: return '<span class="layui-badge layui-badge-orange">{:t('plugin_ui.pending_review')}</span>';
                    case 1: return '<span class="layui-badge layui-badge-green">{:t('plugin_detail.approved')}</span>';
                    case 2: return '<span class="layui-badge layui-badge-red">{:t('plugin_detail.rejected')}</span>';
                    default: return '-';
                }
            }},
            {field: 'ip', title: 'IP', width: 120},
            {field: 'created_at', title: '{:t("plugin_record.comment_time")}', minWidth: 160},
            {title: '{:t("common.operation")}', toolbar: '#SF_TbBar', align: 'center', minWidth: 220, fixed: 'right'}
        ]]
    });

    form.on('submit(SF_TbSearch)', function (data) {
        insTb.reload({where: data.field, page: {curr: 1}});
        return false;
    });

    table.on('tool(SF_Table)', function (obj) {
        if (obj.event === 'approve') {
            doSetStatus(obj.data.id, 1);
        } else if (obj.event === 'reject') {
            doSetStatus(obj.data.id, 2);
        } else if (obj.event === 'del') {
            doDel(obj);
        }
    });

    table.on('toolbar(SF_Table)', function (obj) {
        if (obj.event === 'del') {
            var checkRows = table.checkStatus('SF_Table');
            if (checkRows.data.length === 0) { notice.msg('{:t("confirm.please_select_data")}', {icon:3}); return; }
            var ids = checkRows.data.map(function(d){ return d.id; });
            doDel({ids: ids});
        }
    });

    function doSetStatus(id, status) {
        notice.msg('{:t("common.loading")}', {icon: 4, close: true});
        $.ajax({
            type: "POST",
            url: '{:url("/PluginComment/setStatus")}',
            data: {id: id, status: status},
            dataType: "json",
            success: function(data) {
                notice.destroy();
                if (data.code == 0) {
                    table.reload('SF_Table');
                    notice.msg(data.msg, {icon: 1, audio:'1'});
                } else {
                    notice.msg(data.msg, {icon: 2, audio:'1'});
                }
            },
            error: function() {
                notice.destroy();
                notice.msg("{:t('common.server_error')}", {icon: 2, audio:'1'});
            }
        });
    }

    function doDel(obj) {
        layer.confirm('{:t("auth_portal.confirm_delete")}', {
            skin: 'layui-layer-admin', icon: 3, shade: .1
        }, function (i) {
            layer.close(i);
            notice.msg('{:t("common.loading")}', {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: obj.data ? '{:url("/PluginComment/drop")}' : '{:url("/PluginComment/batchDrop")}',
                data: {id: obj.data ? obj.data.id : obj.ids.join(',')},
                dataType: "json",
                success: function(data) {
                    notice.destroy();
                    if (data.code == 0) {
                        table.reload('SF_Table');
                        notice.msg(data.msg, {icon: 1, audio:'1'});
                    } else {
                        notice.msg(data.msg, {icon: 2, audio:'1'});
                    }
                },
                error: function() {
                    notice.destroy();
                    notice.msg("{:t('common.server_error')}", {icon: 2, audio:'1'});
                }
            });
        });
    }
});
</script>
