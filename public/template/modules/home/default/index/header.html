<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{$title}</title>
    <meta name="keywords" content="{$keywords}"/>
    <meta name="description" content="{$description}"/>
    <link rel="stylesheet" href="{__LIBS__}layui/css/layui.css"/>
    <link rel="stylesheet" href="{__MODULE__}admin.css?v=318"/>
    <link rel="stylesheet" href="{__CSS__}sf-style.css"/>
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<style>
    :root {
        --bg: #fff;
        --bg-secondary: #f8fafc;
        --text: #1a1a2e;
        --text-secondary: #64748b;
        --border: #e2e8f0;
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --primary-light: #eef2ff;
        --gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
        --card-bg: #fff;
        --card-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
        --nav-bg: rgba(255,255,255,.85);
    }
    [data-theme="dark"] {
        --bg: #0f172a;
        --bg-secondary: #1e293b;
        --text: #f1f5f9;
        --text-secondary: #94a3b8;
        --border: #334155;
        --primary-light: #1e1b4b;
        --card-bg: #1e293b;
        --card-shadow: 0 1px 3px rgba(0,0,0,.3);
        --nav-bg: rgba(15,23,42,.9);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.6;
        overflow-x: hidden;
        transition: background .3s, color .3s;
    }
    a { color: var(--primary); text-decoration: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* Navbar */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); transition: background .3s; }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: var(--text); }
    .nav-logo img { height: 36px; width: auto; }
    .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
    .nav-links a { padding: 8px 16px; border-radius: 8px; color: var(--text-secondary); font-size: 14px; font-weight: 500; transition: color .2s, background .2s; display: block; }
    .nav-links a:hover { color: var(--primary); background: var(--primary-light); }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; border: none; text-decoration: none; white-space: nowrap; }
    .btn-primary { background: var(--gradient); color: #fff; box-shadow: 0 4px 14px rgba(79,70,229,.35); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,.45); color: #fff; }
    .btn-outline { background: transparent; color: var(--text); border: 2px solid var(--border); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .btn-lg { padding: 14px 32px; font-size: 16px; border-radius: 12px; }
    .btn-sm { padding: 7px 16px; font-size: 13px; border-radius: 6px; }
    .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 4px; color: var(--text); }
    .nav-toggle svg { width: 24px; height: 24px; }

    @media (max-width: 768px) {
        .nav-links { display: none; position: absolute; top: 64px; left: 0; right: 0; background: var(--bg); flex-direction: column; padding: 12px; border-bottom: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,.1); }
        .nav-links.open { display: flex; }
        .nav-links a { padding: 12px 16px; width: 100%; }
        .nav-toggle { display: block; }
        .nav-actions .btn { padding: 8px 14px; font-size: 13px; }
    }
</style>
<body>
<div class="nav" id="topNav">
    <div class="container nav-inner">
        <a href="{:url('/Index/main')}" class="nav-logo">
            <img src="{__IMG__}logo.png" alt="{$title}">
            <span>{$title}</span>
        </a>
        <ul class="nav-links" id="navLinks">
            <li><a href="{:url('/Index/main')}">首页</a></li>
            <li><a href="#features">产品功能</a></li>
            <li><a href="{:url('/Index/download')}">授权服务</a></li>
            <li><a href="#help">帮助说明</a></li>
        </ul>
        <div class="nav-actions">
            {if $user_login}
            <a href="/user.php" class="btn btn-primary btn-sm">进入控制台</a>
            {else}
            <a href="/user.php/login/index" class="btn btn-outline btn-sm">登录</a>
            <a href="/user.php/login/reg" class="btn btn-primary btn-sm">注册</a>
            {/if}
            <button class="nav-toggle" id="navToggle" aria-label="菜单">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
    </div>
</div>
<div style="height:64px;"></div>
