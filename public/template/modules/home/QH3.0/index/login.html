{include file="index/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">{:t('login.login_user')}</div>
        <div class="layui-card-body">
            <form class="layui-form" lay-filter="login-form">
                <div class="layui-form-item">
                    <label class="layui-form-label">{:t('registration.username')}</label>
                    <div class="layui-input-block">
                        <input type="text" name="username" required lay-verify="required" placeholder="{:t('common_ui.username_placeholder')}" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">{:t('registration.password')}</label>
                    <div class="layui-input-block">
                        <input type="password" name="password" required lay-verify="required" placeholder="{:t('common_ui.password_placeholder')}" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn" lay-submit lay-filter="login-submit">{:t('login.sign_in')}</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
layui.use(['form'], function(){
    var form = layui.form;
    form.on('submit(login-submit)', function(data){
        $.post('/user.php/Login/login', data.field, function(res){
            if (res.code === 0) {
                layer.msg('{:t("login.success")}', {icon: 1});
                setTimeout(function(){ location.href = '/user.php/Index/main.html'; }, 800);
            } else {
                layer.msg(res.msg || '{:t("login.failed")}', {icon: 2});
            }
        });
        return false;
    });
});
</script>
{include file="index/footer"}
