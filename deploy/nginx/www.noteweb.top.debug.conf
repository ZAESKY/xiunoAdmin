server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.noteweb.top;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/admin.noteweb.top/releases/20260816_230630/public;

    include /www/server/panel/vhost/nginx/extension/www.noteweb.top/*.conf;

    # SSL 证书验证目录保持公开，供 ACME 自动续签。
    include /www/server/panel/vhost/nginx/well-known/www.noteweb.top.conf;
    location ^~ /.well-known/acme-challenge/ {
        alias /www/wwwroot/www.noteweb.top/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ($uri ~ /\.well-known/) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    ssl_certificate /www/server/panel/vhost/cert/www.noteweb.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.noteweb.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    error_page 404 /404.html;

    # 上传目录必须在 PHP location 之前阻止脚本执行。
    location ~* ^/upload/.*\.(php|phtml|phar)$ {
        return 403;
    }

    # 测试期 API 白名单：站长公网 IP + demo.idaily.top 服务器出口 IP。
    # 业务层仍执行 HMAC、Nonce、时间窗、限流和一次性下载票据校验。
    location ~ ^/api\.php(?:/|$)
    {
        allow 117.147.12.123;
        allow 124.160.203.148;
        allow 101.201.62.187;
        deny all;
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
        include pathinfo.conf;
    }

    # 测试期页面仅允许站长当前公网 IP。
    location ~ [^/]\.php(/|$)
    {
        allow 117.147.12.123;
        allow 124.160.203.148;
        deny all;
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
        include pathinfo.conf;
    }
    include /www/server/panel/vhost/rewrite/www.noteweb.top.conf;

    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        allow 117.147.12.123;
        allow 124.160.203.148;
        deny all;
        expires 30d;
        access_log /dev/null;
        error_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        allow 117.147.12.123;
        allow 124.160.203.148;
        deny all;
        expires 12h;
        access_log /dev/null;
        error_log /dev/null;
    }

    access_log /www/wwwlogs/www.noteweb.top.log;
    error_log /www/wwwlogs/www.noteweb.top.error.log;
    access_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=4__access monitor;
    error_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=4__error;
}
