{include file="/public/header"}
<style>
    .bgimg{background-image:url('{__IMG__}recharge.png');border-radius:4px 4px 0 0;background-size:cover;background-repeat:no-repeat;height:135px;padding:15px;}
    .img{width:96px;height:96px;margin:auto;display:block;border-radius:50%;border:3px solid #fff;position:relative;margin-top:-80px;}
    .point-preview{padding:10px 12px;border-radius:4px;background:#f7fbff;color:#1e9fff;line-height:1.8;}
    .point-preview.warn{background:#fff7e6;color:#ff8c00;}
</style>
<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-sm12 layui-col-md3" style="overflow:hidden;">
            <div class="layui-card">
                <div class="bgimg"></div>
                <div class="layui-card-body" style="padding:25px;">
                    <div class="text-center layui-text">
                        <div class="img user-info-head" id="userInfoHead">
                            <img src="{$userInfo['img']}" alt=""/>
                        </div>
                        <h2 style="padding-top:20px;">{$userInfo['username']}</h2>
                        <p style="padding-top:8px;">{:hello_user($userInfo['username'])}</p>
                        <p style="padding-top:8px;">当前积分：<b style="color:#ff6a00;">{$userInfo.integral|default=0}</b></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-sm12 layui-col-md9">
            <div class="layui-card">
                <div class="layui-tab layui-tab-brief" lay-filter="userInfoTab">
                    <ul class="layui-tab-title">
                        <li class="layui-this">在线充值</li>
                    </ul>
                    <div class="layui-tab-content">
                        <div class="layui-tab-item layui-show">
                            <form class="layui-form formBasForm" id="userInfoForm" lay-filter="userInfoForm" style="max-width:600px;">
                                {notempty name="pay_notice"}
                                <div class="layui-form-item">
                                    <div class="sf-tag layui-badge-blue">{$pay_notice|raw}</div>
                                </div>
                                {/notempty}
                                <div class="layui-form-item">
                                    <label class="layui-form-label layui-form-required">充值金额</label>
                                    <div class="layui-input-block">
                                        <input type="radio" name="money" value="10" title="10元" lay-verify="required" lay-filter="money" checked/>
                                        <input type="radio" name="money" value="50" title="50元" lay-verify="required" lay-filter="money"/>
                                        <input type="radio" name="money" value="100" title="100元" lay-verify="required" lay-filter="money"/>
                                        <input type="radio" name="money" value="diy" title="自定义" lay-verify="required" lay-filter="money"/>
                                    </div>
                                </div>
                                <div id="diy" style="display:none;">
                                    <div class="layui-form-item">
                                        <label class="layui-form-label layui-form-required">自定义金额</label>
                                        <div class="layui-input-block">
                                            <input type="text" name="diy" value="" class="layui-input"
                                                   placeholder="最低充值10元，最多两位小数" autocomplete="off"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <label class="layui-form-label">预计积分</label>
                                    <div class="layui-input-block">
                                        <div id="pointPreview" class="point-preview"></div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <label class="layui-form-label">折扣码</label>
                                    <div class="layui-input-block">
                                        <input type="text" name="discount_code" id="discount_code" class="layui-input"
                                               placeholder="输入折扣码（选填）" autocomplete="off"/>
                                        <div id="codePreview" style="margin-top:8px;display:none;"></div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-input-block">
                                        <button class="layui-btn" lay-filter="submit" lay-submit>充值</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{include file="/public/footer"}
<script>
layui.use(['index', 'form', 'element', 'notice', 'admin'], function () {
    var $ = layui.jquery;
    var index = layui.index;
    var form = layui.form;
    var notice = layui.notice;
    var checkTimer;
    var discountRate = 0;

    form.on('radio(money)', function (data) {
        $('#diy').toggle(data.value === 'diy');
        updatePreview();
    });

    $('input[name=diy]').on('input', function(){
        var v = this.value.replace(/[^\d.]/g, '');
        var parts = v.split('.');
        if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
        if (v.indexOf('.') > -1) {
            var split = v.split('.');
            v = split[0] + '.' + split[1].substring(0, 2);
        }
        if (this.value !== v) this.value = v;
        updatePreview();
    }).on('blur', function(){
        var v = parseFloat(this.value);
        if (isNaN(v)) { this.value = ''; updatePreview(); return; }
        if (v < 10) { this.value = ''; updatePreview(); return; }
        if (v > 999999) v = 999999;
        this.value = v.toFixed(2);
        updatePreview();
    });

    $('#discount_code').on('input', function(){
        clearTimeout(checkTimer);
        var code = $(this).val().trim();
        discountRate = 0;
        if(!code){ $('#codePreview').hide().html(''); updatePreview(); return; }
        checkTimer = setTimeout(function(){
            $.ajax({
                type: 'POST',
                url: '{:url("/Rebate/checkCode")}',
                data: {code: code},
                dataType: 'json',
                success: function(res){
                    if(res.code == 0){
                        discountRate = parseFloat(res.data.rate) || 0;
                        $('#codePreview').show().html('<span class="layui-badge layui-badge-green">有效</span> 折扣 '+discountRate+'%，来自 <b>'+res.data.owner+'</b><span id="savePreview" style="color:#5cb85c;margin-left:8px;"></span>');
                    } else {
                        discountRate = 0;
                        $('#codePreview').show().html('<span class="layui-badge layui-badge-red">无效</span> '+res.msg);
                    }
                    updatePreview();
                }
            });
        }, 500);
    });

    function selectedMoney(){
        var moneyVal = $('input[name=money]:checked').val();
        if(moneyVal === 'diy') moneyVal = $('input[name=diy]').val();
        var money = parseFloat(moneyVal);
        return isNaN(money) ? 0 : Math.min(Math.max(money, 0), 999999);
    }

    function updatePreview(){
        var money = selectedMoney();
        var actualPay = discountRate > 0 ? Math.max(money * (1 - discountRate / 100), 0.01) : money;
        actualPay = Math.round(actualPay * 100) / 100;
        var points = Math.floor(actualPay);
        var $preview = $('#pointPreview');
        if(points <= 0){
            $preview.addClass('warn').html('充值金额：'+money.toFixed(2)+' 元，预计实付：'+actualPay.toFixed(2)+' 元，可获得：0 积分<br>当前充值金额不足 10 元，无法充值');
        } else {
            $preview.removeClass('warn').html('充值金额：'+money.toFixed(2)+' 元，预计实付：'+actualPay.toFixed(2)+' 元，可获得：<b>'+points+'</b> 积分');
        }
        if(discountRate > 0 && money > 0){
            $('#savePreview').text('预计实付 '+actualPay.toFixed(2)+' 元，节省 '+(money - actualPay).toFixed(2)+' 元');
        }
    }
    updatePreview();

    form.on('submit(submit)', function (data) {
        var money = selectedMoney();
        if(data.field.money === ''){
            notice.msg('请选择需要充值的金额', {icon: 2, audio:'1'});
            return false;
        }
        if(data.field.money === 'diy' && data.field.diy === '') {
            notice.msg('请输入需要充值的金额', {icon: 2, audio:'1'});
            return false;
        }
        if(money < 10){
            notice.msg('最低充值金额为10元', {icon: 2, audio:'1'});
            return false;
        }
        notice.msg('正在执行中...', {icon: 4, close: true});
        data.field.type = 'recharge';
        $.ajax({
            type: 'POST',
            url: '{:url("/MyInfo/createOrder")}',
            data: data.field,
            dataType: 'json',
            success: function(res) {
                notice.destroy();
                if (res.code == 0) {
                    notice.msg(res.msg, {icon: 1, audio:'1'});
                    index.openTab({
                        title: '付款界面',
                        url: '/pay.php/Index?trade_no='+res.data.trade_no
                    });
                } else {
                    notice.msg(res.msg, {icon: 2, audio:'1'});
                }
            },
            error: function() {
                notice.destroy();
                notice.msg('服务器错误', {icon: 2, audio:'1'});
            }
        });
        return false;
    });
});
</script>
</body>
</html>
