<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href="/favicon.ico" rel="icon">
    <title>{$title}</title>
    <meta name="keywords" content="{$keywords}"/>
    <meta name="description" content="{$description}"/>
    <link rel="stylesheet" href="{__LIBS__}layui/css/layui.css"/>
    <link rel="stylesheet" href="{__MODULE__}admin.css?v=318"/>
    <link rel="stylesheet" href="{__CSS__}sf-style.css"/>
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body class="page-no-scroll">

<div class="layui-layout layui-layout-admin">
    <!-- 头部 -->
    <div class="layui-header">
        <div class="layui-logo">
            <img src="{__IMG__}logo.png"/>
            <cite> {:conf('title')}</cite>
        </div>
        <ul class="layui-nav layui-layout-left">
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="flexible" title="侧边伸缩"><i class="layui-icon layui-icon-shrink-right"></i></a>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="refresh" title="刷新"><i class="layui-icon layui-icon-refresh-3"></i></a>
            </li>
        </ul>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="note" title="便签"><i class="layui-icon layui-icon-note"></i></a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect>
                <a ew-event="fullScreen" title="全屏"><i class="layui-icon layui-icon-screen-full"></i></a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect>
                <a ew-event="lockScreen" title="锁屏"><i class="layui-icon layui-icon-password"></i></a>
            </li>


            <li class="layui-nav-item" lay-unselect>
                <a>
                    <img src="{__IMG__}logo.png" class="layui-nav-img">
                    <cite>更多</cite>
                </a>
                <dl class="layui-nav-child">
                    {php}
                    foreach(explode("\n", conf('kfqq')) as $res){
                    $item = explode('|',$res);
                    echo '
                    <dd lay-unselect>
                        <a href="'.$item[0].'" target="_blank">'.$item[1].'</a>
                    </dd>';
                    }
                    {/php}
                    <dd lay-unselect>
                        <a href="{:conf('qq_group')}" target="_blank">加入售后群</a>
                    </dd>
                </dl>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="theme" title="主题"><i class="layui-icon layui-icon-more-vertical"></i></a>
            </li>

        </ul>
    </div>

    <!-- 侧边栏 -->
    <div class="layui-side">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree arrow2" lay-filter="admin-side-nav" lay-accordion="true"
                lay-shrink="_all">
                <li class="layui-nav-item">
                    <a lay-href="{:url('/Index/dashboard')}"><i class="layui-icon layui-icon-home"></i>&emsp;<cite>平台首页</cite></a>
                </li>
                <li class="layui-nav-item">
                    <a lay-filter="SF_DownloadSubmit" lay-submit><i class="layui-icon layui-icon-download-circle"></i>&emsp;<cite>源码下载</cite></a>
                </li>
                <li class="layui-nav-item">
                    <a href="/user.php" target="_blank"><i class="layui-icon layui-icon-user"></i>&emsp;<cite>登录后台</cite></a>
                </li>
            </ul>
        </div>
    </div>

    <!-- 主体部分 -->
    <div class="layui-body"></div>
    <!-- 底部 -->
    <div class="layui-footer layui-text">
        {:conf('foot')}
        <span class="pull-right">{:conf('ICP')}</span>
    </div>
</div>

<!-- 加载动画 -->
<div class="page-loading">
    <div class="signal-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<script type="text/javascript" src="{__LIBS__}layui/layui.js"></script>
<script type="text/javascript" src="{__JS__}common.js?v=318"></script>
<script>
    layui.config({
        closeFooter: false,
    });
    layui.use(['index','form','admin','notice'], function () {
        var $ = layui.jquery;
        var index = layui.index;
        var form = layui.form;
        var admin = layui.admin;
        var notice = layui.notice;

        // 默认加载主页
        index.loadHome({
            menuPath: '{:url("/Index/dashboard")}',
            menuName: '<i class="layui-icon layui-icon-home"></i>'
        });

        form.on('submit(SF_DownloadSubmit)', function (info) {
            parent.layui.admin.open({
                type: 2,
                title: '源码下载',
                shade: .1,
                area: ['600px','460px'],
                content: '{:url("/Index/download")}'
            });
        });

    });
</script>
</body>
</html>
