{include file="index/header"}
{$background_image|raw}
<div class="layui-row layui-col-space20">
    <div class="layui-col-sm6">
        <div class="vp-card" id="divLoading">
            <h2 class="vp-card-title">{:t('home.auth_query')}</h2>
            <form class="layui-form" id="queryAuthForm">
                <div class="layui-form-item">
                    <label class="vp-label">{:t('home.select_app')}</label>
                    <select name="appid" lay-filter="app" lay-search lay-verify="required">
                        <option value="">{:t('home.select_app_placeholder')}</option>
                        {volist name="app_list.data.data" id="res"}
                        <option value="{$res.id}">{$res.name}</option>
                        {/volist}
                    </select>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">{:t('home.query_content')}</label>
                    <input type="text" name="auth_info" placeholder="{:t('home.query_content_placeholder')}" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">{:t('home.query_type')}</label>
                    <div class="vp-query-types">
                        <input type="radio" name="query_type" value="auth" title="{:t('home.authorization')}" checked>
                        <input type="radio" name="query_type" value="user" title="{:t('home.agent')}">
                        <input type="radio" name="query_type" value="pay" title="{:t('menu.payment')}">
                    </div>
                </div>
                <div id="introduce" class="vp-introduce" style="display:none">
                    <div id="introduceContent"></div>
                </div>
                <div class="vp-form-actions">
                    <button type="button" class="vp-btn vp-btn-brand" lay-filter="SF_QueryAuth" lay-submit>{:t('home.query')}</button>
                    <button type="button" class="vp-btn vp-btn-ghost" id="SF_QueryAuth_Reset">{:t('home.reset')}</button>
                </div>
            </form>
        </div>
    </div>
    <div class="layui-col-sm6">
        <div class="vp-card">
            <h2 class="vp-card-title">{:t('registration.page_title')}</h2>
            <form class="layui-form" id="registerForm">
                <div class="layui-form-item">
                    <label class="vp-label">{:t('home.select_app')}</label>
                    <select name="appid" lay-filter="register_app" lay-search lay-verify="required">
                        <option value="">{:t('home.select_app_placeholder')}</option>
                        {volist name="app_list.data.data" id="res"}
                        <option value="{$res.id}">{$res.name}</option>
                        {/volist}
                    </select>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">{:t('registration.username')}</label>
                    <input type="text" name="username" placeholder="{:t('registration.username_placeholder')}" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">{:t('registration.password')}</label>
                    <input type="password" name="password" placeholder="{:t('registration.password_placeholder')}" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">{:t('registration.confirm_password')}</label>
                    <input type="password" name="confirmPassword" placeholder="{:t('registration.confirm_password_placeholder')}" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">{:t('registration.qq')}</label>
                    <input type="number" name="qq" placeholder="{:t('registration.qq_placeholder')}" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">{:t('registration.email')}</label>
                    <input type="text" name="email" placeholder="{:t('registration.email_placeholder')}" class="layui-input" lay-verify="required"/>
                </div>
                <div class="layui-form-item">
                    <label class="vp-label">{:t('registration.email_code')}</label>
                    <div style="display:flex;gap:10px;align-items:center;">
                        <input type="text" name="code" inputmode="numeric" maxlength="6" placeholder="{:t('registration.email_code_placeholder')}" class="layui-input" lay-verify="required" style="flex:1;"/>
                        <button type="button" class="vp-btn vp-btn-ghost" id="SF_Send_Reg_Code" style="white-space:nowrap;">{:t('registration.send_code')}</button>
                    </div>
                </div>
                <div class="vp-form-actions">
                    <button type="button" class="vp-btn vp-btn-brand" lay-filter="SF_RegisterSubmit" lay-submit>{:t('registration.submit')}</button>
                    <button type="button" class="vp-btn vp-btn-ghost" id="SF_Register_Reset">{:t('common.reset')}</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div></div>
<div class="vp-page-footer">
    <p>{:conf('foot')}</p>
    <p>{:conf('ICP')}</p>
</div>
<div id="myAudio1"></div>
{include file="index/footer"}
{$background_notice|raw}
{$background_music|raw}
<script>
layui.use(['layer', 'form', 'admin', 'element', 'notice'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var admin = layui.admin;
    var notice = layui.notice;

    function startMailCooldown(button) {
        var seconds = 60;
        button.prop('disabled', true).text(seconds + '{:t("password_recovery.retry_suffix")}');
        var timer = setInterval(function () {
            seconds--;
            if (seconds <= 0) {
                clearInterval(timer);
                button.prop('disabled', false).text('{:t("registration.send_code")}');
            } else {
                button.text(seconds + '{:t("password_recovery.retry_suffix")}');
            }
        }, 1000);
    }

    $('#SF_Send_Reg_Code').on('click', function () {
        var button = $(this);
        var email = $.trim($('#registerForm input[name="email"]').val());
        if (!email) {
            notice.msg('{:t("registration.enter_email")}', {icon: 2, audio:'1'});
            return;
        }
        button.prop('disabled', true);
        $.post('{:url("/Ajax/sendRegCode")}', {email: email}, function (res) {
            if (res.code == 0) {
                notice.msg(res.msg, {icon: 1, audio:'1'});
                startMailCooldown(button);
            } else {
                button.prop('disabled', false);
                notice.msg(res.msg, {icon: 2, audio:'1'});
            }
        }, 'json').fail(function () {
            button.prop('disabled', false);
            notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
        });
    });

    $("#SF_QueryAuth_Reset").click(function(){
        document.getElementById("queryAuthForm").reset();
        $('#introduce').hide();
        form.render('select');
        form.render('radio');
        notice.msg('{:t("home.query_reset")}', {icon: 1, audio:'1'});
    });
    $("#SF_Register_Reset").click(function(){
        document.getElementById("registerForm").reset();
        form.render('select');
        notice.msg('{:t("registration.reset_success")}', {icon: 1, audio:'1'});
    });

    form.on('select(app)', function (data) {
        if(data.value == ''){
            $('#introduce').hide();
            return;
        }
        $.ajax({
            type: "POST",
            url: '{:url("/Ajax/appInfo")}',
            data: {appid:data.value},
            dataType: "json",
            success: function(res) {
                if (res.code == 0) {
                    notice.msg('{:t("home.info_loaded")}', {icon: 1, audio:'1'});
                    $("#introduceContent").html(res.data.introduce || '{:t("home.no_introduction")}');
                    $("#introduce").show();
                    if(res.data.app_notice){
                        admin.open({
                            type: 1,
                            title: '{:t("home.app_announcement")}',
                            shade: .1,
                            content: '<div style="padding:20px;line-height:1.8;">'+res.data.app_notice+'</div>'
                        });
                    }
                } else {
                    notice.msg(res.msg, {icon: 2, audio:'1'});
                }
            },
            error: function() {
                notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
            }
        });
    });

    form.on('select(register_app)', function (data) {
        if (!data.value) return;
        $.ajax({
            type: "POST",
            url: '{:url("/Ajax/appInfo")}',
            data: {appid:data.value},
            dataType: "json",
            success: function(res) {
                if (res.code == 0 && res.data.register_notice) {
                    admin.open({
                        type: 1,
                        title: '{:t("registration.notice")}',
                        shade: .1,
                        content: '<div style="padding:20px;line-height:1.8;">'+res.data.register_notice+'</div>'
                    });
                }
            }
        });
    });

    form.on('submit(SF_QueryAuth)', function (data) {
        notice.msg('{:t("common.searching")}', {icon: 4, close: true});
        $.ajax({
            type: "POST",
            url: '{:url("/Ajax/queryAuth")}',
            data: data.field,
            dataType: "json",
            success: function(res) {
                notice.destroy();
                if (res.code == 0) {
                    if(res.data.status == 1){
                        notice.warning({
                            title: '{:t("home.query_notice")}', message: res.msg,
                            animateInside:true, position:'topCenter',
                            transitionOut:'flipOutX', displayMode:'2', audio:'1'
                        });
                    } else {
                        notice.success({
                            title: '{:t("home.query_notice")}', message: res.msg,
                            animateInside:true, position:'topCenter',
                            transitionOut:'flipOutX', displayMode:'2', audio:'1'
                        });
                    }
                } else {
                    notice.error({
                        title: '{:t("home.query_notice")}', message: res.msg,
                        animateInside:true, position:'topCenter',
                        transitionOut:'flipOutX', displayMode:'2', audio:'1'
                    });
                }
            },
            error: function() {
                notice.destroy();
                notice.error({
                    title: '{:t("home.query_notice")}', message: '{:t("common.server_error")}',
                    animateInside:true, position:'topCenter',
                    transitionOut:'flipOutX', displayMode:'2', audio:'1'
                });
            }
        });
        return false;
    });

    form.on('submit(SF_RegisterSubmit)', function (data) {
        notice.msg('{:t("registration.submitting")}', {icon: 4, close: true});
        $.ajax({
            type: "POST",
            url: '{:url("/Ajax/register")}',
            data: data.field,
            dataType: "json",
            success: function(res) {
                notice.destroy();
                if (res.code == 0) {
                    notice.success({
                        title: '{:t("registration.notice")}', message: res.msg,
                        animateInside:true, position:'topCenter',
                        transitionOut:'flipOutX', displayMode:'2', audio:'1'
                    });
                } else {
                    notice.error({
                        title: '{:t("registration.notice")}', message: res.msg,
                        animateInside:true, position:'topCenter',
                        transitionOut:'flipOutX', displayMode:'2', audio:'1'
                    });
                }
            },
            error: function() {
                notice.destroy();
                notice.error({
                    title: '{:t("registration.notice")}', message: '{:t("common.server_error")}',
                    animateInside:true, position:'topCenter',
                    transitionOut:'flipOutX', displayMode:'2', audio:'1'
                });
            }
        });
        return false;
    });
});
</script>
</body>
</html>
