{include file="/public/header"}
<style>
    .new-project-list-item{
        background-color: #fff;
        border: 1px dashed #dcdee2;
        border-radius: 4px;
        cursor: pointer;
        transition: all .2s;
        color: #515a6e;
    }
    .new-project-list-item:hover{
        border-color: #2d8cf0;
        color: #2d8cf0;
        box-shadow: 0 2px 10px rgb(45, 139, 239);
    }
    /** 项目列表样式 */
    .project-list-item {
        background-color: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 4px;
        cursor: pointer;
        transition: all .2s;
    }

    .project-list-item:hover {
        box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
    }

    .project-list-item .project-list-item-cover {
        width: 100%;
        height: 220px;
        display: block;
        border-top-left-radius: 4px;
        border-top-right-radius: 4px;
    }

    .project-list-item-body {
        padding: 20px;
    }

    .project-list-item .project-list-item-body > h2 {
        font-size: 18px;
        color: #333;
        margin-bottom: 12px;
    }

    .project-list-item .project-list-item-text {
        height: 44px;
        overflow: hidden;
        margin-bottom: 12px;
    }

    .project-list-item .project-list-item-desc {
        position: relative;
    }

    .project-list-item .project-list-item-desc .time {
        color: #999;
        font-size: 12px;
    }

    .project-list-item .project-list-item-desc .ew-head-list {
        position: absolute;
        right: 0;
        top: 0;
    }

    .ew-head-list .ew-head-list-item {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid #fff;
        margin-left: -10px;
    }

    .ew-head-list .ew-head-list-item:first-child {
        margin-left: 0;
    }

    /** // 项目列表样式结束 */
    .mask{position:fixed;width:100%;height:100%;top:0;left:0;background:#000;opacity:0.8;filter:alpha(Opacity=80);-moz-opacity:0.8;z-index:999;display:none;}
    .loading{position:fixed;width:300px;left:50%;margin-left:-150px;top:200px;height:18px;border-radius:10px;background:#fff;z-index:9999;overflow:hidden;display:none;}

</style>
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body" style="padding-top: 20px;">
            <div class="layui-row layui-col-space30" id="demoCardList1">
            </div>
        </div>
    </div>
</div>
<script type="text/html" id="demoCardItem2">
    <div class="layui-col-md3">
        <a lay-filter="QH_InstallSubmit" class="new-project-list-item" style="height: 377px;display: flex;align-items: center;justify-content: center" lay-submit>
            <i class="layui-icon layui-icon-addition"></i>&nbsp;{:t('addon_ui.add_plugin')}

<script type="text/html" id="demoCardItem1">
    <div class="layui-col-md3">
        <div class="project-list-item">
            <img class="project-list-item-cover" src="{{d.img?d.img:'{__IMG__}/logo.png'}}" style="object-fit: cover;object-position: 50% 20%;"/>

<script>
    layui.use(['layer', 'form', 'dataGrid', 'element', 'dropdown', 'notice', 'admin', 'upload'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var dataGrid = layui.dataGrid;
        var notice = layui.notice;
        var admin = layui.admin;
        var upload = layui.upload;
        var element = layui.element;

        function list(){
            notice.msg('{:t("common_ui.processing")}', {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: '{:url("/Addon/list")}',
                async: false,
                dataType: "json",
                success: function(data) {
                    notice.destroy();
                    notice.msg("{:t('common.list_success')}", {icon: 1});
                    dataGrid.render({
                        elem: '#demoCardList1',
                        templet: '#demoCardItem1',
                        data: data.data,
                        page: {limit: 7, limits: [8, 16, 24, 32, 40]}
                    });
                    $("#demoCardList1").prepend($("#demoCardItem2").html());
                },
                error: function() {
                    notice.destroy();
                    notice.msg("{:t('common.server_error')}", {icon: 2});
                }
            });
        }
        // 项目
        $(function (){
            list();
        });

        form.on('submit(QH_InstallSubmit)', function (data) {
            admin.open({
                title: '{:t("addon_ui.upload_install_package")}',
                type: 1,
                content: $('#QH_TbUpload').html(),
                success: function (){
                    upload.render({
                        elem: '#fileUpload',
                        url: '{:url("/Addon/local")}', //此处用的是第三方的 http 请求演示，实际使用时改成您自己的上传接口即可。
                        accept: 'file',
                        acceptMime: '*.*',//允许上传的文件类型
                        done: function(res){
                            if(res.code == 0){
                                layer.closeAll();
                                list();
                                notice.msg('{:t("addon_ui.install_success")}', {icon: 1});
                            }else{
                                notice.msg(res.msg, {icon: 2});
                            }
                        }
                    });
                }
            });
        });

        form.on('submit(QH_UninstallSubmit)', function (data) {
            layer.confirm('<div style="color: red">{:t("addon_ui.uninstall_warning")}</div><br><span style="color: red">{:t("addon_ui.backup_warning")}</span>', {
                skin: 'layui-layer-admin',
                icon: 3,
                shade: .1,
                btn: ['{:t("common.confirm")}','{:t("common.cancel")}'],
                title: '{:t("addon_ui.delete_confirm_title")}',
            }, function (i) {
                notice.msg('{:t("common_ui.processing")}', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url:'{:url("/Addon/unInstall")}',
                    data: data.field,
                    dataType: "json",
                    success: function(data) {
                        layer.closeAll();
                        notice.destroy();
                        if (data.code == 0) {
                            list();
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                        }else{
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg("{:t('common.server_error')}", {icon: 2, audio:'1'});
                    }
                });
            });
            return false;
        });
        dataGrid.on('item(demoCardList1)', function (obj) {
            admin.open({
                type: 1,
                title: '{:t("addon_ui.plugin_prefix")} - ' + obj.data.title,
                content: $('#QH_ConfigDialog').html(),
                success: function (layero, dIndex) {
                    form.val('QH_ConfigForm',{status:parseInt(obj.data.status)});
                    form.render('checkbox');
                    form.on('submit(QH_ConfigSubmit)', function (data) {
                        admin.open({
                            type: 2,
                            title: '{:t("addon_ui.plugin_prefix")} - '+obj.data.title+' {:t("addon_ui.settings")}',
                            maxmin: true,
                            area: ['500px','500px'],
                            content: '{:url("/Addon/config")}?name=' + obj.data.name,
                            success: function (layero, dIndex) {

                            }
                        });
                    });

                    form.on('submit(QH_UpdateSubmit)', function (data) {
                        admin.open({
                            title: '{:t("addon_ui.upload_update_package")}',
                            type: 1,
                            content: $('#QH_TbUpload').html(),
                            success: function (){
                                upload.render({
                                    elem: '#fileUpload',
                                    url: '{:url("/Addon/update")}', //此处用的是第三方的 http 请求演示，实际使用时改成您自己的上传接口即可。
                                    accept: 'file',
                                    data: {'name':obj.data.name},
                                    acceptMime: '*.*',//允许上传的文件类型
                                    done: function(res){
                                        if(res.code == 0){
                                            layer.closeAll();
                                            list();
                                            notice.msg('{:t("addon_ui.update_success")}', {icon: 1});
                                        }else{
                                            notice.msg(res.msg, {icon: 2});
                                        }
                                    }
                                });
                            }
                        });
                    });

                    form.on('submit(QH_DeleteSubmit)', function (data) {
                        admin.open({
                            type: 1,
                            icon: 3,
                            title: '{:t("addon_ui.plugin_prefix")} - '+obj.data.title+' {:t("addon_ui.uninstall")}',
                            shade: .1,
                            content: $("#QH_DeleteDialog").html(),
                            success: function (layero, dIndex) {
                                form.render('checkbox');
                                $("#addon_name").text(obj.data.name);
                                $("input[name='name']").val(obj.data.name);
                            }
                        });
                    });

                    form.on('switch(QH_Status)', function (data) {
                        notice.msg('{:t("common_ui.processing")}', {icon: 4, close: true});
                        $.ajax({
                            type: "POST",
                            url:'{:url("/Addon/status")}',
                            data: {name:obj.data.name,action:data.elem.checked ? 'enable' : 'disable'},
                            dataType: "json",
                            success: function(data) {
                                notice.destroy();
                                if (data.code == 0) {
                                    list();
                                    notice.msg(data.msg, {icon: 1, audio:'1'});
                                }else{
                                    notice.msg(data.msg, {icon: 2, audio:'1'});
                                }
                            },
                            error: function() {
                                notice.destroy();
                                notice.msg("{:t('common.server_error')}", {icon: 2, audio:'1'});
                            }
                        });
                    });
                    $(layero).children('.layui-layer-content').css('overflow', 'visible');
                }
            });
        });
    });
</script>
