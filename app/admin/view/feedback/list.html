{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('feedback.content')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('feedback.search_by_id_or_title')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status">
                                <option value="">{:t('feedback.all_statuses')}</option>
                                <option value="0">{:t('feedback.status_pending')}</option>
                                <option value="1">{:t('feedback.status_accepted')}</option>
                                <option value="2">{:t('feedback.status_rejected')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                    </div>
                </div>
            </form>
            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>

<script type="text/html" id="SF_TbState">
    {{# if(d.status == 0) { }}
    <span class="layui-badge layui-badge-orange">{:t('feedback.status_pending')}</span>
    {{# } else if(d.status == 1) { }}
    <span class="layui-badge layui-badge-green">{:t('feedback.status_accepted')}</span>
    {{# } else if(d.status == 2) { }}
    <span class="layui-badge layui-badge-red">{:t('feedback.status_rejected')}</span>
    {{# } }}
</script>

<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-normal layui-btn-sm" lay-event="handle"><i class="layui-icon layui-icon-edit"></i>{:t('feedback.handle')}</a>
</script>

<script type="text/html" id="SF_HandleDialog">
    <form id="SF_HandleForm" lay-filter="SF_HandleForm" class="layui-form model-form">
        <input name="id" type="hidden"/>
        <div class="layui-form-item">
            <label class="layui-form-label">{:t('feedback.submit_user')}</label>
            <div class="layui-input-block">
                <input name="username" class="layui-input" readonly disabled/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:t('feedback.title')}</label>
            <div class="layui-input-block">
                <input name="title" class="layui-input" readonly disabled/>
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">{:t('feedback.content')}</label>
            <div class="layui-input-block">
                <textarea name="content" class="layui-textarea" style="height:120px" readonly disabled></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">{:t('feedback.handle_status')}</label>
            <div class="layui-input-block">
                <select name="status" lay-verify="required">
                    <option value="0">{:t('feedback.status_pending')}</option>
                    <option value="1">{:t('feedback.status_accepted')}</option>
                    <option value="2">{:t('feedback.status_rejected')}</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">{:t('feedback.reply')}</label>
            <div class="layui-input-block">
                <textarea name="reply" class="layui-textarea" style="height:100px" placeholder="{:t('feedback.reply_placeholder')}"></textarea>
            </div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="SF_HandleSubmit" lay-submit>{:t('feedback.save_handle')}</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">{:t('common.cancel')}</button>
        </div>
    </form>
</script>

{include file="/public/footer"}
<script>
    layui.use(['layer', 'form', 'table', 'admin', 'notice'], function () {
        var $ = layui.jquery;
        var form = layui.form;
        var table = layui.table;
        var admin = layui.admin;
        var notice = layui.notice;

        var insTb = table.render({
            elem: '#SF_Table',
            url: '{:url("/Feedback/list")}',
            method: 'post',
            page: true,
            skin: 'line',
            size: 'lg',
            cellMinWidth: 100,
            request: {
                pageName: 'current_page',
                limitName: 'limit'
            },
            parseData: function(res){
                var pageData = res.data && res.data.data ? res.data.data : {total: 0, data: []};
                return {
                    "code": res.code,
                    "msg": res.msg,
                    "count": pageData.total || 0,
                    "data": pageData.data || []
                };
            },
            cols: [[
                {field: 'id', title: '{:t("common.id")}', sort: true, width: 80},
                {field: 'username', title: '{:t("feedback.submit_user")}', sort: true, width: 130},
                {field: 'title', title: '{:t("feedback.title")}', sort: true, minWidth: 180},
                {field: 'content', title: '{:t("feedback.content")}', minWidth: 200, templet: function(d){
                    return (d.content || '').length > 60 ? d.content.substring(0, 60) + '...' : (d.content || '');
                }},
                {field: 'reply', title: '{:t("feedback.reply")}', minWidth: 150, templet: function(d){
                    return d.reply ? ((d.reply.length > 40 ? d.reply.substring(0, 40) + '...' : d.reply)) : '<span style="color:#999">{:t("feedback.no_reply_short")}</span>';
                }},
                {field: 'status', title: '{:t("common.status")}', templet: '#SF_TbState', sort: true, width: 100},
                {field: 'created_at', title: '{:t("feedback.submit_time")}', sort: true, width: 170},
                {field: 'updated_at', title: '{:t("feedback.handle_time")}', sort: true, width: 170},
                {title: '{:t("common.operation")}', toolbar: '#SF_TbBar', align: 'center', width: 100}
            ]]
        });

        form.on('submit(SF_TbSearch)', function (data) {
            insTb.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        window.refreshTab = function () {
            insTb.reload({page: {curr: 1}});
        };

        table.on('tool(SF_Table)', function (obj) {
            if (obj.event === 'handle') {
                showHandleModel(obj.data);
            }
        });

        function showHandleModel(mData) {
            admin.popupRight({
                type: 1,
                title: '{:t("feedback.handle_dialog_title")} - ' + mData.title,
                content: $('#SF_HandleDialog').html(),
                success: function (layero) {
                    form.val('SF_HandleForm', {
                        id: mData.id,
                        username: mData.username || '',
                        title: mData.title,
                        content: mData.content,
                        status: mData.status !== undefined ? mData.status : 0,
                        reply: mData.reply || ''
                    });
                    form.render();

                    form.on('submit(SF_HandleSubmit)', function (data) {
                        notice.msg('{:t("feedback.processing")}', {icon: 4, close: true});
                        $.ajax({
                            type: "POST",
                            url: '{:url("/Feedback/handle")}',
                            data: data.field,
                            dataType: "json",
                            success: function(data) {
                                notice.destroy();
                                if (data.code == 0) {
                                    insTb.reload({page: {curr: 1}});
                                    notice.msg(data.msg, {icon: 1, audio:'1'});
                                    if (parent && parent.SF_updateNotifyBadge) {
                                        parent.SF_updateNotifyBadge();
                                    }
                                } else {
                                    notice.msg(data.msg, {icon: 2, audio:'1'});
                                }
                            },
                            error: function() {
                                notice.destroy();
                                notice.msg('{:t("common.server_error")}', {icon: 2, audio:'1'});
                            }
                        });
                        return false;
                    });

                    $(layero).children('.layui-layer-content').css('overflow', 'visible');
                }
            });
        }
    });
</script>
