
<!DOCTYPE html>
<html lang="{:t('common.lang_code')}">
<head>
    <meta charset="utf-8">
    <title>{$title}|{:t('login.login_backend')}</title>
    <meta name="keywords" content="{$keywords}"/>
    <meta name="description" content="{$description}"/>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="{__LIBS__}layui/css/layui.css"/>
    <link rel="stylesheet" href="{__MODULE__}admin.css?v=318"/>
    <style>
        html{
            height: 100%;
        }
        .template-login-lang {
            position: absolute;
            top: 18px;
            right: 24px;
            z-index: 3;
            color: #fff;
        }
        .login-wrapper {
            max-width: 420px;
            padding: 20px;
            margin: 0 auto;
            position: relative;
            box-sizing: border-box;
            z-index: 2;
        }

        .login-wrapper > .layui-form {
            padding: 25px 30px;
            background-color: #fff;
            box-shadow: 0 3px 6px -1px rgba(0, 0, 0, 0.19);
            box-sizing: border-box;
            border-radius: 4px;
        }

        .login-wrapper > .layui-form > h2 {
            color: #333;
            font-size: 18px;
            text-align: center;
            margin-bottom: 25px;
        }

        .login-wrapper > .layui-form > .layui-form-item {
            margin-bottom: 25px;
            position: relative;
        }

        .login-wrapper > .layui-form > .layui-form-item:last-child {
            margin-bottom: 0;
        }

        .login-wrapper > .layui-form > .layui-form-item > .layui-input {
            height: 40px;
            line-height: 1.5;
            border-radius: 4px !important;
        }

        .login-wrapper .layui-input-icon-group > .layui-input {
            padding-left: 40px;
        }

        .login-wrapper .layui-input-icon-group > .layui-icon {
            width: 40px;
            height: 40px;
            line-height: 40px;
            font-size: 18px;
            color: #909399;
            position: absolute;
            left: 0;
            top: 0;
            text-align: center;
        }

        .login-wrapper > .layui-form > .layui-form-item.login-captcha-group {
            padding-right: 135px;
        }

        .login-wrapper > .layui-form > .layui-form-item.login-captcha-group > .login-captcha {
            height: 46px;
            width: 120px;
            cursor: pointer;
            box-sizing: border-box;
            border: 1px solid #e6e6e6;
            border-radius: 4px !important;
            position: absolute;
            right: 0;
            top: 0;
        }

        .login-wrapper > .layui-form > .layui-form-item > .layui-form-checkbox {
            margin: 0 !important;
            padding-left: 25px;
        }

        .login-wrapper > .layui-form > .layui-form-item > .layui-form-checkbox > .layui-icon {
            width: 15px !important;
            height: 15px !important;
        }

        .login-wrapper > .layui-form .qh {
            display: inline-block;
            margin-bottom: 0;
            font-weight: 400;
            text-align: center;
            vertical-align: middle;
            touch-action: manipulation;
            cursor: pointer;
            background-image: none;
            border: 1px solid transparent;
            white-space: nowrap;
            user-select: none;
            height: 40px;
            padding: 0 15px;
            font-size: 16px;
            border-radius: 4px;
            transition: color .2s linear,background-color .2s linear,border .2s linear,box-shadow .2s linear;
            color: #fff;
            background-color: #fff;
            border-color: #dcdee2;
            line-height: 1.5;
            border-radius: 4px !important;
            background-color: #2d8cf0;
            border-color: #2d8cf0;
        }
        .login-wrapper > .layui-form .qh2 {
            display: inline-block;
            margin-bottom: 0;
            font-weight: 400;
            text-align: center;
            vertical-align: middle;
            touch-action: manipulation;
            cursor: pointer;
            background-image: none;
            border: 1px solid transparent;
            white-space: nowrap;
            user-select: none;
            height: 40px;
            padding: 0 15px;
            font-size: 16px;
            border-radius: 4px;
            transition: color .2s linear,background-color .2s linear,border .2s linear,box-shadow .2s linear;
            color: #000000;
            background-color: #fff;
            border-color: #dcdee2;
            line-height: 1.5;
            border-radius: 4px !important;
        }

        .login-wrapper > .layui-form > .layui-form-item.login-oauth-group > a > .layui-icon {
            font-size: 26px;
        }

        @media screen and (min-height: 550px) {
            .login-wrapper {
                margin: -250px auto 0;
                position: absolute;
                top: 50%;
                left: 0;
                right: 0;
                width: 100%;
            }
        }

        .layui-btn {
            background-color: #5FB878;
            border-color: #5FB878;
        }

        .layui-link {
            color: #5FB878 !important;
        }

        .layer-get-code > p {
            color: #666;
            font-size: 16px;
        }

        .layer-get-code > .lay-code-group > .layui-input {
            border-radius: 0;
            height: 46px;
            line-height: 46px;
            background-color: transparent;
            border-color: rgba(111, 121, 122, 0.3);
        }

        .layer-get-code > .lay-code-group > img {
            position: absolute;
            right: 0;
            top: 0;
            height: 46px;
            width: 120px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .logo {
            width: 60px !important;
            margin-top: 10px !important;
            margin-bottom: 10px !important;
            margin-left: 20px !important;
        }
        .title {
            font-size: 30px !important;
            font-weight: 550 !important;
            margin-left: 20px !important;
            color: #3492ed !important;
            display: inline-block !important;
            height: 60px !important;
            line-height: 60px !important;
            margin-top: 10px !important;
            position: absolute !important;
        }

        .desc {
            width: 100% !important;
            text-align: center !important;
            color: gray !important;
            height: 60px !important;
            line-height: 60px !important;
        }
        .page-account-other {
            margin: 24px 0;
            text-align: left;
        }
        .page-account-other img {
            width: 24px;
            margin-left: 16px;
            cursor: pointer;
            vertical-align: middle;
            opacity: .7;
            transition: all .2s ease-in-out;
        }

        .imgbj{
            width: auto;
            height: auto;
            /*opacity: 0.6;*/
            top: 0;
            left: 0;
            z-index: -1;
            position: fixed;
            background-size: cover;
        }
        .imgc{
            background-size: 100% 100%;
            background-repeat: repeat;
            top: 0;
            position: fixed;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

    </style>
</head>
<body>
<a href="javascript:QH_LANG.toggle();" title="{:t('common.language')}" class="template-login-lang">{:t('common.lang_toggle')}</a>
<div class="imgc"></div>
<img class="imgbj" src="{__IMG__}background.svg">
<div class="login-wrapper layui-anim layui-anim-scale layui-hide">
    <form class="layui-form layui-card-body" id="divLoading"
    style="padding: 28px 15px;box-sizing: border-box;min-height: 126px;opacity: 0.95">
        <div class="layui-form-item">
            <img class="logo" src="{__IMG__}logo.png" />
            <div class="title">{:t('login.login_backend')}</div>
            <div class="desc">{:t('login.admin_subtitle')}</div>
        </div>
        <div class="layui-form-item layui-input-icon-group">
            <i class="layui-icon layui-icon-username"></i>
            <input class="layui-input" name="user" placeholder="{:t('login.username_placeholder')}" autocomplete="off"
                   lay-verType="tips" lay-verify="required" >
        </div>
        <div class="layui-form-item layui-input-icon-group">
            <i class="layui-icon layui-icon-password"></i>
            <input class="layui-input" name="pass" placeholder="{:t('login.password_placeholder')}" type="password"
                   lay-verType="tips" lay-verify="required" >
        </div>
        <div class="layui-form-item">
            <input type="checkbox" name="remember" title="{:t('login.remember_me')}" lay-skin="primary" checked>
        </div>
        <div class="layui-form-item">
            <div id="captcha">
                <button type="button" class="layui-btn layui-btn-fluid qh" id="loginBtn">{:t('login.sign_in')}</button>
            </div>
        </div>
        {if condition="!empty($login_switch)"}
        <div class="layui-form-item page-account-other" style="font-size: 14px;">
            <span>{:t('login.other_login')}</span>
            {if in_array('qq', $login_switch)}<a id="qq_login"><img src="{__IMG__}qq.svg" alt="qq"></a>{/if}
            {if in_array('qrcode', $login_switch)}<a id="code"><img src="{__IMG__}code.svg" alt="{:t('login.qr_title')}"></a>{/if}&emsp;
        </div>
        {/if}
    </form>
</div>

<script>window.QH_I18N_LOCALE = "{:t('common.lang_code')}"; window.QH_I18N_MESSAGES = {:json_encode(app()->lang->get(), 271)};</script>
<script type="text/javascript" src="{__JS__}lang.js?v={__I18N_VERSION__}"></script>
<script type="text/javascript" src="{__LIBS__}layui/layui.js"></script>
<script type="text/javascript" src="{__JS__}common.js?v={__I18N_VERSION__}"></script>
<script type="text/javascript" src="{__JS__}qq-oauth.js?v=20261004_3"></script>
<script src="{__JS__}gt.js"></script>
<script>
    layui.use(['jquery', 'layer', 'form', 'admin', 'notice'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var admin = layui.admin;
        var notice = layui.notice;
        $('.login-wrapper').removeClass('layui-hide');
        {if in_array('qrcode', $login_switch)}
        $("#code").click(function(){
            admin.open({
                type: 2,
                title: t('login.admin_qr_title'),
                content: '/qrlogin/qrlogin.html?v=' + Date.now(),
                area: ['400px', '300px'],
                data: {type:'adminLogin'}
            });
        });
        {/if}
        {if $code != '' || $oauth_error != ''}
        var qqCallbackPayload = {$oauth_callback_json|raw};
        admin.btnLoading(' #loginBtn');
        admin.showLoading('#divLoading', 2, '.8');
        $.ajax({
            type: "post",
            url: "/api.php/Social/login",
            data: qqCallbackPayload,
            dataType: "json",
            success: function(data) {
                if (data.code == 0) {
                    notice.msg(t('login.redirecting_qq'), {icon: 4, close: true, audio:'1'});
                    setTimeout(function (){
                        notice.destroy();
                        location.href=data.data.url;
                    },1000)
                } else {
                    notice.error({
                        title: t('login.qh_tips'),
                        message: data.msg,
                        animateInside:true,
                        position:'topCenter',
                        transitionOut:'flipOutX',
                        transitionOutMobile: 'flipOutX',
                        displayMode:'2',
                        audio:'1'
                    });
                }
                admin.removeLoading('#divLoading', true, true);
                admin.btnLoading('#loginBtn', false);
            }, error: function () {
                notice.error({
                    title: t('login.qh_tips'),
                    message: t('common.server_error'),
                    animateInside:true,
                    position:'topCenter',
                    transitionOut:'flipOutX',
                    transitionOutMobile: 'flipOutX',
                    timeout:false,
                    displayMode:'2',
                    audio:'1'
                });
                admin.removeLoading('#divLoading', true, true);
                admin.btnLoading('#loginBtn', false);
                return false;
            }
        });
        {/if}
        {if in_array('qq', $login_switch)}
        function handleAdminQqOauthResult(data) {
            admin.removeLoading('#divLoading', true, true);
            admin.btnLoading(' #loginBtn', false);
            if (data && data.code == 0 && data.data && data.data.url) {
                notice.msg(data.msg || t('login.qq_success'), {icon:1});
                setTimeout(function(){ location.href = data.data.url; }, 500);
                return;
            }
            notice.error({title:t('login.qq_notice'), message:(data && data.msg) || t('login.qq_failed'), position:'topCenter'});
        }
        $("#qq_login").click(function(){
            admin.btnLoading(' #loginBtn');
            admin.showLoading('#divLoading', 2, '.8');
            QHQqOauth.start({
                url:'/api.php/Social/login',
                data:{userType:'admin'},
                onResult:handleAdminQqOauthResult,
                onError:function(message){
                    admin.removeLoading('#divLoading', true, true);
                    admin.btnLoading(' #loginBtn', false);
                    notice.error({title:t('login.qq_notice'), message:message, position:'topCenter'});
                }
            });
        });
        QHQqOauth.resume(handleAdminQqOauthResult, function(message){
            notice.error({title:t('login.qq_notice'), message:message, position:'topCenter'});
        });
        {/if}
        {eq name="captcha_open" value="1"}
        initGeetest4({
            captchaId: '{$captcha_id}',
            product: 'bind',
        }, function (gt) {
            window.gt = gt
            gt
                .appendTo("#captcha")
                .onSuccess(function (e) {
                    var username = $("input[name='user']").val();
                    var password = $("input[name='pass']").val();
                    var result = gt.getValidate();
                    result.username = username;
                    result.password = password;
                    admin.btnLoading('#loginBtn');
                    admin.showLoading('#divLoading', 2, '.8');
                    $.ajax({
                        type: "post",
                        url: "{:url('/Login/login')}",
                        data: result,
                        dataType: "json",
                        success: function(data) {
                            if (data.code == 0) {
                                notice.success({
                                    title: t('login.qh_tips'),
                                    message: data.msg,
                                    animateInside:true,
                                    position:'topCenter',
                                    transitionOut:'flipOutX',
                                    transitionOutMobile: 'flipOutX',
                                    displayMode:'2',
                                    audio:'1'
                                });
                                setTimeout(function (){
                                    location.href="{:url('/Index/index')}";
                                },2000)
                            } else {
                                notice.error({
                                    title: t('login.qh_tips'),
                                    message: data.msg,
                                    animateInside:true,
                                    position:'topCenter',
                                    transitionOut:'flipOutX',
                                    transitionOutMobile: 'flipOutX',
                                    displayMode:'2',
                                    audio:'1'
                                });
                            }
                            admin.removeLoading('#divLoading', true, true);
                            admin.btnLoading('#loginBtn', false);
                        }, error: function () {
                            notice.error({
                                title: t('login.qh_tips'),
                                message: t('common.server_error'),
                                animateInside:true,
                                position:'topCenter',
                                transitionOut:'flipOutX',
                                transitionOutMobile: 'flipOutX',
                                timeout:false,
                                displayMode:'2',
                                audio:'1'
                            });
                            admin.removeLoading('#divLoading', true, true);
                            admin.btnLoading('#loginBtn', false);
                            return false;
                        }
                    });
                });
            });

            $('#loginBtn').click(function () {
                var user = $("input[name='user']").val();
                var pass = $("input[name='pass']").val();
                if(!user){
                    notice.warning({
                        title: t('login.qh_tips'),
                        message: t('login.please_enter_username'),
                        animateInside:true,
                        position:'topCenter',
                        transitionOut:'flipOutX',
                        transitionOutMobile: 'flipOutX',
                        displayMode:'2',
                        audio:'1'
                    });
                    return false;
                }
                if(!pass){
                    notice.warning({
                        title: t('login.qh_tips'),
                        message: t('login.please_enter_password'),
                        animateInside:true,
                        position:'topCenter',
                        transitionOut:'flipOutX',
                        transitionOutMobile: 'flipOutX',
                        displayMode:'2',
                        audio:'1'
                    });
                    return false;
                }
                gt.showBox();
            });
        {else/}
        $(' #loginBtn').click(function() {
            var user = $("input[name='user']").val();
            var pass = $("input[name='pass']").val();
            if(!user){
                notice.warning({
                    title: t('login.qh_tips'),
                    message: t('login.please_enter_username'),
                    animateInside:true,
                    position:'topCenter',
                    transitionOut:'flipOutX',
                    transitionOutMobile: 'flipOutX',
                    displayMode:'2',
                    audio:'1'
                });
                return false;
            }
            if(!pass){
                notice.warning({
                    title: t('login.qh_tips'),
                    message: t('login.please_enter_password'),
                    animateInside:true,
                    position:'topCenter',
                    transitionOut:'flipOutX',
                    transitionOutMobile: 'flipOutX',
                    displayMode:'2',
                    audio:'1'
                });
                return false;
            }
            admin.btnLoading(' #loginBtn');
            admin.showLoading('#divLoading', 2, '.8');
            $.ajax({
                type: "post",
                url: "{:url('/Login/login')}",
                data: {
                    "username": user,
                    "password": pass,
                },
                dataType: "json",
                success: function(data) {
                    if (data.code == 0) {
                        notice.success({
                            title: t('login.qh_tips'),
                            message: data.msg,
                            animateInside:true,
                            position:'topCenter',
                            transitionOut:'flipOutX',
                            transitionOutMobile: 'flipOutX',
                            displayMode:'2',
                            audio:'1'
                        });
                        setTimeout(function (){
                            location.href="{:url('/Index/index')}";
                        },2000)
                    } else {
                        notice.error({
                            title: t('login.qh_tips'),
                            message: data.msg,
                            animateInside:true,
                            position:'topCenter',
                            transitionOut:'flipOutX',
                            transitionOutMobile: 'flipOutX',
                            displayMode:'2',
                            audio:'1'
                        });
                    }
                    admin.removeLoading('#divLoading', true, true);
                    admin.btnLoading(' #loginBtn', false);
                }, error: function () {
                    notice.error({
                        title: t('login.qh_tips'),
                        message: t('common.server_error'),
                        animateInside:true,
                        position:'topCenter',
                        transitionOut:'flipOutX',
                        transitionOutMobile: 'flipOutX',
                        timeout:false,
                        displayMode:'2',
                        audio:'1'
                    });
                    admin.removeLoading('#divLoading', true, true);
                    admin.btnLoading(' #loginBtn', false);
                    return false;
                }
            });
        });
        {/eq}
    });
</script>
</body>
</html>
