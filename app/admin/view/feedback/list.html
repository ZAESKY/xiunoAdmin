{include file="/public/header"}
<style>
    .layui-layer-content img { max-width: 60% !important; height: auto !important; vertical-align: middle; }
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.search')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('feedback.search_by_id_or_title')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status">
                                <option value="">{:t('common.all')}</option>
                                <option value="0">{:t('feedback.status_pending')}</option>
                                <option value="1">{:t('feedback.status_accepted')}</option>
                                <option value="2">{:t('feedback.status_rejected')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('accounting.type')}</label>
                        <div class="layui-input-inline">
                            <select name="type">
                                <option value="">{:t('feedback.all_types')}</option>
                                <option value="bug">{:t('feedback.type_bug')}</option>
                                <option value="feature">{:t('feedback.type_feature')}</option>
                                <option value="other">{:t('feedback.type_other')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;
                        <button class="layui-btn icon-btn" lay-filter="QH_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                    </div>
                </div>
            </form>
            <table id="QH_Table" lay-filter="QH_Table"></table>
        </div>
    </div>
</div>

<script type="text/html" id="QH_TbState">
    {{# if(d.status == 0) { }}
    <span class="layui-badge layui-badge-orange">{:t('feedback.status_pending')}</span>
    {{# } else if(d.status == 1) { }}
    <span class="layui-badge layui-badge-green">{:t('feedback.status_accepted')}</span>
    {{# } else if(d.status == 2) { }}
    <span class="layui-badge layui-badge-red">{:t('feedback.status_rejected')}</span>
    {{# } }}
</script>

<script type="text/html" id="QH_TbBar">
    <a class="layui-btn layui-btn-sm layui-btn-primary" lay-event="view">{:t('common.view')}</a>
</script>

{include file="/public/footer"}
<script>
    layui.use(['layer', 'form', 'table', 'admin', 'notice', 'layedit'], function () {
        var $ = layui.jquery;
        var form = layui.form;
        var table = layui.table;
        var admin = layui.admin;
        var notice = layui.notice;
        var layedit = layui.layedit;

        function decodeHtml(v) {
            var t = document.createElement('textarea');
            t.innerHTML = v || '';
            return t.value;
        }
        function escapeHtml(v) {
            return String(v || '').replace(/[&<>"']/g, function(s){
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
            });
        }

        var insTb = table.render({
            elem: '#QH_Table',
            url: '{:url("/Feedback/list")}',
            method: 'post', page: true, skin: 'line', size: 'lg',
            request: { pageName: 'current_page', limitName: 'limit' },
            parseData: function(res){
                var pageData = res.data && res.data.data ? res.data.data : {total: 0, data: []};
                return { "code": res.code, "msg": res.msg, "count": pageData.total || 0, "data": pageData.data || [] };
            },
            cols: [[
                {field: 'id', title: 'ID', sort: true, width: 80},
                {field: 'username', title: '{:t("feedback.submit_user")}', sort: true, width: 130},
                {field: 'type', title: '{:t("accounting.type")}', sort: true, width: 100, templet: function(d){
                    var m = {bug:'<span class="layui-badge layui-badge-red">BUG</span>', feature:'<span class="layui-badge layui-badge-blue">{:t('feedback.type_feature_short')}</span>', other:'<span class="layui-badge layui-badge-gray">{:t('feedback.type_other')}</span>'};
                    return m[d.type] || d.type;
                }},
                {field: 'title', title: '{:t("feedback.title")}', sort: true, minWidth: 180},
                {field: 'reply', title: '{:t("feedback.reply")}', minWidth: 150, templet: function(d){
                    var t = (d.reply||'').replace(/<[^>]+>/g,'');
                    return t ? (t.length > 40 ? t.substring(0,40)+'...' : t) : '<span style="color:#999">{:t('feedback.no_reply_short')}</span>';
                }},
                {field: 'status', title: '{:t("common.status")}', templet: '#QH_TbState', sort: true, width: 100},
                {field: 'created_at', title: '{:t("feedback.submit_time")}', sort: true, width: 170},
                {field: 'updated_at', title: '{:t("feedback.handle_time")}', sort: true, width: 170},
                {title: '{:t("common.operation")}', toolbar: '#QH_TbBar', align: 'center', width: 110}
            ]]
        });

        form.on('submit(QH_TbSearch)', function (data) {
            insTb.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        table.on('tool(QH_Table)', function (obj) {
            if (obj.event === 'view') {
                showView(obj.data);
            }
        });

        function showView(d) {
            var typeMap = {bug:'{:t("feedback.type_bug")}', feature:'{:t("feedback.type_feature")}', other:'{:t("feedback.type_other")}'};
            var statusMap = {0:'<span class="layui-badge layui-badge-orange" style="float:right;">{:t('common_ui.status_pending')}</span>',
                             1:'<span class="layui-badge layui-badge-green" style="float:right;">{:t('feedback.status_accepted')}</span>',
                             2:'<span class="layui-badge layui-badge-red" style="float:right;">{:t('feedback.status_rejected')}</span>'};
            var replyId = 'QH_Reply_' + d.id;
            var html = '<div style="padding:16px;max-height:700px;overflow:auto;">'+
                '<div style="border:1px solid #e6e6e6;border-radius:6px;padding:14px 16px;margin-bottom:12px;background:#fafafa;">'+
                '<div style="margin-bottom:8px;font-size:13px;color:#999;">'+
                '<span>'+escapeHtml(d.username||'')+'</span> '+
                '<span class="layui-badge layui-badge-blue" style="margin-left:8px;">'+(typeMap[d.type]||d.type||'')+'</span> '+
                '<span style="margin-left:8px;">'+escapeHtml(d.created_at||'')+'</span>'+
                (statusMap[d.status]||'')+
                '</div>'+
                '<div style="font-size:15px;font-weight:bold;margin-bottom:8px;">'+escapeHtml(d.title||'')+'</div>'+
                '<div style="font-size:14px;line-height:1.8;word-break:break-all;">'+decodeHtml(d.content||'')+'</div>'+
                '</div>';
            if (d.reply) {
                html += '<div style="border:1px solid #d2e8c8;border-radius:6px;padding:14px 16px;background:#f0f9eb;margin-bottom:12px;">'+
                    '<div style="margin-bottom:6px;font-size:13px;color:#67c23a;"><i class="layui-icon layui-icon-user"></i> {:t("feedback.admin_reply")} '+
                    '<span style="margin-left:8px;">'+escapeHtml(d.updated_at||'')+'</span></div>'+
                    '<div style="font-size:14px;line-height:1.8;word-break:break-all;color:#333;">'+decodeHtml(d.reply||'')+'</div></div>';
            }
            html += '<div class="layui-form" style="margin-top:8px;">'+
                '<div class="layui-form-item">'+
                '<label class="layui-form-label" style="width:80px;padding-left:0;text-align:left;">{:t("feedback.handle_status")}</label>'+
                '<div class="layui-input-block">'+
                '<select id="QH_FeedbackStatus">'+
                '<option value="0"'+(parseInt(d.status, 10) === 0 ? ' selected' : '')+'>{:t("feedback.status_pending")}</option>'+
                '<option value="1"'+(parseInt(d.status, 10) === 1 ? ' selected' : '')+'>{:t("feedback.status_accepted")}</option>'+
                '<option value="2"'+(parseInt(d.status, 10) === 2 ? ' selected' : '')+'>{:t("feedback.status_rejected")}</option>'+
                '</select></div></div></div>'+
                '<div style="font-size:13px;color:#666;margin-bottom:6px;">{:t("feedback.reply")}</div>'+
                '<textarea id="'+replyId+'" style="display:none;"></textarea>'+
                '<div style="text-align:right;margin-top:10px;"><button class="layui-btn layui-btn-sm" id="QH_ReplyBtn">{:t("feedback.save_handle")}</button></div>'+
                '</div>';
            layer.open({
                type: 1, title: '{:t("feedback.detail_title")}', area: ['760px', '680px'], content: html,
                success: function(layero, index) {
                    form.render('select');
                    var replyLayedit = layedit.build(replyId, {
                        height: 150,
                        uploadImage: { url: '{:url("/Feedback/uploadImage")}', type: 'post' }
                    });
                    setTimeout(function(){
                        var ifr = $('#LAY_layedit_' + replyLayedit)[0];
                        if (ifr && ifr.contentWindow) {
                            var doc = ifr.contentWindow.document;
                            var s = doc.createElement('style');
                            s.innerHTML = 'img{max-width:60%!important;height:auto!important;}';
                            doc.head.appendChild(s);
                        }
                    }, 500);
                    $(layero).find('#QH_ReplyBtn').on('click', function(){
                        var $button = $(this);
                        if ($button.prop('disabled')) return;
                        var reply = layedit.getContent(replyLayedit);
                        var status = parseInt($(layero).find('#QH_FeedbackStatus').val(), 10);
                        var hasImg = /<img[^>]+>/i.test(reply || '');
                        var hasText = (reply || '').replace(/<[^>]+>/g, '').trim() !== '';
                        if (!hasImg && !hasText) {
                            notice.msg('{:t("feedback.reply_required")}', {icon: 3}); return;
                        }
                        if ([0, 1, 2].indexOf(status) === -1) {
                            notice.msg('{:t("feedback.invalid_status")}', {icon: 3}); return;
                        }
                        var originalButtonHtml = $button.html();
                        $button.prop('disabled', true).addClass('layui-btn-disabled').html('{:t("feedback.processing")}');
                        notice.msg('{:t("feedback.processing")}', {icon: 4, close: true});
                        $.ajax({
                            type: 'POST', url: '{:url("/Feedback/handle")}',
                            data: {id: d.id, reply: reply, status: status}, dataType: 'json',
                            success: function(res) {
                                notice.destroy();
                                if (res.code == 0) {
                                    layer.close(index);
                                    insTb.reload({page: {curr: 1}});
                                    notice.msg(res.msg, {icon: 1, audio:'1'});
                                    if (parent && parent.QH_updateNotifyBadge) parent.QH_updateNotifyBadge();
                                } else { notice.msg(res.msg, {icon: 2}); }
                            },
                            error: function() { notice.destroy(); notice.msg('{:t("common.server_error")}', {icon: 2}); },
                            complete: function() {
                                $button.prop('disabled', false).removeClass('layui-btn-disabled').html(originalButtonHtml);
                            }
                        });
                    });
                }
            });
        }
    });
</script>
