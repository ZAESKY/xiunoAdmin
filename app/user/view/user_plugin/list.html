{include file="/public/header"}
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.search')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('plugin_record.search_plugin_slug')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">{:t('feedback.all_statuses')}</option>
                                <option value="0">{:t('plugin_ui.pending_review')}</option>
                                <option value="1">{:t('user_home.published')}</option>
                                <option value="2">{:t('plugin_ui.off_shelf')}</option>
                                <option value="3">{:t('plugin_ui.review_rejected')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">
                        <button class="layui-btn icon-btn" lay-filter="QH_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                    </div>
                </div>
            </form>
            <table id="QH_Table" lay-filter="QH_Table"></table>
        </div>
    </div>
</div>

<style>
    #QH_Table + .layui-table-view td[data-off="true"] > .layui-table-cell {
        height: 40px;
        overflow: hidden;
        white-space: nowrap;
    }
    .plugin-table-actions {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
    }
</style>

<script type="text/html" id="QH_TbBar">
    <div class="plugin-table-actions">
    {{# if(d.price > 0 && d.status == 1){ }}
    <a class="layui-btn layui-btn-sm layui-btn-warm" lay-event="purchases"><i class="layui-icon layui-icon-user"></i>{:t('plugin_ui.purchase_records')}</a>
    {{# } }}
    {{# if(d.status != 1){ }}
    <a class="layui-btn layui-btn-sm layui-btn-normal" lay-event="edit"><i class="layui-icon">&#xe642;</i>{:t('common_ui.edit')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon">&#xe640;</i>{:t('common.delete')}</a>
    {{# } else { }}
    <a class="layui-btn layui-btn-sm layui-btn-normal" lay-event="edit"><i class="layui-icon">&#xe642;</i>{:t('common_ui.edit')}</a>
    {{# } }}
    </div>
</script>

{include file="/public/footer"}
<script>
layui.use(['layer', 'form', 'table', 'notice'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var table = layui.table;
    var notice = layui.notice;

    var insTb = table.render({
        elem: '#QH_Table',
        url: '{:url("/UserPlugin/list")}',
        method: 'post',
        page: true,
        skin: 'line',
        size: 'lg',
        cellMinWidth: 100,
        request: { pageName: 'current_page', limitName: 'limit' },
        parseData: function(res){
            return {
                "code": res.code, "msg": res.msg,
                "count": res.data.data.total, "data": res.data.data.data
            };
        },
        cols: [[
            {field: 'id', title: 'ID', sort: true, width: 80},
            {field: 'icon', title: '{:t("plugin_ui.icon")}', width: 80, templet: function(d){
                return '<img src="'+(d.icon || '/Assets/img/default-plugin.png')+'" style="width:40px;height:40px;object-fit:cover;border-radius:4px;">';
            }},
            {field: 'name', title: '{:t("plugin_ui.name")}', minWidth: 150},
            {field: 'version', title: '{:t("version_ui.version_suffix")}', width: 80},
            {field: 'price', title: '{:t("plugin_ui.price")}', width: 100, templet: function(d){
                return d.price == 0 ? '<span class="layui-badge layui-badge-green">{:t('upgrade.free')}</span>' : '<span class="layui-badge layui-badge-orange">¥'+d.price+'</span>';
            }},
            {field: 'download_count', title: '{:t("wxpay_ui.download")}', width: 80},
            {field: 'rating_avg', title: '{:t("plugin_ui.rating")}', width: 80},
            {field: 'status', title: '{:t("common.status")}', width: 100, templet: function(d){
                switch(d.status){
                    case 0: return '<span class="layui-badge layui-badge-orange">{:t('plugin_ui.pending_review')}</span>';
                    case 1: return '<span class="layui-badge layui-badge-green">{:t('user_home.published')}</span>';
                    case 2: return '<span class="layui-badge layui-badge-gray">{:t('plugin_ui.off_shelf')}</span>';
                    case 3: return '<span class="layui-badge layui-badge-red">{:t('plugin_ui.review_rejected')}</span>';
                    default: return '-';
                }
            }},
            {field: 'reward_status', title: '{:t("plugin_ui.publish_reward")}', minWidth: 140, templet: function(d){
                if (d.reward_status === 'issued') {
                    var parts = [];
                    if (parseInt(d.reward_points, 10) > 0) parts.push(parseInt(d.reward_points, 10)+'{:t("accounting.point_unit")}');
                    if (parseFloat(d.reward_balance) > 0) parts.push('¥'+d.reward_balance+'{:t("accounting.balance")}');
                    return '<span class="layui-badge layui-badge-green">{:t('plugin_record.reward_received')}</span> '+parts.join(' + ');
                }
                if (d.reward_status === 'skipped') {
                    return '<span class="layui-badge layui-badge-gray" title="'+String(d.reward_reason || '').replace(/"/g, '&quot;')+'">{:t('plugin_record.reward_not_received')}</span>';
                }
                return '-';
            }},
            {field: 'audit_note', title: '{:t("plugin_ui.review_note")}', minWidth: 150, templet: function(d){
                return d.audit_note || '-';
            }},
            {field: 'created_at', title: '{:t("payment_ui.create_time")}', minWidth: 160},
            {title: '{:t("common.operation")}', toolbar: '#QH_TbBar', align: 'center', width: 260, unresize: true}
        ]]
    });

    form.on('submit(QH_TbSearch)', function (data) {
        insTb.reload({where: data.field, page: {curr: 1}});
        return false;
    });

    table.on('tool(QH_Table)', function (obj) {
        if (obj.event === 'purchases') {
            showPurchases(obj.data);
            return;
        }
        if (obj.event === 'edit') {
            layer.open({
                type: 2, title: '{:t("plugin_ui.edit_plugin")}',
                content: '{:url("/UserPlugin/create")}?id=' + obj.data.id,
                area: ['90%', '90%'], maxmin: true,
                end: function() { table.reload('QH_Table'); }
            });
        } else if (obj.event === 'del') {
            layer.confirm('{:t("plugin_record.confirm_delete_plugin")}', {skin:'layui-layer-admin',icon:3,shade:.1}, function(i) {
                layer.close(i);
                $.ajax({
                    type: "POST", url: '{:url("/UserPlugin/drop")}', data: {id: obj.data.id}, dataType: "json",
                    success: function(res) {
                        if (res.code == 0) { table.reload('QH_Table'); notice.msg(res.msg, {icon:1}); }
                        else { notice.msg(res.msg, {icon:2}); }
                    }
                });
            });
        }
    });

    function showPurchases(data) {
        var t2 = layui.table;
        layer.open({
            type: 1, title: '{:t("plugin_ui.purchase_records")} - '+data.name, area: ['700px', '480px'],
            content: '<table id="QH_PurchaseTable" lay-filter="QH_PurchaseTable"></table>',
            success: function() {
                t2.render({
                    elem: '#QH_PurchaseTable', url: '{:url("/UserPlugin/pluginPurchases")}', method: 'post',
                    page: true, limit: 15, where: { plugin_id: data.id },
                    request: { pageName: 'current_page', limitName: 'limit' },
                    parseData: function(r){ return {code:r.code,msg:r.msg,count:r.data.data.total,data:r.data.data.data}; },
                    cols: [[
                        {field: 'username', title: '{:t("plugin_record.purchase_user")}', width: 150},
                        {field: 'paid_price', title: '{:t("plugin_record.paid_amount")}', width: 100, templet: function(d){ return d.order_pay_type==='points' ? '<span style="color:#ff5722;">'+parseInt(d.paid_price)+' {:t("accounting.point_unit")}</span>' : '<span style="color:#ff5722;">¥'+d.paid_price+'</span>'; }},
                        {field: 'order_no', title: '{:t("plugin_ui.order_number")}', minWidth: 180},
                        {field: 'paid_at', title: '{:t("plugin_record.purchase_time")}', width: 170}
                    ]]
                });
            }
        });
    }

});
</script>
