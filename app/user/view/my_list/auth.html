{include file="/public/header"}
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">
            <i class="layui-icon layui-icon-auz"></i> {:t('auth_portal.title')}
        </div>
        <div class="layui-card-body">
            <div class="layui-tab layui-tab-brief">
                <ul class="layui-tab-title">
                    {if $canManageAuth}<li class="{if $authTab == 'managed'}layui-this{/if}"><a href="{:url('/Auth/list', ['tab' => 'managed'])}">{:t('auth_portal.relation_managed')}</a></li>{/if}
                    <li class="{if $authTab == 'bound'}layui-this{/if}"><a href="{:url('/Auth/list', ['tab' => 'bound'])}">{:t('auth_portal.relation_bound')}</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            {notempty name="replace_notice"}
            <div class="layui-form-item formBasForm">
                <div class="sf-tag layui-badge-blue">
                    {$replace_notice|raw}
                </div>
            </div>
            {/notempty}
            <form class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('auth_portal.content')}</label>
                        <div class="layui-input-inline">
                            <input name="text" class="layui-input" placeholder="{:t('common_ui.input_id_or_content')}"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">{:t('common.status')}</label>
                        <div class="layui-input-inline">
                            <select name="status" class="ew-select-fixed">
                                <option value="">{:t('common_ui.select_status')}</option>
                                <option value="1">{:t('common.normal')}</option>
                                <option value="0">{:t('common.ban')}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-btn-container">&emsp;&emsp;
                        <button class="layui-btn icon-btn" lay-filter="SF_TbSearch" lay-submit>
                            <i class="layui-icon">&#xe615;</i>{:t('common_ui.search_btn')}
                        </button>
                    </div>
                </div>
            </form>
            <!-- 数据表格 -->

            <table id="SF_Table" lay-filter="SF_Table"></table>
        </div>
    </div>
</div>
<!-- 表格操作列 -->
<script type="text/html" id="SF_TbBar">
    <a class="layui-btn layui-btn-primary layui-btn-sm" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>{:t('common.edit')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon layui-icon-delete"></i>{:t('common_ui.unbind')}</a>
</script>
<!-- 表格状态列 -->

<script type="text/html" id="SF_Tbid">
    <span id="SF_span_{{d.id}}">{{d.status==1?'<span class="layui-badge-dot layui-bg-sf-indigo"></span> '+d.id:'<span class="layui-badge-dot layui-bg-red"></span> '+d.id}}</span>
</script>
<!-- 表单弹窗 -->
<script type="text/html" id="SF_EditDialog">
    <form id="SF_EditForm" lay-filter="SF_EditForm" class="layui-form model-form">
        <input name="id" type="hidden"/>

        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">{:t('auth_portal.auth_content_label')}</label>
            <div class="layui-input-block">
                <input type="text" name="auth_info" placeholder="{:t('auth_portal.auth_content_placeholder')}" class="layui-input"
                       lay-verType="tips" lay-verify="required"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">QQ:</label>
            <div class="layui-input-block">
                <input type="number" name="qq" placeholder="{:t('cdkey.step_enter_auth_qq')}" class="layui-input"
                       lay-verType="tips" lay-verify="required"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">{:t('auth_portal.auth_duration_label')}</label>
            <div class="layui-input-block">
                <select id="auth_price_list" name="type" class="layui-input ew-select-fixed" lay-filter="type">
                    <option value="">{:t('auth_portal.select_duration')}</option>
                </select>
            </div>
        </div>
        <div id="diy" style="display: none">
            <div class="layui-form-item">
                <label class="layui-form-label layui-form-required">{:t('auth_portal.expire_time_label')}</label>
                <div class="layui-input-block">
                    <input type="text" id="test" name="endtime" placeholder="{:t('auth_portal.select_expire_time')}" class="icon-date layui-input"
                           lay-verType="tips"/>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:t('auth_portal.replace_price_label')}</label>
            <div class="layui-input-block">
                <input type="text" name="remainderReplacePrice" class="layui-input layui-disabled"
                       lay-verType="tips" disabled/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:t('auth_portal.renewal_price_label')}</label>
            <div class="layui-input-block">
                <input type="text" id="input_price" name="price" value="￥0" class="layui-input layui-disabled"
                       lay-verType="tips" disabled/>
            </div>
        </div>
        <div class="layui-form-item text-right">
            <button class="layui-btn" lay-filter="SF_EditSubmit" lay-submit>{:t('common.save')}</button>
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">{:t('common.cancel')}</button>
        </div>
    </form>
</script>

{include file="/public/footer"}
<script type="text/javascript" src="{__JS__}qq-oauth.js?v=20261004_3"></script>
<script>
    layui.use(['layer', 'form', 'table', 'admin', 'notice', 'laydate', 'jquery'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var admin = layui.admin;
        var notice = layui.notice;
        var laydate = layui.laydate;
        var authDiscountRate = Number({$userInfo['addauth_discount']});

        function discountedMoney(unitPrice, quantity) {
            var unitCents = Math.round(Number(unitPrice || 0) * 100);
            var totalCents = Math.round(unitCents * Math.max(0, Number(quantity || 0)) * authDiscountRate);
            return (totalCents / 100).toFixed(2);
        }

        function dailyDiscountedMoney(totalPrice, days, quantity) {
            var dayCount = Math.max(1, parseInt(days, 10) || 1);
            var dailyCents = Math.ceil(Math.round(Number(totalPrice || 0) * 100) / dayCount);
            var totalCents = Math.round(dailyCents * Math.max(0, Number(quantity || 0)) * authDiscountRate);
            return (totalCents / 100).toFixed(2);
        }

        /* 渲染表格 */
        var insTb = table.render({
            elem: '#SF_Table',
            url: '{:url("/MyList/auth")}',
            method: 'post',
            page: true,
            skin: 'line',
            size: 'lg',
            toolbar: ['<p>',
                '<button lay-event="add" class="layui-btn layui-btn-sm icon-btn"><i class="layui-icon">&#xe654;</i>{:t('profile.bind')}</button>&nbsp;',
                '<button lay-event="del" class="layui-btn layui-btn-sm layui-btn-danger icon-btn"><i class="layui-icon">&#xe640;</i>{:t('common_ui.unbind')}</button>',
                '</p>'].join(''),
            cellMinWidth: 100,
            request: {
                pageName: 'current_page' //页码的参数名称，默认：page
                ,limitName: 'limit' //每页数据量的参数名，默认：limit
            },
            parseData: function(res){ //res 即为原始返回的数据
                return {
                    "code": res.code, //解析接口状态
                    "msg": res.msg, //解析提示文本
                    "count": res.data.data.total, //解析数据长度
                    "data": res.data.data.data //解析数据列表
                };
            },
            cols: [[
                {type: 'checkbox', fixed: true},
                {field: 'id', title: 'ID', templet: '#SF_Tbid', sort: true, width: 80, fixed: true},
                {field: 'appName', title: '{:t("profile.application")}', sort: true, minWidth: 120, templet: function (d) {
                        return '<span class="layui-badge layui-badge-orange">'+d.appName+'</span>';
                    }},
                {field: 'auth_info', title: '{:t("common_ui.auth_content")}', sort: true, minWidth: 160},
                {field: 'qq', title: '{:t("common_ui.auth_qq")}', sort: true, minWidth: 120},
                {
                    field: 'endtime', title: '{:t("common_ui.expire_time")}', align: 'right', templet: function (d) {
                        if (d.permanent_switch == '1') {
                            return '<span class="layui-badge layui-badge-green">{:t('auth_portal.permanent')}</span>';
                        } else {
                            if(checkEndTime(d.endtime) == false){
                                return '<span class="layui-badge layui-badge-orange">{:t('auth_portal.expired')}</span>';
                            }else{
                                return '<span class="layui-badge layui-badge-blue">'+d.endtime+'</span>';
                            }
                        }
                    }, sort: true, minWidth: 180
                },
                {field: 'authcode', title: '{:t("auth_portal.more_info")}', minWidth: 100, templet: function (d) {
                        return '<a class="layui-btn layui-btn-xs" lay-event="seeInfo">{:t('auth_portal.view')}</a>';
                    }
                },
                {field: 'sign', title: '{:t("common_ui.feature_code")}', sort: true, minWidth: 100},
                {field: 'addtime', title: '{:t("common.add_time")}', sort: true, minWidth: 160},
                {field: 'status', title: '{:t("common.status")}', sort: true, minWidth: 80, templet: function (d) {
                        if(d.status == 1){
                            return '<span class="layui-badge layui-badge-green">{:t('common.normal')}</span>';
                        }else{
                            return '<span class="layui-badge layui-badge-red">{:t('common.ban')}</span>';
                        }
                    }
                },
                {title: '{:t("common.operation")}', toolbar: '#SF_TbBar', align: 'center', minWidth: 180}
            ]]
        });
        function checkEndTime(date){
            var oDate1 = new Date();
            var oDate2 = new Date(date);
            if(oDate1.getTime() > oDate2.getTime()){
                return false;
            } else  if(oDate1.getTime() < oDate2.getTime()){
                return true;
            }else if(oDate1.getTime() == oDate2.getTime()){
                return false;
            }
        }

        form.on('select(type)', function (data) {
            let diy = $("#auth_price_list option:selected").attr('diy');
            let price = $("#auth_price_list option:selected").attr('price');
            if (diy == "1") {
                $("#diy").css("display", "inherit");
                if(data.value == ''){
                    $('#input_price').val('{:t("common_ui.enter_expire_first")}');
                }else{
                    $('#input_price').val('￥0');
                }
            }else{
                $("#diy").css("display", "none");
                if(data.value == ''){
                    $('#input_price').val('{:t("common_ui.select_time_first")}');
                }else{
                    $('#input_price').val('￥' + discountedMoney(price, 1));
                }
            }
        });

        /* 表格搜索 */
        form.on('submit(SF_TbSearch)', function (data) {
            insTb.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        function DateDiff(sDate2, sDate1) {
            var aDate, oDate1, oDate2, iDays, info, time;

            if(sDate1 == null){
                oDate1 = new Date();  //转换为yyyy-MM-dd格式
            } else {
                info = sDate1.split(" ");
                aDate = info[0].split("-");
                oDate1 = new Date(aDate[0] + '-' + aDate[1] + '-' + aDate[2]);
            }

            info = sDate2.split(" ");
            aDate = info[0].split("-");
            time = info[1].split(":");
            oDate2 = new Date(aDate[0] + '-' + aDate[1] + '-' + aDate[2]);
            iDays = Math.ceil((oDate2 - oDate1) / 1000 / 60 / 60 / 24); //把相差的毫秒数转换为天数
            if(time[0] != '00' || time[1] != '00' || time[2] != '00'){
                iDays++;
            }
            if(iDays < 0){
                iDays = 0;
            }
            return iDays;  //返回相差天数
        }

        /* 表格工具条点击事件 */
        table.on('tool(SF_Table)', function (obj) {
            if (obj.event === 'edit') { // 修改
                showEditModel(obj.data);
            } else if (obj.event === 'del') { // 删除
                doDel(obj);
            } else if (obj.event === 'seeInfo') {
                admin.open({
                    title: t('auth_portal.view_code_title', {name:obj.data.auth_info}),
                    type: 1,
                    content: '<div class="layui-card">' +
                        '<div class="layui-card-body layui-form layui-form-pane">' +
                        '<div class="layui-form-item" pane>' +
                        '<label class="layui-form-label">{:t('common_ui.auth_code')}</label>' +
                        '<div class="layui-input-block">' +
                        '<input type="text" id="copy" class="layui-input layui-disabled" value="'+obj.data.authcode+'"/>' +
                        '</div>' +
                        '</div>' +
                        '<div class="layui-form-item layui-form-text">' +
                        '<label class="layui-form-label">{:t('auth_portal.ip_restriction')}</label>' +
                        '<div class="layui-input-block">' +
                        '<textarea name="ip" class="layui-textarea layui-disabled" style="height:100px" placeholder="{:t('auth_portal.unlimited')}" disabled>'+obj.data.ip+'</textarea>' +
                        '</div>' +
                        '</div>' +
                        '<a class="layui-btn layui-btn-fluid" onclick="copy()">{:t('auth_portal.copy_code')}</a></div></div>'
                });
            }
            laydate.render({
                elem: '#test', //指定元素
                mark: {
                    '0-3-15': 'SF'
                },
                type: 'datetime',
                trigger: 'click',
                done: function(value, date){
                    let price = $("#auth_price_list option:selected").attr('price');
                    let day = $("#auth_price_list option:selected").attr('day');
                    if(value == ''){
                        $('#input_price').val('{:t("common_ui.enter_expire_first")}');
                    }else{
                        $('#input_price').val('￥' + dailyDiscountedMoney(price, day, DateDiff(value, obj.data.endtime)));
                    }
                }
            });
        });

        window.copy = function (){
            notice.msg('{:t("common.loading")}', {icon: 4, close: true});
            var e = document.getElementById("copy");
            e.select();
            document.execCommand("Copy");//执行复制
            notice.destroy();
            notice.msg('{:t("auth_portal.copy_success")}', {icon: 1, audio:'1'});
        }

        /* 表格头工具栏点击事件 */
        table.on('toolbar(SF_Table)', function (obj) {
            if (obj.event === 'add') { // 添加
                binding();
            } else if (obj.event === 'del') { // 删除
                var checkRows = table.checkStatus('SF_Table');
                if (checkRows.data.length === 0) {
                    notice.msg('{:t("confirm.please_select_data")}', {icon: 3, audio:'1'});
                    return;
                }
                var ids = checkRows.data.map(function (d) {
                    return d.id;
                });
                doDel({ids: ids});
            }
        });

        var qqAuthProofToken = '';
        function authEscape(value){ return $('<div>').text(value == null ? '' : String(value)).html(); }
        function handleAuthOauthResult(result){
            notice.destroy();
            if(!result || result.code != 0 || !result.data || result.data.status !== 'verified'){
                notice.msg((result && result.msg) || '{:t("auth_portal.qq_verify_failed")}', {icon:2});
                return;
            }
            qqAuthProofToken = result.data.proof_token || '';
            $.ajax({type:'POST',url:'/api.php/Social/legacyAuth',data:{action:'list',proof_token:qqAuthProofToken},dataType:'json',success:function(res){
                if(res.code != 0){ notice.msg(res.msg,{icon:2}); return; }
                var rows=(res.data&&res.data.list)||[],content='<div class="layui-card"><div class="layui-card-body"><form class="layui-form"><div class="layui-form-item"><label class="layui-form-label layui-form-required">{:t("auth_portal.data_list")}</label><div class="layui-input-block"><input type="checkbox" value="checkall" lay-skin="primary" lay-filter="allChoose" title="{:t('auth_portal.select_all')}">';
                $.each(rows,function(_,row){content+='<input type="checkbox" name="list[]" value="'+parseInt(row.id,10)+'" lay-skin="primary" title="'+authEscape(row.auth_info)+'">';});
                content+='</div></div><div class="layui-form-item text-right"><button type="button" class="layui-btn" lay-filter="BindingSubmit" lay-submit>{:t('profile.bind')}</button></div></form></div></div>';
                admin.open({type:1,title:'{:t("auth_portal.select_bind_data")}',content:content,success:function(){form.render();}});
            },error:function(){notice.msg('{:t("auth_portal.list_load_failed")}',{icon:2});}});
        }
        function binding(){
            notice.msg('{:t("auth_portal.opening_qq")}',{icon:4,close:true});
            SfQqOauth.start({
                url:'/api.php/Social/verify',
                data:{scene:'auth_binding',return_to:location.pathname+location.search},
                onResult:handleAuthOauthResult,
                onError:function(message){notice.destroy();notice.msg(message,{icon:2});}
            });
        }
        SfQqOauth.resume(handleAuthOauthResult,function(message){notice.msg(message,{icon:2});});

        form.on('checkbox(allChoose)', function (data) {
            $("input[name='list[]']").each(function () {
                this.checked = data.elem.checked;
            });
            form.render('checkbox');
            return false;
        });

        form.on('submit(BindingSubmit)', function (data) {
            data.field.action = 'bind';
            data.field.proof_token = qqAuthProofToken;
            notice.msg('{:t("common.loading")}', {icon: 4, close: true});
            $.ajax({
                type: "POST",
                url: '/api.php/Social/legacyAuth',
                data: data.field,
                dataType: "json",
                success: function(data) {
                    notice.destroy();
                    layer.closeAll();
                    if(data.code == 0){
                        table.reload('SF_Table');
                        notice.success({
                            title: '{:t("common_ui.bind_notice")}',
                            message: data.msg,
                            animateInside:true,
                            position:'topCenter',
                            transitionOut:'flipOutX',
                            transitionOutMobile: 'flipOutX',
                            displayMode:'2',
                            audio:'1'
                        });
                    }else{
                        notice.error({
                            title: '{:t("common_ui.bind_notice")}',
                            message: data.msg,
                            animateInside:true,
                            position:'topCenter',
                            transitionOut:'flipOutX',
                            transitionOutMobile: 'flipOutX',
                            displayMode:'2',
                            audio:'1'
                        });
                    }
                },
                error: function() {
                    notice.destroy();
                    notice.error({
                        title: '{:t("common_ui.bind_notice")}',
                        message: '{:t("common.server_error")}',
                        animateInside:true,
                        position:'topCenter',
                        transitionOut:'flipOutX',
                        transitionOutMobile: 'flipOutX',
                        displayMode:'2',
                        audio:'1'
                    });
                }
            });
            return false;
        });
        /* 显示表单弹窗 */
        function showEditModel(mData) {
            admin.popupRight({
                type: 1,
                title: '{:t("auth_portal.edit_auth")}',
                content: $('#SF_EditDialog').html(),
                success: function (layero, dIndex) {

                    notice.msg('{:t("common.loading_text")}', {icon: 4, close: true});
                    $.ajax({
                        type: "POST",
                        url: '{:url("/Auth/getAuthPriceList")}',
                        dataType: "json",
                        success: function(data) {
                            notice.destroy();
                            if (data.code == 0) {
                                notice.msg("{:t('common.list_success')}", {icon: 1, audio:'1'});
                                var content = '<option value="-1" diy="0" day="0" price="0">{:t('auth_portal.no_renewal')}</option>';
                                $.each(data.data,function(index, value){
                                    $.each(value,function(index, value){
                                        if(value.diy_switch == 1){
                                            content += '<option value="'+value.id+'" diy="1" day="'+value.day+'" price="'+value.money+'">'+value.name+'</option>';
                                        }else{
                                            content += '<option value="'+value.id+'" diy="0" price="'+value.money+'">'+value.name+'</option>';
                                        }
                                    });
                                });
                                $("#auth_price_list").html(content);
                            } else {
                                notice.msg(data.msg, {icon: 2, audio:'1'});
                            }
                            form.render();
                            form.val('SF_EditForm', mData);
                        },
                        error: function() {
                            notice.destroy();
                            notice.msg("{:t('common.server_error')}", {icon: 2, audio:'1'});
                        }
                    });
                    // 表单提交事件
                    form.on('submit(SF_EditSubmit)', function (data) {
                        notice.msg('{:t("common.loading")}', {icon: 4, close: true});
                        data.field.bindingType = 'auth';
                        $.ajax({
                            type: "POST",
                            url: '{:url("/MyList/editBinding")}',
                            data: data.field,
                            dataType: "json",
                            success: function(data) {
                                notice.destroy();
                                if (data.code == 0) {
                                    table.reload('SF_Table');
                                    notice.msg(data.msg, {icon: 1, audio:'1'});
                                } else {
                                    notice.msg(data.msg, {icon: 2, audio:'1'});
                                }
                            },
                            error: function() {
                                notice.destroy();
                                notice.msg("{:t('common.server_error')}", {icon: 2, audio:'1'});
                            }
                        });
                        return false;
                    });
                    // 禁止弹窗出现滚动条
                    $(layero).children('.layui-layer-content').css('overflow', 'visible');
                }
            });
        }

        /* 删除 */
        function doDel(obj) {
            layer.confirm('{:t("auth_portal.confirm_unbind")}', {
                skin: 'layui-layer-admin',
                icon: 3,
                shade: .1
            }, function (i) {
                layer.close(i);
                notice.msg('{:t("common.loading")}', {icon: 4, close: true});
                $.ajax({
                    type: "POST",
                    url: obj.data ? '{:url("/MyList/unbind")}' : '{:url("/MyList/batchUnbind")}',
                    data: {type:'auth', id: obj.data ? obj.data.id : obj.ids.join(',')},
                    dataType: "json",
                    success: function(data) {
                        notice.destroy();
                        if (data.code == 0) {
                            table.reload('SF_Table');
                            notice.msg(data.msg, {icon: 1, audio:'1'});
                        }else{
                            notice.msg(data.msg, {icon: 2, audio:'1'});
                        }
                    },
                    error: function() {
                        notice.destroy();
                        notice.msg("{:t('common.server_error')}", {icon: 2, audio:'1'});
                    }
                });
            });
        }
    });
</script>
